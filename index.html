    <div class="badges"><span class="b asg">Owner: ${esc(userName(p.owner))}</span>${p.start?`<span class="b">Start ${fmtShort(p.start)}</span>`:''}${p.end?`<span class="b">Target ${fmtShort(p.end)}</span>`:''}<span class="b">Status: ${esc(p.status||'active')}</span></div>
    ${bar(pr, 'Overall progress')}
    <div class="f" style="margin-top:12px">People involved<div class="chips">${ppl.map(id=>`<span class="chip">${esc(userName(id))}${id===p.owner?' <small>(owner)</small>':''}${mg&&id!==p.owner?`<button type="button" data-act="pm-del" data-id="${id}" data-pid="${p.id}" aria-label="Remove">×</button>`:''}</span>`).join('')}</div></div>
    ${mg?`<div class="row" style="align-items:flex-end"><div style="flex:1;min-width:200px">${picker('pmAdd', USERS.filter(u=>!ppl.includes(u.id)), '', 'Add a person', 'Type a name or a letter')}</div><button type="button" class="btn ghost" data-act="pm-add" data-pid="${p.id}">Add to project</button></div>
    <details style="margin-top:12px"><summary class="hint" style="cursor:pointer">Edit project details</summary>
      <form class="projedit" data-id="${p.id}" novalidate style="margin-top:8px">

        <label class="f">What is it about?<textarea name="desc" rows="3">${esc(p.description)}</textarea></label>
        <div class="row"><label class="f">Start date<input type="date" name="start" value="${p.start||''}"></label><label class="f">Target end date<input type="date" name="end" value="${p.end||''}"></label>
          <label class="f">Status<select name="status" class="sel">${['active','on hold','completed'].map(s=>`<option ${s===(p.status||'active')?'selected':''}>${s}</option>`).join('')}</select></label></div>
        <div class="row end" style="justify-content:space-between"><button type="button" class="btn sm ghost danger" data-act="proj-del" data-id="${p.id}">Delete project</button><button class="btn">Save</button></div>
      </form></details>`:''}</section>`;

  /* schedule */
  const ms = (p.milestones||[]).slice().sort((x,y)=>(x.due||'9').localeCompare(y.due||'9'));
  h += `<section class="card"><div class="sec-h"><h2>Schedule</h2>${mg?`<button class="btn sm ghost" data-act="ms-ai" data-id="${p.id}">Suggest a schedule with AI</button>`:''}</div>
    ${gantt(p, d) || note(mg?'No milestones yet. Add the main steps below, or let AI suggest a schedule from the project description.':'No schedule yet.')}`;
  const sug = (ui.msSug||{})[p.id];
  if (sug && sug.length) h += `<div class="crow"><b>AI suggestion</b> <span class="hint">(check it before adding)</span>
    <ul style="margin:6px 0 8px;padding-left:20px">${sug.map(m=>`<li>${esc(m.title)} — ${m.start?fmtShort(m.start):'?'} to ${m.due?fmtShort(m.due):'?'}${m.owner?' · '+esc(userName(m.owner)):''}</li>`).join('')}</ul>
    <div class="row end"><button class="btn sm ghost" data-act="ms-sug-clear" data-id="${p.id}">Discard</button><button class="btn sm" data-act="ms-sug-add" data-id="${p.id}">Add all to schedule</button></div></div>`;
  if (ms.length) h += `<div class="tblwrap"><table class="mst"><thead><tr><th>Milestone</th><th>Owner</th><th>Dates</th><th>Done</th><th></th></tr></thead><tbody>${ms.map(m=>{
    const can = mg || m.owner===me, late = m.due && m.due<d && (m.progress||0)<100;
    return `<tr class="${late?'late':''}"><td>${esc(m.title)}${late?' <span class="b emg">Late</span>':''}</td><td>${esc(m.owner?userName(m.owner):'—')}</td><td>${m.start?fmtShort(m.start):'?'} → ${m.due?fmtShort(m.due):'?'}</td>
      <td>${can?`<input type="number" class="pn ms-pn" min="0" max="100" step="5" value="${m.progress||0}" data-id="${m.id}" aria-label="Percent done">%`:`${m.progress||0}%`}</td>
      <td class="acts">${can?`<button class="btn sm ghost" data-act="ms-save" data-pid="${p.id}" data-id="${m.id}">Save</button>`:''}${mg?`<button class="btn sm ghost danger" data-act="ms-del" data-pid="${p.id}" data-id="${m.id}" aria-label="Delete milestone">×</button>`:''}</td></tr>`; }).join('')}</tbody></table></div>`;
  if (mg) h += `<form class="msf" data-id="${p.id}" novalidate style="margin-top:12px"><h3 class="sub" style="margin-top:0">Add a milestone</h3>
    <label class="f grow">Milestone<input name="title" maxlength="120" placeholder="e.g. Machine delivered to site"></label>
    <div class="row"><label class="f">Owner<select name="owner" class="sel"><option value="">—</option>${ppl.map(id=>`<option value="${id}">${esc(userName(id))}</option>`).join('')}</select></label>
      <label class="f">Start<input type="date" name="start" value="${d}"></label><label class="f">Due<input type="date" name="due"></label></div>
    <div class="err" hidden></div><div class="row end"><button class="btn">Add milestone</button></div></form>`;
  h += `</section>`;

  /* linked tasks */
  const ts = projTasks(p).sort((a,b)=>b.startDate.localeCompare(a.startDate));
  h += `<section class="card"><div class="sec-h"><h2>Daily work on this project</h2>${pill('open', `${ts.length} task${ts.length===1?'':'s'}`)}</div>
    ${ts.length ? `<div class="tblwrap"><table class="mst"><thead><tr><th>Task</th><th>Person</th><th>Type</th><th>Started</th><th>Progress</th></tr></thead><tbody>${ts.slice(0,60).map(t=>{ const pv = taskProg(t,d);
      return `<tr><td>${esc(t.title)}</td><td>${esc(userName(t.owner))}</td><td>${t.category==='extra'?'Additional':'Planned'} · ${esc(t.priority)}</td><td>${fmtShort(t.startDate)}</td><td class="pct ${pv>=100?'full':'part'}">${pv}%</td></tr>`; }).join('')}</tbody></table></div>`
      : note('No tasks linked yet. When anyone adds a task in My day, or a manager assigns one, they can choose this project.')}</section>`;

  /* files */
  const fs = db.pfiles.filter(f=>f.projectId===p.id), folders = [...new Set(fs.map(f=>f.folder))].sort();
  const dr = DRIVE && DRIVE!=='loading' ? DRIVE : null;
  h += `<section class="card"><div class="sec-h"><h2>Files</h2>${fs[0]&&fs[0].projectFolderUrl?`<a class="btn sm ghost" href="${esc(fs[0].projectFolderUrl)}" target="_blank" rel="noopener">Open in Google Drive</a>`:''}</div>`;
  if (dr && !dr.drive) h += note('Google Drive is not connected yet, so files cannot be uploaded. The administrator needs to add the Google keys (see the setup guide).', false, true);
  else h += `<label class="upl"><input type="file" class="pf-in" data-id="${p.id}" multiple ${!dr?'disabled':''}><span class="btn ghost">Upload files</span><span class="hint" style="margin:0">PDF, Word, Excel, PowerPoint, photos… up to 25 MB each. AI gives each file a clear name and puts it in the right folder in Google Drive.</span></label>
    <div id="upl" class="hint" ${UPL[p.id]?'':'hidden'}>${esc(UPL[p.id]||'')}</div>`;
  if (!fs.length) h += `<div class="empty">No files yet.</div>`;
  folders.forEach(fo=>{ const inF = fs.filter(f=>f.folder===fo).sort((a,b)=>b.at.localeCompare(a.at));
    h += `<div class="ffold">${FOLDER_IC}<span>${esc(fo)}</span><span class="b">${inF.length}</span>${inF[0].folderUrl?`<a class="hint" href="${esc(inF[0].folderUrl)}" target="_blank" rel="noopener" style="margin:0">open folder</a>`:''}</div>`
      + inF.map(f=>`<div class="frow"><div class="fn"><b>${esc(f.name)}</b>${f.summary?`<div class="hint" style="margin:2px 0 0">${esc(f.summary)}</div>`:''}<div class="hint" style="margin:2px 0 0">${esc(userName(f.by))} · ${fmtShort(f.at.slice(0,10))}${f.original&&f.original!==f.name?` · was “${esc(f.original)}”`:''}${f.readable===false?' · AI could not read the contents':''}</div></div>
        <div class="acts"><button class="btn sm ghost" data-act="pf-get" data-id="${f.id}">Download</button>${f.url?`<a class="btn sm ghost" href="${esc(f.url)}" target="_blank" rel="noopener">Drive</a>`:''}${(f.by===me||mg)?`<button class="btn sm ghost danger" data-act="pf-del" data-id="${f.id}">Remove</button>`:''}</div></div>`).join(''); });
  h += `</section>`;

  /* chat + AI */
  const msgs = db.pchat.filter(m=>m.projectId===p.id).sort((a,b)=>a.at.localeCompare(b.at)).slice(-150);
  h += `<section class="card"><div class="sec-h"><h2>Project chat</h2><span class="hint" style="margin:0">Everyone in the project, the GM and the CEO can read this</span></div>
    <div class="pchat">${msgs.length ? msgs.map(m=>{
      if (m.sys) return `<div class="msg sys">${esc(userName(m.by))} ${esc(m.text)} · ${fmtTime(m.at)}</div>`;
      const fl = (m.files||[]).map(id=>db.pfiles.find(f=>f.id===id)).filter(Boolean);
      return `<div class="msg ${m.ai?'ai':m.by===me?'me':''}"><small>${m.ai?`AI assistant · asked by ${esc(userName(m.by))}`:esc(userName(m.by))}${m.toAi?' → AI':''} · ${fmtTime(m.at)}</small>${esc(m.text)}${fl.length?`<div>${fl.map(f=>`<button class="btn sm ghost fchip" data-act="pf-get" data-id="${f.id}">${FILE_IC}${esc(f.name)}</button>`).join('')}</div>`:''}</div>`; }).join('') : '<div class="empty">No messages yet. Say hello, or ask the AI about this project.</div>'}
      ${AIBUSY[p.id]?'<div class="msg ai"><small>AI assistant</small>Thinking…</div>':''}</div>
    <form class="pchatf" data-id="${p.id}" novalidate><label class="f grow"><span class="sr">Message</span><textarea name="txt" rows="2" placeholder="Write a message… or ask the AI, e.g. “Find the latest quotation” or “What did the contract say about payment?”"></textarea></label>
      <div class="row end"><button type="button" class="btn ghost" data-act="pc-ai" ${AIBUSY[p.id]?'disabled':''}>Ask AI</button><button class="btn">Send</button></div></form></section>`;
  return h;
}
const FOLDER_IC = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>';
const FILE_IC = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/></svg>';
const fmtTime = iso => { try{ const dt = new Date(iso); return dt.toLocaleString('en-GB', { timeZone:'Asia/Dubai', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' }); }catch(_){ return ''; } };

function addMembers(p, ids){
  const add = ids.filter(id=>id && id!==p.owner && !(p.members||[]).includes(id)); if (!add.length) return;
  p.members = (p.members||[]).concat(add);
  add.forEach(id=>notify(id, `${userName(ui.user)} added you to the project “${p.name}”.`, nowAbs(), null));
  emailPeople(add, `You were added to the project “${p.name}”`, `${userName(ui.user)} added you to the project “${p.name}”.${p.description?'\n\n'+p.description:''}`);
}
function createProject(form){
  const err = form.querySelector('.err'), fail = m => { err.hidden=false; err.textContent=m; };
  const name = form.name.value.trim(), start = form.start.value, end = form.end.value;
  if (!name) return fail('Please give the project a name.');
  if (start && end && end<start) return fail('The end date is before the start date.');
  const p = { id:uid(), name, description:form.desc.value.trim(), owner:ui.user, members:[], start, end, status:'active', milestones:[], createdAt:new Date().toISOString() };
  db.projects.push(p); addMembers(p, ui.newMembers||[]); ui.newMembers = []; ui.proj = p.id; save(); render();
}
function saveProjectEdit(form){
  const p = projById(form.dataset.id); if (!canManageProject(p, ui.user)) return;
  const name = form.name.value.trim(); if (!name) return;
  Object.assign(p, { name, description:form.desc.value.trim(), start:form.start.value, end:form.end.value, status:form.status.value }); save(); render(); tip('Saved', 'Project details updated.');
}
function addMilestone(form){
  const p = projById(form.dataset.id), err = form.querySelector('.err'); if (!canManageProject(p, ui.user)) return;
  const title = form.title.value.trim(), owner = form.owner.value, start = form.start.value, due = form.due.value;
  if (!title){ err.hidden=false; err.textContent='Write the milestone.'; return; }
  if (start && due && due<start){ err.hidden=false; err.textContent='The due date is before the start date.'; return; }
  (p.milestones = p.milestones||[]).push({ id:uid(), title, owner, start, due, progress:0 });
  if (owner && owner!==ui.user){ notify(owner, `You own the milestone “${title}” in the project “${p.name}”${due?' (due '+fmtShort(due)+')':''}.`, nowAbs(), null);
    emailPeople([owner], `New milestone for you: ${title}`, `Project: ${p.name}\nMilestone: ${title}${due?'\nDue: '+due:''}`); }
  save(); render();
}
async function suggestSchedule(p, btn){
  const ppl = projPeople(p).map(id=>getUser(id));
  btn.disabled = true; btn.textContent = 'Thinking…';
  try{
    const txt = await aiAsk(`Plan a practical project schedule for a UAE manufacturing/trading company.\nProject: ${p.name}\nDescription: ${p.description||'-'}\nStart: ${p.start||now().date}\nTarget end: ${p.end||'(not set)'}\nTeam: ${ppl.map(u=>`${u.name} (${u.title})`).join('; ')}\n\nReply with JSON only, an array of 4 to 10 milestones in order: [{"title":"...","start":"YYYY-MM-DD","due":"YYYY-MM-DD","owner":"exact team member name or empty"}]. Keep all dates within the project dates.`);
    const m = txt.match(/\[[\s\S]*\]/); const arr = m ? JSON.parse(m[0]) : [];
    const byName = s => { const k = String(s||'').toLowerCase().trim(); const u = ppl.find(x=>x.name.toLowerCase()===k) || ppl.find(x=>k && x.name.toLowerCase().includes(k)); return u ? u.id : ''; };
    const ok = d => /^\d{4}-\d{2}-\d{2}$/.test(d||'') ? d : '';
    const list = arr.filter(x=>x && x.title).slice(0,12).map(x=>({ title:String(x.title).slice(0,120), start:ok(x.start), due:ok(x.due), owner:byName(x.owner) }));
    if (!list.length) throw new Error('The AI did not return a schedule. Try again, or add a longer description.');
    (ui.msSug = ui.msSug||{})[p.id] = list; render();
  }catch(e){ tip('AI could not help', e.message); btn.disabled = false; btn.textContent = 'Suggest a schedule with AI'; }
}
async function driveFetch(body){
  const { data:{ session } } = await sb.auth.getSession(); const cfg = window.PORTAL_CONFIG || {};
  const form = body instanceof FormData;
  return fetch(String(cfg.SUPABASE_URL).replace(/\/$/,'') + '/functions/v1/drive', { method:'POST',
    headers: Object.assign({ Authorization:'Bearer '+(session && session.access_token), apikey:cfg.SUPABASE_ANON_KEY }, form ? {} : { 'Content-Type':'application/json' }),
    body: form ? body : JSON.stringify(body) });
}
async function uploadFiles(pid, files){
  const list = [...files];
  for (let i=0; i<list.length; i++){
    const f = list[i];
    if (f.size > 25*1024*1024){ tip('File too large', `${f.name} is larger than 25 MB.`); continue; }
    UPL[pid] = `Uploading ${f.name}${list.length>1?` (${i+1} of ${list.length})`:''}… AI is reading it, naming it and choosing a folder.`;
    const el = document.getElementById('upl'); if (el){ el.hidden = false; el.textContent = UPL[pid]; }
    const fd = new FormData(); fd.append('action','upload'); fd.append('project', pid); fd.append('file', f, f.name);
    try{
      const r = await driveFetch(fd), d = await r.json().catch(()=>({}));
      if (!r.ok || d.error || !d.file) throw new Error(d.error || `Upload failed (${r.status}).`);
      applyRemote('pfiles', d.file.id, d.file);
      db.pchat.push({ id:uid(), projectId:pid, by:ui.user, sys:true, text:`uploaded “${d.file.name}” to ${d.file.folder}`, at:new Date().toISOString() }); save();
    }catch(e){ tip('Upload failed', `${f.name}: ${e.message}`); }
  }
  delete UPL[pid]; render();
}
async function downloadFile(id, btn){
  const f = db.pfiles.find(x=>x.id===id); if (!f) return;
  const old = btn.innerHTML; btn.disabled = true; btn.textContent = 'Downloading…';
  try{
    const r = await driveFetch({ action:'download', file:id });
    if (!r.ok){ const d = await r.json().catch(()=>({})); throw new Error(d.error || `Download failed (${r.status}).`); }
    const url = URL.createObjectURL(await r.blob()), a = document.createElement('a');
    a.href = url; a.download = f.name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url), 60000);
  }catch(e){ tip('Could not download', e.message); }
  finally{ btn.disabled = false; btn.innerHTML = old; }
}
async function removeFile(id, btn){
  const f = db.pfiles.find(x=>x.id===id); if (!f || !confirm(`Remove “${f.name}”? It goes to the Google Drive bin, where it can be restored for 30 days.`)) return;
  btn.disabled = true;
  try{ const r = await driveFetch({ action:'remove', file:id }), d = await r.json().catch(()=>({})); if (!r.ok || d.error) throw new Error(d.error || 'Failed');
    applyRemote('pfiles', id, null); db.pchat.push({ id:uid(), projectId:f.projectId, by:ui.user, sys:true, text:`removed “${f.name}”`, at:new Date().toISOString() }); save(); render(); }
  catch(e){ btn.disabled = false; tip('Could not remove', e.message); }
}
async function askProjectAI(pid, q){
  if (!q){ tip('Ask the AI', 'Type your question in the message box first.'); return; }
  db.pchat.push({ id:uid(), projectId:pid, by:ui.user, text:q, toAi:true, at:new Date().toISOString() });
  AIBUSY[pid] = true; save(); render();
  try{
    const { data, error } = await sb.functions.invoke('drive', { body:{ action:'ask', project:pid, question:q } });
    if (error || !data || data.error) throw new Error((data && data.error) || 'The AI service could not be reached.');
    db.pchat.push({ id:uid(), projectId:pid, by:ui.user, ai:true, text:data.answer, files:data.file_ids||[], at:new Date().toISOString() });
  }catch(e){ db.pchat.push({ id:uid(), projectId:pid, by:ui.user, sys:true, text:`asked the AI, but it failed: ${e.message}`, at:new Date().toISOString() }); }
  delete AIBUSY[pid]; save(); render();
}
function sendChat(form, toAi){
  const ta = form.querySelector('textarea[name=txt]'), txt = ta.value.trim(), pid = form.dataset.id;
  if (!canSeeProject(projById(pid), ui.user)) return;
  const ai = toAi || /^@ai\b/i.test(txt), q = txt.replace(/^@ai\b[:,]?\s*/i, '');
  if (ai){ ta.value = ''; ta.defaultValue = ''; askProjectAI(pid, q); return; }
  if (!txt) return;
  db.pchat.push({ id:uid(), projectId:pid, by:ui.user, text:txt.slice(0,4000), at:new Date().toISOString() });
  ta.value = ''; save(); render();
}
function projClick(act, a){
  if (act==='proj-open'){ ui.proj = a.dataset.id; ui.view = 'proj'; render(); window.scrollTo(0,0); return true; }
  if (act==='proj-back'){ ui.proj = null; render(); return true; }
  if (act==='pm-add'){
    const wrap = a.closest('.row'), hid = wrap.querySelector('.pick input[type=hidden]'), id = hid && hid.value;
    if (!id){ tip('Choose a person', 'Type a name, pick the person from the list, then press Add.'); return true; }
    if (a.dataset.pid){ const p = projById(a.dataset.pid); if (!canManageProject(p, ui.user)) return true; addMembers(p, [id]); save(); render(); }
    else { ui.newMembers = ui.newMembers||[]; if (!ui.newMembers.includes(id)) ui.newMembers.push(id);
      document.getElementById('newChips').innerHTML = chipsHtml(ui.newMembers); hid.value = ''; wrap.querySelector('.pick-in').value = ''; }
    return true;
  }
  if (act==='pm-del'){
    if (a.dataset.pid){ const p = projById(a.dataset.pid); if (!canManageProject(p, ui.user) || !confirm(`Remove ${userName(a.dataset.id)} from this project?`)) return true;
      p.members = (p.members||[]).filter(x=>x!==a.dataset.id); save(); render(); }
    else { ui.newMembers = (ui.newMembers||[]).filter(x=>x!==a.dataset.id); document.getElementById('newChips').innerHTML = chipsHtml(ui.newMembers); }
    return true;
  }
  if (act==='proj-del'){ const p = projById(a.dataset.id); if (!canManageProject(p, ui.user) || !confirm(`Delete the project “${p.name}”? Its files stay in Google Drive.`)) return true;
    p.status = 'deleted'; ui.proj = null; save(); render(); return true; }
  if (act==='ms-ai'){ suggestSchedule(projById(a.dataset.id), a); return true; }
  if (act==='ms-sug-clear'){ delete (ui.msSug||{})[a.dataset.id]; render(); return true; }
  if (act==='ms-sug-add'){ const p = projById(a.dataset.id), list = (ui.msSug||{})[p.id]||[]; if (!canManageProject(p, ui.user)) return true;
    p.milestones = (p.milestones||[]).concat(list.map(m=>({ id:uid(), ...m, progress:0 })));
    [...new Set(list.map(m=>m.owner).filter(x=>x && x!==ui.user))].forEach(o=>notify(o, `You own milestones in the project “${p.name}”.`, nowAbs(), null));
    delete ui.msSug[p.id]; save(); render(); return true; }
  if (act==='ms-save'){ const p = projById(a.dataset.pid), m = p && (p.milestones||[]).find(x=>x.id===a.dataset.id); if (!m || !(canManageProject(p, ui.user) || m.owner===ui.user)) return true;
    const inp = a.closest('tr').querySelector('.ms-pn'), v = Math.max(0, Math.min(100, parseInt(inp.value,10)||0));
    m.progress = v; m.updatedBy = ui.user; m.updatedAt = new Date().toISOString(); save(); render(); return true; }
  if (act==='ms-del'){ const p = projById(a.dataset.pid); if (!canManageProject(p, ui.user) || !confirm('Delete this milestone?')) return true;
    p.milestones = (p.milestones||[]).filter(x=>x.id!==a.dataset.id); save(); render(); return true; }
  if (act==='pf-get'){ downloadFile(a.dataset.id, a); return true; }
  if (act==='pf-del'){ removeFile(a.dataset.id, a); return true; }
  if (act==='pc-ai'){ sendChat(a.closest('form'), true); return true; }
  return false;
}

/* ===== Photo library: camera button in the header, photos stored in Supabase Storage (bucket "photos") ===== */
const CAM_IC = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 8a2 2 0 0 1 2-2h2l2-2h6l2 2h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="4"/></svg>';
const IMG_IC = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg>';
let CAMST = null, PHBOX = null;
const SURL = {};
function modalEl(id){ let el = document.getElementById(id); if (!el){ el = document.createElement('div'); el.id = id; el.className = 'modal'; el.setAttribute('role','dialog'); el.setAttribute('aria-modal','true'); document.body.appendChild(el); } return el; }
function camOpen(){ camStop(); CAMST = { stage:'choose' }; paintCam(); }
function camStop(){ if (CAMST && CAMST.stream){ CAMST.stream.getTracks().forEach(t=>t.stop()); CAMST.stream = null; } }
function camClose(){ camStop(); if (CAMST && CAMST.url) URL.revokeObjectURL(CAMST.url); CAMST = null; paintCam(); }
function paintCam(){
  const old = document.getElementById('camModal');
  if (!CAMST){ if (old) old.remove(); return; }
  const s = CAMST, el = modalEl('camModal'); let b = '';
  if (s.stage==='choose') b = `<h2>Add a photo</h2>
    <p class="hint">Saw something useful for our work or industry? Take a photo or attach a picture. Everyone in the company can see it in the Photo library.</p>
    <div class="cam-ch"><button type="button" class="btn cam-big" data-act="cam-shoot">${CAM_IC}<span>Take a photo</span></button>
      <button type="button" class="btn ghost cam-big" data-act="cam-pick">${IMG_IC}<span>Choose a picture from this device</span></button></div>
    <input type="file" id="camShoot" accept="image/*" capture="environment" hidden><input type="file" id="camPick" accept="image/*" hidden>
    <p class="hint" style="margin:0">Only pictures (JPG, PNG, WebP…) can be added.</p>
    <div class="err" ${s.err?'':'hidden'}>${esc(s.err||'')}</div><div class="row end"><button type="button" class="btn ghost" data-act="cam-x">Cancel</button></div>`;
  else if (s.stage==='live') b = `<h2>Take a photo</h2><video id="camVid" autoplay playsinline muted></video>
    <div class="row end"><button type="button" class="btn ghost" data-act="cam-x">Cancel</button><button type="button" class="btn" data-act="cam-snap">${CAM_IC}<span>Capture</span></button></div>`;
  else b = `<h2>Name this photo</h2><img class="cam-prev" src="${s.url}" alt="Preview of the photo">
    <form id="camForm" novalidate><label class="f">What is it?<input name="name" maxlength="120" placeholder="e.g. New coil stock at a Sharjah warehouse"></label>
      <label class="f">Note (optional)<textarea name="note" rows="2" placeholder="Where it was, why it matters"></textarea></label>
      <div class="err" hidden></div>
      <div class="row end"><button type="button" class="btn ghost" data-act="cam-again">Choose another</button><button class="btn" id="camSave">Save photo</button></div></form>`;
  el.innerHTML = `<div class="modal-box">${b}</div>`;
  if (s.stage==='live') document.getElementById('camVid').srcObject = s.stream;
  decorateSTT();
  const f = el.querySelector('input[name=name]') || el.querySelector('.btn'); if (f) f.focus();
}
async function camShoot(){
  const touch = window.matchMedia && matchMedia('(pointer: coarse)').matches;
  if (touch || !(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)){ document.getElementById('camShoot').click(); return; }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'environment', width:{ ideal:1920 } }, audio:false });
    CAMST = { stage:'live', stream }; paintCam();
  }catch(e){ CAMST.err = 'The camera could not be opened (no camera found, or permission was refused). You can choose a picture from this device instead.'; paintCam(); }
}
function camSnap(){
  const v = document.getElementById('camVid'); if (!v || !v.videoWidth) return;
  const c = document.createElement('canvas'); c.width = v.videoWidth; c.height = v.videoHeight; c.getContext('2d').drawImage(v, 0, 0);
  c.toBlob(b=>{ camStop(); camDetails(b); }, 'image/jpeg', 0.9);
}
function camFile(file){
  if (!file) return;
  if (!/^image\//.test(file.type||'')){ CAMST = { stage:'choose', err:'Only picture files can be added (JPG, PNG, WebP…).' }; paintCam(); return; }
  camDetails(file);
}
function camDetails(blob){ if (CAMST && CAMST.url) URL.revokeObjectURL(CAMST.url); CAMST = { stage:'details', raw:blob, url:URL.createObjectURL(blob) }; paintCam(); }
function loadImg(url){ return new Promise((ok, bad)=>{ const i = new Image(); i.onload = ()=>ok(i); i.onerror = bad; i.src = url; }); }
function shrink(img, max, q){
  const k = Math.min(1, max/Math.max(img.naturalWidth, img.naturalHeight)), c = document.createElement('canvas');
  c.width = Math.round(img.naturalWidth*k); c.height = Math.round(img.naturalHeight*k);
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img, 0, 0, c.width, c.height);
  return new Promise(r=>c.toBlob(b=>r({ blob:b, w:c.width, h:c.height }), 'image/jpeg', q));
}
async function camSave(form){
  const err = form.querySelector('.err'), fail = m => { err.hidden = false; err.textContent = m; };
  const name = form.name.value.trim(), noteTxt = form.note.value.trim();
  if (name.length < 3) return fail('Please write what the photo is (a few words).');
  const btn = document.getElementById('camSave'); btn.disabled = true; btn.textContent = 'Saving…';
  try{
    let img; try{ img = await loadImg(CAMST.url); }catch(_){ throw new Error('This picture format cannot be read here. Please use a JPG or PNG picture.'); }
    const [full, thumb] = await Promise.all([shrink(img, 2000, 0.85), shrink(img, 480, 0.75)]);
    const id = uid(), path = `${now().date}/${id}.jpg`, tpath = `thumbs/${id}.jpg`, st = sb.storage.from('photos');
    const a = await st.upload(path, full.blob, { contentType:'image/jpeg', upsert:false }); if (a.error) throw a.error;
    const b = await st.upload(tpath, thumb.blob, { contentType:'image/jpeg', upsert:false }); if (b.error) throw b.error;
    db.photos.push({ id, name, note:noteTxt, path, thumb:tpath, by:ui.user, at:new Date().toISOString(), w:full.w, h:full.h, size:full.blob.size });
    save(); camClose(); tip('Photo saved', 'It is now in the Photo library for everyone.');
    if (ui.view==='photos') render();
  }catch(e){ btn.disabled = false; btn.textContent = 'Save photo'; fail((e && e.message) || 'Could not save. Check your internet connection.'); }
}
async function signed(paths){
  const t = Date.now(), need = [...new Set(paths)].filter(p=>p && !(SURL[p] && SURL[p].until > t));
  if (need.length){ const { data } = await sb.storage.from('photos').createSignedUrls(need, 3600);
    (data||[]).forEach(x=>{ if (x.signedUrl) SURL[x.path] = { url:x.signedUrl, until:t + 50*60000 }; }); }
}
async function fillImgs(){
  if (!sb || !ui.authed) return;
  const imgs = [...document.querySelectorAll('img[data-path]')].filter(i=>!i.getAttribute('src'));
  if (!imgs.length) return;
  try{ await signed(imgs.map(i=>i.dataset.path)); }catch(_){ return; }
  imgs.forEach(i=>{ const s = SURL[i.dataset.path]; if (s) i.src = s.url; });
}
function photosView(){
  const ps = db.photos.slice().sort((a,b)=>b.at.localeCompare(a.at)), q = ui.phQ || '';
  return `<section class="card"><div class="sec-h"><h2>Photo library</h2><button class="btn" data-act="cam">${CAM_IC}<span>Add a photo</span></button></div>
    <p class="hint" style="margin-top:0">Pictures from the field: sites, products, competitors, exhibitions — anything useful for our work. Everyone in the company can see them.</p>
    ${ps.length ? `<label class="f"><span class="sr">Search photos</span><input type="search" id="phQ" value="${esc(q)}" placeholder="Search by name, note or person"></label>
    <div class="pgrid">${ps.map(p=>{ const s = (p.name+' '+(p.note||'')+' '+userName(p.by)).toLowerCase();
      return `<button type="button" class="ph" data-act="ph-open" data-id="${p.id}" data-s="${esc(s)}" ${q && !s.includes(q.toLowerCase())?'hidden':''}><img data-path="${esc(p.thumb)}" alt="${esc(p.name)}"><span class="ph-n">${esc(p.name)}</span><span class="ph-m">${esc(userName(p.by))} · ${fmtTime(p.at)}</span></button>`; }).join('')}</div>`
    : note('No photos yet. Press the camera button at the top of any page to add the first one.')}</section>`;
}
function paintBox(){
  const old = document.getElementById('phBox'), p = PHBOX && db.photos.find(x=>x.id===PHBOX);
  if (!p){ PHBOX = null; if (old) old.remove(); return; }
  const el = modalEl('phBox'), can = p.by===ui.user || isMgmt(ui.user);
  el.innerHTML = `<div class="modal-box lb"><img data-path="${esc(p.path)}" alt="${esc(p.name)}"><h2 style="margin:10px 0 2px">${esc(p.name)}</h2>
    ${p.note?`<p style="margin:0 0 6px;white-space:pre-wrap">${esc(p.note)}</p>`:''}<div class="hint" style="margin:0">${esc(userName(p.by))} · ${fmtTime(p.at)}</div>
    <div class="row end" style="margin-top:12px">${can?'<button type="button" class="btn ghost danger" data-act="ph-del">Delete</button>':''}<button type="button" class="btn ghost" data-act="ph-dl">Download</button><button type="button" class="btn" data-act="ph-x">Close</button></div></div>`;
  fillImgs();
}
async function photoDownload(btn){
  const p = db.photos.find(x=>x.id===PHBOX); if (!p) return; btn.disabled = true;
  try{ await signed([p.path]); const r = await fetch(SURL[p.path].url); const url = URL.createObjectURL(await r.blob()), a = document.createElement('a');
    a.href = url; a.download = p.name.replace(/[\\/:*?"<>|]+/g,' ').trim() + '.jpg'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url), 60000); }
  catch(e){ tip('Could not download', 'Check your internet connection.'); }
  btn.disabled = false;
}
async function photoDelete(){
  const p = db.photos.find(x=>x.id===PHBOX); if (!p || !(p.by===ui.user || isMgmt(ui.user)) || !confirm(`Delete the photo “${p.name}”? This cannot be undone.`)) return;
  const r = await sb.storage.from('photos').remove([p.path, p.thumb]);
  if (r.error){ tip('Could not delete', r.error.message); return; }
  db.photos = db.photos.filter(x=>x.id!==p.id); PHBOX = null; paintBox(); save(); render();
}
function camClick(act, a){
  if (act==='cam'){ camOpen(); return true; }
  if (act==='cam-x'){ camClose(); return true; }
  if (act==='cam-shoot'){ camShoot(); return true; }
  if (act==='cam-pick'){ document.getElementById('camPick').click(); return true; }
  if (act==='cam-snap'){ camSnap(); return true; }
  if (act==='cam-again'){ camOpen(); return true; }
  if (act==='ph-open'){ PHBOX = a.dataset.id; paintBox(); return true; }
  if (act==='ph-x'){ PHBOX = null; paintBox(); return true; }
  if (act==='ph-dl'){ photoDownload(a); return true; }
  if (act==='ph-del'){ photoDelete(); return true; }
  return false;
}
document.addEventListener('click', e=>{ if (e.target.id==='camModal') camClose(); else if (e.target.id==='phBox'){ PHBOX = null; paintBox(); } });
document.addEventListener('keydown', e=>{ if (e.key!=='Escape') return; if (CAMST) camClose(); else if (PHBOX){ PHBOX = null; paintBox(); } });
document.addEventListener('input', e=>{ if (e.target.id!=='phQ') return; ui.phQ = e.target.value; const q = ui.phQ.toLowerCase().trim();
  document.querySelectorAll('.ph').forEach(b=>{ b.hidden = !!q && !b.dataset.s.includes(q); }); });

/* ===== AI assistant: floating button on every page; typed or spoken; navigates and does tasks (with confirmation) ===== */
const AI_IC = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><path d="M19 15l.9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9z"/></svg>';
const SPK_IC = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>';
const AST = { open:false, msgs:[], busy:false, voice:false, listening:false, pending:null };
const PAGE_NAMES = { alerts:'Notifications', account:'My account' };
function pagesFor(id){ return tabsFor(id).map(t=>[t[0], t[1].replace(/\s*\(\d+\)$/,'')]).concat([['alerts','Notifications'],['account','My account']]); }
function aiContext(){
  const me = ui.user, u = getUser(me), n = now(), d = n.date, ph = phaseFor(n.mins, me);
  const people = assignableBy(me).map(p=>`${p.id}: ${p.name}, ${p.title}${needsGm(me,p.id)?' [needs GM approval]':''}${closedToday(p.id,d)?' [finished their day]':''}`);
  const mine = hasOwnReport(me) ? activeTasks(me, d).map(t=>`- ${t.title} (${t.priority}, ${t.category==='extra'?'additional':'planned'}${t.projectId&&projById(t.projectId)?', project '+projById(t.projectId).name:''}, ${progOn(t,d)}% so far)`) : [];
  const team = subtree(me).filter(p=>hasOwnReport(p.id)).slice(0,30).map(p=>`- ${p.name}: ${activeTasks(p.id,d).length} open tasks, closure ${closedToday(p.id,d)?'submitted':'not submitted'}${isField(p.id)?(loginOf(p.id,d)?', logged in today':', NOT logged in today'):''}`);
  const projs = myProjects(me).slice(0,20).map(p=>`${p.id}: ${p.name} — ${projProgress(p,d)}% done, ${p.status||'active'}${p.end?', target '+p.end:''}`);
  const pendRev = reportsOf(me).filter(r=>Object.keys(db.closures).some(k=>k.startsWith(r.id+'|') && !db.closures[k].review)).length;
  const lines = [
    `User: ${u.name}, ${u.title} (${u.role}). Now: ${fmtDate(d)} ${n.label} UAE time.`,
    hasOwnReport(me) ? `User's day: ${ph==='before'?'before 09:00':ph==='plan'?'morning plan window (until '+CONFIG.planClose+')':ph==='extra'?(closedToday(me,d)?'day finished, closure submitted':'working; can add additional work; can finish the day'):'closure deadline passed'}.` : '',
    `Work assigned now goes in as: ${assignMode(n.mins)==='plan'?'morning plan (priorities Important, Moderate, Daily Work)':'additional work (priorities Emergency, Important)'}.`,
    `Pages the user can open (id: name): ${pagesFor(me).map(p=>p[0]+': '+p[1]).join('; ')}.`,
    people.length ? `People the user can assign work to:\n${people.join('\n')}` : 'The user cannot assign work to anyone.',
    mine.length ? `User's open tasks today:\n${mine.join('\n')}` : '',
    team.length ? `User's team today:\n${team.join('\n')}` : '',
    pendRev ? `Team closure reports waiting for the user's review: ${pendRev}.` : '',
    isGm(me) ? `Requests waiting for the user's approval: ${gmPendingCount(me)}.` : '',
    isField(me) ? `User's meetings needing minutes: ${meetingsOf(me).filter(m=>needsInput(m,nowAbs())).length}.` : '',
    projs.length ? `Projects the user can see (id: name):\n${projs.join('\n')}` : 'No projects yet.',
    `Photos in the photo library: ${db.photos.length}.`
  ];
  return lines.filter(Boolean).join('\n');
}
function aiPrompt(text){
  const hist = AST.msgs.slice(-9, -1).map(m=>`${m.role==='user'?'User':'Assistant'}: ${m.text}`).join('\n');
  return `You are the assistant inside the "Daily Work Portal" of a UAE company. You help the user move around the portal and do things.
Reply with ONLY a JSON object: {"reply":"...","action":null}  or with an action object.
Actions (use exact ids from the context; never invent ids):
- {"type":"navigate","page":"<page id>"}  open a page
- {"type":"open_project","project_id":"..."}
- {"type":"assign_task","assignee_id":"...","title":"...","details":"","priority":"...","days":1,"project_id":""}
- {"type":"add_my_task","title":"...","details":"","priority":"...","days":1,"project_id":""}  add to the user's own plan / additional work
- {"type":"create_project","name":"...","description":"","end":"YYYY-MM-DD or empty","member_ids":[]}
- {"type":"add_photo"}  open the camera / photo upload
- {"type":"finish_day"}  open the closure report so the user can finish the day
Rules:
- "reply": short, friendly, plain English (or the user's language). For questions, answer ONLY from the context below; if it is not there, say you cannot see that and suggest the page to check.
- Only one action per reply. If something essential is missing or a name fits more than one person, ask a short question and use no action.
- Priority must be one allowed for the current mode. Use "Emergency" only if they say urgent/emergency/immediately. Default: "Important" for additional work, "Moderate" for the morning plan.
- days: if a deadline is given ("by Thursday"), count days from today up to and including that day. Default 1.
- Never claim you have done something: actions that change data are shown to the user to confirm first.
Context:
${aiContext()}
${hist ? 'Conversation so far:\n'+hist+'\n' : ''}User: ${text.replace(/\s+/g,' ').slice(0,1500)}`;
}
function ensureFab(show){
  let fab = document.getElementById('aiFab');
  if (!fab){ fab = document.createElement('button'); fab.id = 'aiFab'; fab.type = 'button'; fab.dataset.act = 'ai-open'; fab.setAttribute('aria-label','AI assistant');
    fab.innerHTML = `${AI_IC}<span>Ask AI</span>`; document.body.appendChild(fab); }
  fab.hidden = !show || AST.open;
  if (!show && AST.open){ AST.open = false; paintAI(); }
}
function actSummary(a){

  if (a.type==='assign_task') return [`Assign to ${userName(a.assignee_id)}${needsGm(ui.user,a.assignee_id)&&!isGm(a.assignee_id)?' (goes to the GM for approval first)':isGm(a.assignee_id)?' (the GM can accept, pass on or decline)':''}`, a.title, `${a.priority} · ${a.days} day${a.days===1?'':'s'} · ${assignMode(now().mins)==='plan'?'morning plan':'additional work'}`, a.details, pj?'Project: '+pj.name:''];
  if (a.type==='add_my_task') return [`Add to my ${a._mode==='plan'?'morning plan':'additional work'}${a._mode==='extra'?' (locked once added)':''}`, a.title, `${a.priority} · ${a.days} day${a.days===1?'':'s'}`, a.details, pj?'Project: '+pj.name:''];
  if (a.type==='create_project') return ['Create a new project', a.name, a.description, a.end?'Target end: '+fmtShort(a.end):'', a.member_ids.length?'People: '+a.member_ids.map(userName).join(', '):''];
  return [];
}
function paintAI(){

  const fab = document.getElementById('aiFab'); if (fab) fab.hidden = AST.open || !ui.authed;
  if (!AST.open){ if (p) p.remove(); return; }

    if (m.role==='user') return `<div class="msg me">${esc(m.text)}</div>`;

          : `<div class="ai-st ${m.status==='done'?'ok':''}">${m.status==='done'?'✓ Done':m.status==='cancelled'?'Cancelled':esc(m.status)}</div>`}</div>`;
    }

      <button type="button" class="btn sm ghost" data-act="ai-close" aria-label="Close">×</button></div>
    <div class="ai-msgs">${msgs || `<div class="ai-hello"><b>Hi ${esc(getUser(ui.user).name.split(' ')[0])}, what can I do?</b><br>Type or tap the mic. For example:
      <ul>${(assignableBy(ui.user).length?[`“Assign ${esc(assignableBy(ui.user).filter(x=>!isGm(x.id))[0]?.name.split(' ')[0]||assignableBy(ui.user)[0].name.split(' ')[0])} to send the price list to the client by Thursday”`]:[]).concat(['“Open my projects”','“What is left on my plan today?”', isMgmt(ui.user)?'“Who has not submitted their closure report?”':'“Take a photo”']).map(s=>`<li>${s}</li>`).join('')}</ul>
      Turn on <b>Voice</b> to talk hands-free: I'll read my answers aloud and listen for your reply.</div>`}
      ${AST.busy?'<div class="msg ai">Thinking…</div>':''}${AST.listening?'<div class="msg ai">Listening… speak now</div>':''}</div>
    <form id="aiForm" class="ai-f" novalidate><input id="aiIn" autocomplete="off" placeholder="Ask or tell me what to do…" aria-label="Message to the AI assistant">
      <button type="button" class="stt-btn ai-mic ${AST.listening?'rec':''}" data-act="ai-mic" aria-label="Speak">${MIC}</button><button class="btn sm" ${AST.busy?'disabled':''}>Send</button></form>`;
  const inp = p.querySelector('#aiIn'); inp.value = keep;
  const box = p.querySelector('.ai-msgs'); box.scrollTop = box.scrollHeight;
  if (!AST.listening && !AST.busy) inp.focus({ preventScroll:true });
}
function aiNormalize(a){
  if (!a || typeof a!=='object' || !a.type) return null;
  const n = now(), me = ui.user;
  const pri = list => list.includes(a.priority) ? a.priority : (list===EXTRA_PRI ? 'Important' : 'Moderate');
  a.days = Math.max(1, Math.min(60, parseInt(a.days,10)||1));
  a.title = String(a.title||'').trim().slice(0,140); a.details = String(a.details||'').trim().slice(0,500);
  if (a.project_id && !canSeeProject(projById(a.project_id), me)) a.project_id = '';
  if (a.type==='assign_task'){
    if (!assignableBy(me).some(u=>u.id===a.assignee_id) || !a.title) return { error:'I could not match that person or task. Please say the name and the task again.' };
    if (closedToday(a.assignee_id, n.date)) return { error:`${userName(a.assignee_id)} has already finished their day. Assign it tomorrow morning.` };
    a.priority = pri(assignMode(n.mins)==='plan' ? PLAN_PRI : EXTRA_PRI); return a;
  }
  if (a.type==='add_my_task'){
    const ph = phaseFor(n.mins, me);
    if (!hasOwnReport(me)) return { error:'You do not keep a daily plan, so I cannot add tasks for you.' };
    if (closedToday(me, n.date)) return { error:'You have already finished your day.' };
    if (ph!=='plan' && ph!=='extra') return { error: ph==='before' ? `Your plan opens at ${CONFIG.planOpen}.` : 'The time for adding work today has passed.' };
    if (!a.title) return { error:'What is the task?' };

}
function aiGo(a){

function aiDo(a){

    makeTask(a.assignee_id, me, f, assignMode(n.mins)); save(); render(); return `Assigned to ${userName(a.assignee_id)}.`;

      startDate:n.date, dueDate:addDays(n.date, a.days-1), projectId:a.project_id||'', log:{}, completedOn:null, createdAt:new Date().toISOString() });

const YES = /\b(yes|yeah|yep|yup|confirm|confirmed|ok|okay|sure|go ahead|do it|haan|han|ha|theek hai)\b/i, NO = /\b(no|nope|cancel|stop|don't|dont|nahi|mat)\b/i;
async function aiSend(text){
  text = (text||'').trim(); if (!text || AST.busy) return;
  const last = AST.msgs[AST.msgs.length-1];
  if (last && last.status==='pending'){                 // a reply to "confirm?" — yes / no
    if (YES.test(text) && !NO.test(text)){ AST.msgs.push({ role:'user', text }); return aiDecide(AST.msgs.length-2, true); }
    if (NO.test(text)){ AST.msgs.push({ role:'user', text }); return aiDecide(AST.msgs.length-2, false); }
    last.status = 'cancelled';
  }
  AST.msgs.push({ role:'user', text }); AST.busy = true; paintAI();
  let j;
  try { j = parseJSONLoose(await aiAsk(aiPrompt(text))); }
  catch(e){ AST.busy = false; AST.msgs.push({ role:'ai', text:'Sorry, I could not do that: '+e.message }); paintAI(); return; }
  AST.busy = false;
  let reply = String(j.reply||'').trim(), a = aiNormalize(j.action);
  if (a && a.error){ reply = a.error; a = null; }
  if (a && ['navigate','open_project','add_photo','finish_day'].includes(a.type)){
    AST.msgs.push({ role:'ai', text: reply || 'Done.' }); aiGo(a); if (AST.voice) await speak(reply || 'Done.'); return;
  }
  if (a){
    const m = { role:'ai', text: reply || 'Please check and confirm:', action:a, status:'pending' }; AST.msgs.push(m); paintAI();
    if (AST.voice){ await speak(`${reply ? reply.replace(/[:.]\s*$/,'')+'. ' : ''}${actSummary(a).filter(Boolean).slice(0,3).join('. ').replace(/ · /g,', ')}. Say yes to confirm, or no to cancel.`); if (m.status==='pending') aiListen(); }
    return;
  }
  AST.msgs.push({ role:'ai', text: reply || 'Sorry, I did not understand. Please try again.' }); paintAI();
  if (AST.voice){ await speak(reply); if (AST.open && /\?\s*$/.test(reply)) aiListen(); }
}
async function aiDecide(i, yes){
  const m = AST.msgs[i]; if (!m || m.status!=='pending') return;
  if (!yes){ m.status = 'cancelled'; AST.msgs.push({ role:'ai', text:'Okay, cancelled.' }); paintAI(); if (AST.voice) speak('Cancelled.'); return; }
  const out = aiDo(m.action); m.status = 'done'; AST.msgs.push({ role:'ai', text:out }); paintAI(); if (AST.voice) speak(out);
}
async function aiListen(){
  if (AST.listening) return;
  AST.listening = true; paintAI();
  let said = '';
  try { said = await listenOnce(); } catch(e){ AST.listening = false; paintAI(); if (!/No speech/.test(e.message)) tip('Voice', e.message); return; }
  AST.listening = false; paintAI();
  if (said) aiSend(said);
}
function aiClick(act, a){
  if (act==='ai-open'){ AST.open = true; paintAI(); return true; }
  if (act==='ai-close'){ AST.open = false; try{ speechSynthesis.cancel(); }catch(_){} paintAI(); return true; }
  if (act==='ai-voice'){ AST.voice = !AST.voice; if (!AST.voice) try{ speechSynthesis.cancel(); }catch(_){} paintAI(); return true; }
  if (act==='ai-mic'){ try{ speechSynthesis.cancel(); }catch(_){} aiListen(); return true; }
  if (act==='ai-yes' || act==='ai-no'){ aiDecide(+a.dataset.i, act==='ai-yes'); return true; }
  return false;
}

  const edit = ui.editing ? db.tasks.find(x=>x.id===ui.editing) : null;
  if (edit && canEdit(edit, me, n)){
    Object.assign(edit,{ title, details:form.details.value.trim(), priority, days, dueDate:addDays(edit.startDate,days-1), projectId });
    ui.editing = null;
  } else {
    const owner = kind==='assign' ? form.target.value : me;
    if (kind==='assign' && !owner){ err.hidden=false; err.textContent='Choose who to assign this to. Type a name or open the list.'; return; }
    if (kind==='assign' && !assignableBy(me).some(r=>r.id===owner)) return;
    if (kind==='assign' && closedToday(owner, n.date)){ err.hidden=false; err.textContent=`${userName(owner)} has already finished their day and submitted the closure report. Assign it tomorrow morning, or speak to them directly.`; return; }
    if (kind==='assign' && needsGm(me, owner)){
      if (!confirm(`${isGm(owner)?'Send this task to '+userName(owner):'This goes to the General Manager for approval first. Send it'}?`)) return;
      sendRequest(me, owner, { title, details:form.details.value.trim(), priority, days, projectId });
      save(); render(); tip('Sent for approval', isGm(owner) ? `${userName(owner)} can accept it, pass it to someone in your team, or decline it with a reason.` : `It will reach ${userName(owner)} once the General Manager approves it.`); return;
    }
    if (mode==='extra' && !confirm(`Add this as additional work${kind==='assign'?' for '+userName(owner):''}? It will be locked and cannot be edited.`)) return;
    if (kind==='assign') makeTask(owner, me, { title, details:form.details.value.trim(), priority, days, projectId }, mode);
    else db.tasks.push({ id:uid(), owner, assignedBy:null, category:mode==='plan'?'planned':'extra', priority, title,
      details:form.details.value.trim(), days, startDate:n.date, dueDate:addDays(n.date,days-1), projectId,
      log:{}, completedOn:null, createdAt:new Date().toISOString() });
  }
  save(); render();
}

function submitClosure(){
  const n = now(), u = ui.user, d = n.date, k = u+'|'+d;
  if (phaseFor(n.mins,u)!=='extra' || db.closures[k]){ alert('The closure report cannot be submitted now.'); render(); return; }
  if (isField(u)){ const pm = meetingsOf(u).filter(m=>needsInput(m,nowAbs())); if (pm.length){ alert(`Write the notes for ${pm.length} meeting${pm.length===1?'':'s'} in the Meetings tab first. The closure report can't be submitted until then.`); return; } }
  const rows = [...document.querySelectorAll('.crow')], out = []; let ok = true;
  rows.forEach(row=>{
    const v = Math.max(0, Math.min(100, Math.round(+row.querySelector('.pn').value||0)));
    const j = row.querySelector('.jt').value.trim(), w = words(j), err = row.querySelector('.err');
    if (v<100 && w<CONFIG.minWords){ ok=false; row.classList.add('bad'); err.hidden=false; err.textContent=`A justification of at least ${CONFIG.minWords} words is required (currently ${w}).`; }
    else { row.classList.remove('bad'); err.hidden=true; }
    out.push({ id:row.dataset.id, v, j });
  });
  if (!ok){ document.querySelector('.crow.bad')?.scrollIntoView({behavior:'smooth',block:'center'}); return; }
  if (!confirm(`Submit your closure report to ${mgrNames(u)}? It cannot be changed afterwards.`)) return;
  out.forEach(o=>{
    const t = db.tasks.find(x=>x.id===o.id);
    t.log[d] = { progress:o.v, justification:o.v<100?o.j:'' };
    if (o.v>=100) t.completedOn = d;
  });
  db.closures[k] = { submittedAt:new Date().toISOString(), tasks:out.map(o=>o.id) };
  ui.closing = false;
  emailPeople(getUser(u).managers.concat(needsCeoReview(u) ? ceoIds() : []), `Closure report from ${userName(u)} — ${fmtDate(d)}`, out.map(o=>{ const t = db.tasks.find(x=>x.id===o.id); return `• ${t?t.title:''}: ${o.v}%${o.v<100?' — '+o.j:''}`; }).join('\n') + '\n\nPlease review it in the portal (Team reports).');
  save(); render();
}


document.addEventListener('submit', e=>{
  e.preventDefault();
  if (e.target.id==='loginForm') return doLogin();
  if (e.target.id==='newPwForm' || e.target.id==='chPwForm') return setNewPassword();
  if (e.target.id==='meetForm') return scheduleMeeting(false);
  if (e.target.id==='aiForm'){ const i = e.target.querySelector('#aiIn'), t = i.value; i.value = ''; return aiSend(t); }
  if (e.target.id==='camForm') return camSave(e.target);
  if (e.target.classList.contains('projf')) return createProject(e.target);
  if (e.target.classList.contains('projedit')) return saveProjectEdit(e.target);
  if (e.target.classList.contains('msf')) return addMilestone(e.target);
  if (e.target.classList.contains('pchatf')) return sendChat(e.target, false);
  if (e.target.classList.contains('mout')) return submitOutcome(e.target);
  if (e.target.classList.contains('chatf')) return addDiary(e.target);
  const f = e.target.closest('.tform'); if (f) addOrSaveTask(f);
});

document.addEventListener('click', e=>{
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act;
  if (act==='view'){ ui.view = a.dataset.v; ui.editing=null; }
  else if (act==='edit'){ ui.editing = a.dataset.id; render(); document.querySelector('.tform input[name=title]')?.focus(); return; }
  else if (act==='cancel-edit'){ ui.editing = null; }
  else if (act==='del'){
    const t = db.tasks.find(x=>x.id===a.dataset.id);
    if (!t || !canEdit(t, ui.user, now())){ render(); return; }
    if (!confirm('Delete this task?')) return;
    db.tasks = db.tasks.filter(x=>x.id!==t.id); ui.editing=null;
  }
  else if (act==='submit-closure'){ submitClosure(); return; }
  else if (aiClick(act, a)) return;
  else if (camClick(act, a)) return;
  else if (projClick(act, a)) return;
  else if (act && act.startsWith('rq-')){ decideRequest(act.slice(3), a.closest('.rq')); return; }
  else if (act==='chk-done' || act==='chk-not'){ checkTask(a.dataset.id, act==='chk-done'); return; }
  else if (act==='nd-handled'){ handleNotDone(a.closest('.rq')); return; }
  else if (act==='ceo-ok' || act==='ceo-comment'){
    const k = a.dataset.k, ta = document.querySelector(`.ceotxt[data-k="${k}"]`), txt = ta ? ta.value.trim() : '';
    const err = ta ? ta.closest('label').parentElement.querySelector('.err') : null;
    if (act==='ceo-comment' && !txt){ if (err){ err.hidden=false; err.textContent='Write your comment first, or press "Okay".'; } return; }
    if (!db.closures[k] || !isCeo(ui.user)) return;
    db.closures[k].ceoReview = { by:ui.user, ok: act==='ceo-ok', text:txt, at:new Date().toISOString() };
    const owner = k.split('|')[0], gm = USERS.filter(u=>u.role==='General Manager').map(u=>u.id);
    const msg = act==='ceo-ok' && !txt ? 'Okay.' : txt;
    emailPeople([owner].concat(gm), `CEO review of ${userName(owner)}'s closure report (${fmtShort(k.split('|')[1])})`, `${userName(ui.user)}: ${msg}`);
    notify(owner, `CEO review of your closure report (${fmtShort(k.split('|')[1])}): ${msg}`, nowAbs(), null);
  }
  else if (act==='save-review'){
    const k = a.dataset.k, ta = document.querySelector(`.revtxt[data-k="${k}"]`), txt = ta.value.trim();
    const err = ta.closest('label').parentElement.querySelector('.err');
    if (!txt){ err.hidden=false; err.textContent='Please write a review before submitting.'; return; }
    db.closures[k].review = { by:ui.user, text:txt, at:new Date().toISOString() };
    emailPeople([k.split('|')[0]], `Your closure report was reviewed by ${userName(ui.user)}`, txt);
  }
  else if (act==='checkin'){ doCheckin(a,'visit'); return; }
  else if (act==='daylogin'){ doCheckin(a,'login'); return; }
  else if (act==='meet-now'){ scheduleMeeting(true); return; }
  else if (act==='stt'){ toggleDictation(a); return; }
  else if (act==='pick-tg'){ const pk = a.closest('.pick'), ul = pk.querySelector('.pick-list'); if (ul.hidden){ closePicks(pk); openPick(pk,''); pk.querySelector('.pick-in').focus(); } else closePicks(); return; }
  else if (act==='pick-opt'){ choosePick(a.closest('.pick'), a.dataset.id); return; }
  else if (act==='dperson-clear'){ if (ui.dash) ui.dash.person = null; }
  else if (act==='mom-draft'){ const m = db.meetings.find(x=>x.id===a.dataset.id), f = a.closest('form'), ta = f.querySelector('textarea[name=txt]');
    if (ta.value.trim() && /^MINUTES OF MEETING/.test(ta.value) && !confirm('Replace the current draft?')) return;
    ta.value = draftMoM(m, f); ta.dispatchEvent(new Event('input',{bubbles:true})); ta.focus(); tip('MoM draft ready','Check each section and fill in the next steps before sending.'); return; }
  else if (act==='mom-ai'){ const m = db.meetings.find(x=>x.id===a.dataset.id), f = a.closest('form'), ta = f.querySelector('textarea[name=txt]');
    if (!momNotes(m, f).length){ tip('Nothing to work from', 'Write a few points in the diary or the MoM box first.'); return; }
    a.disabled = true; a.textContent = 'Writing…';
    aiAsk(aiPromptMoM(m, f) + '\n\nReply with only the minutes as plain text. Do not use Markdown symbols such as ** or #.')
      .then(t=>{ ta.value = t; ta.dispatchEvent(new Event('input',{bubbles:true})); tip('AI draft ready', 'Check it carefully and correct anything before sending.'); })
      .catch(e=>tip('AI could not answer', e.message)).finally(()=>{ a.disabled = false; a.textContent = 'Write MoM with AI'; }); return; }
  else if (act==='prep-ai'){ const m = db.meetings.find(x=>x.id===a.dataset.id), out = a.parentElement.querySelector('.ai-out');
    a.disabled = true; a.textContent = 'Preparing…';
    aiAsk(aiPromptPrep(m) + '\n\nUse short plain-text lists. Do not use Markdown symbols such as ** or #.')
      .then(t=>{ out.textContent = t; out.hidden = false; }).catch(e=>tip('AI could not answer', e.message)).finally(()=>{ a.disabled = false; a.textContent = 'Prepare with AI'; }); return; }
  else if (act==='ai-summary'){ const out = document.getElementById('aiSum'); a.disabled = true; a.textContent = 'Summarising…';
    aiAsk(summaryPrompt()).then(t=>{ out.textContent = t; out.hidden = false; }).catch(e=>tip('AI could not answer', e.message)).finally(()=>{ a.disabled = false; a.textContent = 'Summarise with AI'; }); return; }
  else if (act==='forgot'){ forgotPassword(); return; }
  else if (act==='close-start'){ if (now().mins < toMins(CONFIG.closureOpen) && !confirm(`It's before ${CONFIG.closureOpen}. Are you finishing your work for today?`)) return; ui.closing = true; render(); setTimeout(()=>document.getElementById('closureCard')?.scrollIntoView({behavior:'smooth'}), 50); return; }
  else if (act==='close-cancel'){ ui.closing = false; }
  else if (act==='va-start'){ voiceAssign(); return; }
  else if (act==='va-stop'){ try{ speechSynthesis.cancel(); }catch(_){} return; }
  else if (act==='va-ok'){ confirmVoiceTask(); return; }
  else if (act==='va-cancel'){ setVA(null); try{ speechSynthesis.cancel(); }catch(_){} return; }
  else if (act==='mk-all'){ const ids = USERS.filter(u=>u.id!==ui.user && LOGINS && LOGINS[u.id] && LOGINS[u.id].emailOk && !LOGINS[u.id].hasLogin).map(u=>u.id); loginAction('create', ids, a); return; }
  else if (act==='mk-login'){ loginAction('create', [a.dataset.id], a); return; }
  else if (act==='reset-login'){ loginAction('reset', [a.dataset.id], a); return; }
  else if (act==='copy-logins'){ const t = document.getElementById('loginText').value; copyText(t).then(ok=>tip(ok?'Copied':'Copy failed', ok?'Paste it somewhere safe, then send each person their own password.':'Select the passwords and copy them by hand.')); return; }
  else if (act==='clear-logins'){ LOGIN_RESULTS = []; }
  else if (act==='account'){ ui.view = 'account'; }
  else if (act==='clk-ap'){ const el = a.closest('.clk'), h = +el.dataset.h; clkSet(el, a.dataset.ap==='pm' ? (h%12)+12 : h%12, +el.dataset.m); return; }
  else if (act==='mgeo'){ captureMeetingGeo(a.dataset.id, false, a); return; }
  else if (act==='mapprove'){ decideMeeting(a.dataset.id,'approved'); return; }
  else if (act==='msendback'){ decideMeeting(a.dataset.id,'returned'); return; }
  else if (act==='perm'){ try{ Notification.requestPermission().then(()=>render()); }catch(_){ } return; }
  else if (act==='logout'){ ui.authed = false; ui.noAccess = false; ui.editing = null; if (sb) sb.auth.signOut(); }
  save(); render();
});

document.addEventListener('input', e=>{
  const row = e.target.closest('.crow'); if (!row || !row.querySelector('.pn')) return;
  const r = row.querySelector('.pr'), num = row.querySelector('.pn');
  if (e.target===r) num.value = r.value;
  if (e.target===num) r.value = Math.max(0, Math.min(100, +num.value||0));
  row.querySelector('.just').hidden = (+num.value) >= 100;
  const w = words(row.querySelector('.jt').value), wc = row.querySelector('.wc');
  wc.querySelector('.wcn').textContent = w; wc.classList.toggle('ok', w>=CONFIG.minWords);
});

document.addEventListener('input', e=>{
  if (e.target.id!=='dSearch') return;
  const q = e.target.value.trim().toLowerCase();
  document.querySelectorAll('.prow').forEach(r=>{ r.hidden = q && !r.dataset.hay.includes(q); });
  document.querySelectorAll('.team-h').forEach(hd=>{ let el=hd.nextElementSibling, any=false; while(el && el.classList.contains('prow')){ if(!el.hidden) any=true; el=el.nextElementSibling; } hd.hidden=!any; });
});

document.addEventListener('change', e=>{ if (e.target.id==='camShoot' || e.target.id==='camPick'){ camFile(e.target.files[0]); return; } if (e.target.classList && e.target.classList.contains('pf-in')){ if (e.target.files.length) uploadFiles(e.target.dataset.id, e.target.files); e.target.value=''; return; } });
document.addEventListener('change', e=>{
  if (e.target.name==='oc'){ const pp = e.target.closest('form').querySelector('.pp'); if (pp) pp.hidden = e.target.value!=='postponed'; return; }
  const id = e.target.id;
  if (id==='userSel'){ ui.user = e.target.value; ui.authed = true; ui.view = tabsFor(ui.user)[0][0]; }
  else if (id==='revDate' && e.target.value){ ui.reviewDate = e.target.value; }
  else if (id==='dDate' && e.target.value){ (ui.dash||(ui.dash={team:'all',status:'all'})).date = e.target.value; }
  else if (id==='dTeam'){ ui.dash.team = e.target.value; }
  else if (id==='dStatus'){ ui.dash.status = e.target.value; }
  else return;
  ui.editing = null; save(); render();
});

/* System clock: windows open/lock on their own. Re-render only when a window changes so typing isn't lost. */
setInterval(()=>{
  const changed = runReminders();
  if (changed) save();
  if (ui.authed) autoMeetingGeo();
  if (sigNow() !== lastSig || changed || pendingRender) safeRender();
  else updateClock();
  flushFresh();
}, 15000);

async function boot(){
  const cfg = window.PORTAL_CONFIG || {};
  if (!window.supabase || !cfg.SUPABASE_URL || /YOUR-/.test(cfg.SUPABASE_URL)){ render(); return; }
  sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
  sb.auth.onAuthStateChange((ev)=>{ if (ev==='PASSWORD_RECOVERY'){ ui.recovery = true; ui.authed = false; render(); } if (ev==='SIGNED_OUT'){ ui.authed = false; render(); } });
  const { data } = await sb.auth.getSession();
  if (data && data.session && !/type=recovery/.test(location.hash)) await afterLogin(); else render();
}
boot();
</script>
