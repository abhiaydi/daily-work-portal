/* ===== Sales: day login, meetings, reminders ===== */
const LOGIN_BY = '09:00';                        // sales staff must log in at or before this time
const REMIND_BEFORE = [1440,720,360,60,15,10];   // reminder offsets, minutes before the meeting
const NAG_EVERY = 30, NAG_FROM = '09:00', NAG_TO = '22:00';  // missing-notes reminders (working hours)
const EPOCH = '2020-01-01';
const absOf = (date,time) => diffDays(EPOCH,date)*1440 + toMins(time);
const nowAbs = () => { const n = now(); return absOf(n.date, n.label); };
const fromAbs = a => { const d = Math.floor(a/1440), m = a - d*1440; return { date:addDays(EPOCH,d), time:pad(Math.floor(m/60))+':'+pad(m%60) }; };
const fmtAbs = a => { const x = fromAbs(a); return `${fmtShort(x.date)} ${x.time}`; };
const offLabel = o => o>=60 ? `${o/60} hour${o===60?'':'s'}` : `${o} minutes`;
const offShort = o => o>=60 ? `${o/60} h` : `${o} min`;
const loginOf = (id,d) => (db.checkins||[]).find(c=>c.owner===id && c.date===d && c.kind==='login');
const meetingsOf = id => (db.meetings||[]).filter(m=>m.owner===id);
const mStart = m => absOf(m.date, m.time);
const mState = (m,na) => m.status==='scheduled' ? (na < mStart(m) ? 'upcoming' : 'notes') : m.status;
const needsInput = (m,na) => { const s = mState(m,na); return s==='notes' || s==='returned'; };
const reviewersOf = id => { const mg = USERS.filter(u=>DASH_ROLES.includes(u.role) && subtree(u.id).some(x=>x.id===id));
  if (isField(id)) return mg; const direct = USERS.filter(u=>getUser(id).managers.includes(u.id)); return direct.length ? direct : mg; };
const canReviewMeeting = (m, me) => m.owner!==me && (isMgmt(me) || reviewersOf(m.owner).some(u=>u.id===me));
const BELL = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>';
let fresh = [], pendingRender = false;
const geoTried = {};

function notify(owner, text, at, meetingId){
  db.notifications.push({ id:uid(), owner, text, at, meetingId, read:false, email:true });
  if (ui.authed && owner===ui.user) fresh.push(text);
}
/* Works out which reminders are due now. The real system would do this on a server and send the emails. */
function runReminders(){
  if (!ui.authed) return false;
  const na = nowAbs(); let changed = false;
  const mine = db.notifications.filter(x=>x.owner===ui.user).sort((a,b)=>b.at-a.at);
  if (mine.length > 200){ const drop = new Set(mine.slice(200).map(x=>x.id)); db.notifications = db.notifications.filter(x=>!drop.has(x.id)); changed = true; }
  db.meetings.filter(m=>m.owner===ui.user).forEach(m=>{
    m.sent = m.sent || {};
    const st = mStart(m), who = m.withWhom;
    if (m.status==='scheduled'){
      REMIND_BEFORE.forEach(o=>{ const t = st-o, k = 'pre'+o;
        if (!m.sent[k] && t<=na && t>=m.createdAt){ m.sent[k]=t; changed=true; notify(m.owner, `Reminder: meeting with ${who} in ${offLabel(o)} (${fmtAbs(st)}). Purpose: ${m.purpose}`, t, m.id); } });
      if (!m.sent.start && st<=na){ m.sent.start=st; changed=true; notify(m.owner, `Your meeting with ${who} is starting now. Keep the portal open so the meeting location is captured.`, st, m.id); }
    }
    if (needsInput(m,na)){
      const begin = m.status==='returned' ? m.returnedAt + NAG_EVERY : absOf(addDays(m.date,1), NAG_FROM);
      if (begin > na) return;
      const from = Math.max(begin, na - 14*1440);
      for (let t = begin + Math.ceil((from-begin)/NAG_EVERY)*NAG_EVERY; t<=na; t+=NAG_EVERY){
        const tm = t - Math.floor(t/1440)*1440, k = 'nag'+t;
        if (tm < toMins(NAG_FROM) || tm > toMins(NAG_TO) || m.sent[k]) continue;
        m.sent[k]=t; changed=true;
        notify(m.owner, m.status==='returned'
          ? `Meeting report sent back: add more detail for your meeting with ${who} (${fmtAbs(st)}).`
          : `Meeting notes missing: write the outcome of your meeting with ${who} (${fmtAbs(st)}).`, t, m.id);
      }
    }
  });
  return changed;
}
function flushFresh(){
  if (!fresh.length) return;
  const last = fresh[fresh.length-1], more = fresh.length-1; fresh = [];
  let t = document.getElementById('toast');
  if (!t){ t = document.createElement('div'); t.id='toast'; t.setAttribute('role','status'); t.title='Tap to close'; t.addEventListener('click',()=>{ t.hidden = true; }); document.body.appendChild(t); }
  t.innerHTML = `<b>Reminder${more?` (+${more} more)`:''}</b><span>${esc(last)}</span><small>Email sent (simulated)</small><span class="x">Tap to close</span>`; t.hidden = false;
  clearTimeout(flushFresh.h); flushFresh.h = setTimeout(()=>{ t.hidden = true; }, 9000);
  try{ if ('Notification' in window && Notification.permission==='granted') new Notification('Daily Work Portal', { body:last }); }catch(e){}
}
function safeRender(){

}

function captureMeetingGeo(id, auto, btn){

function personInfo(u, d, n){
  const act = activeTasks(u.id,d), c = db.closures[u.id+'|'+d];
  const isToday = d===n.date, ph = isToday ? phaseFor(n.mins,u.id) : 'over';
  const planned = act.filter(t=>t.startDate===d && t.category==='planned').length;
  const extra = act.filter(t=>t.startDate===d && t.category==='extra');
  const carried = act.filter(t=>t.startDate<d).length;
  const overdue = act.filter(t=>d>t.dueDate);
  const avg = act.length ? Math.round(act.reduce((s,t)=>s+progOn(t,d),0)/act.length) : null;
  let st, cls, flag=false;
  if (c){ st = c.review ? 'Closed · reviewed' : 'Closed · awaiting review'; cls = c.review ? 'open' : 'locked'; }
  else if (ph==='over'){ st='Closure missed'; cls='miss'; flag=true; }
  else if (ph==='extra' && isToday && n.mins >= toMins(CONFIG.closureOpen)){ st='Closure pending'; cls='soon'; }
  else if (!act.length && ORDER[ph]>=ORDER.extra){ st='No plan'; cls='miss'; flag=true; }
  else if (!act.length){ st='Not started'; cls='soon'; }
  else { st='Working'; cls='open'; }
  if (overdue.length || extra.some(t=>t.priority==='Emergency')) flag = true;
  return { u, act, c, planned, extra, carried, overdue, avg, st, cls, flag };
}

function makeTask(owner, by, f, mode, extra, opts){
  const n = now(), cat = mode==='plan' ? 'planned' : 'extra';
  const t = Object.assign({ id:uid(), owner, assignedBy:by, category:cat, priority:f.priority, title:f.title, details:f.details||'', days:f.days,
    startDate:n.date, dueDate:addDays(n.date, f.days-1), log:{}, completedOn:null, createdAt:new Date().toISOString() }, f.byVoice?{byVoice:true}:{}, f.projectId?{projectId:f.projectId}:{}, (f.parts&&f.parts.length)?{ parts:f.parts.map(p=>({ id:uid(), title:p.title, days:p.days })) }:{}, (f.files&&f.files.length)?{files:f.files.map(x=>({ ...x }))}:{}, owner!==by?{ feas:{ state:'pending' } }:{}, extra||{});
  db.tasks.push(t);
  const pj = f.projectId && projById(f.projectId); if (pj && !isMgmt(owner)) addMembers(pj, [owner]);
  const info = `Task: ${f.title}\nPriority: ${f.priority}\nDuration: ${f.days} day(s), due ${fmtShort(t.dueDate)}\nType: ${mode==='plan'?'Morning plan':'Additional work'}${f.details?'\nDetails: '+f.details:''}${extra&&extra.approvedBy?`\n${extra.delegatedFrom?'Passed on':'Approved'} by ${userName(extra.approvedBy)}`:''}${(f.files||[]).length?`\nAttachments: ${f.files.map(x=>x.name).join(', ')}`:''}`;
  // Every assignment emails both people: the assignee and the assigner.
  emailPeople([owner], `New ${mode==='plan'?'task':'additional work'} from ${userName(by)}: ${f.title}`, `${userName(by)} assigned you a task.\n${info}\n\nPlease open the portal and say whether it is feasible in this time.`, true);
  if (!(opts && opts.noAssignerMail)) emailPeople([by], `You assigned “${f.title}” to ${userName(owner)}`, `Confirmation: you assigned a task to ${userName(owner)}.\n${info}`, true);
  return t;
}
function sendRequest(me, owner, f){

    byVoice:!!f.byVoice, projectId:f.projectId||'', files:f.files||[], ...(f.parts?{ parts:f.parts }:{}), status:'pending', createdAt:new Date().toISOString(), date:now().date });

function decideRequest(kind, form){
  const r = db.requests.find(x=>x.id===form.dataset.id), me = ui.user, n = now(), mode = assignMode(n.mins);
  const err = form.querySelector('.err'), fail = m => { err.hidden=false; err.textContent=m; };
  if (!r || r.status!=='pending' || !isGm(me)) { render(); return; }
  const pri = form.querySelector('.rq-pri').value, reason = form.querySelector('.rq-reason').value.trim(), at = nowAbs();
  const f = { title:r.title, details:r.details, priority:pri, days:r.days, byVoice:r.byVoice, projectId:r.projectId||'', files:r.files||[], ...(r.parts?{ parts:r.parts }:{}) };
  const done = (status, extra) => { Object.assign(r, { status, decidedBy:me, decidedAt:new Date().toISOString() }, extra||{}); save(); render(); };
  if (kind==='reject'){
    if (reason.split(/\s+/).filter(Boolean).length < 2) return fail('Write a short reason (a few words) before declining.');
    if (!confirm('Decline this task? The sender will get your reason.')) return;
    notify(r.from, `${userName(me)} declined your task “${r.title}” for ${r.to===me?'them':userName(r.to)}. Reason: ${reason}`, at, null);
    emailPeople([r.from], `Task declined: ${r.title}`, `${userName(me)} declined your task “${r.title}” for ${r.to===me?userName(me):userName(r.to)}.\nReason: ${reason}`);
    return done('rejected', { reason });
  }
  const owner = kind==='delegate' ? form.querySelector('.rq-dlg').value : kind==='accept' ? me : r.to;
  if (!owner) return fail('Choose the person to pass it to.');
  if (closedToday(owner, n.date)) return fail(`${userName(owner)} has already finished their day. Approve it tomorrow morning, or speak to them directly.`);
  const t = makeTask(owner, r.from, f, mode, { viaGm:true, approvedBy:me, requestId:r.id, ...(kind==='delegate'?{ delegatedFrom:me }:{}) });
  const msg = kind==='approve' ? `${userName(me)} approved your task “${r.title}” for ${userName(owner)}.`
    : kind==='accept' ? `${userName(me)} accepted your task “${r.title}”.` : `${userName(me)} passed your task “${r.title}” to ${userName(owner)}.`;
  notify(r.from, msg, at, null); if (owner!==me) notify(owner, `New task from ${userName(r.from)}${kind==='approve'?' (approved by '+userName(me)+')':' (passed on by '+userName(me)+')'}: ${r.title}`, at, null);
  emailPeople([r.from], `Task ${kind==='approve'?'approved':kind==='accept'?'accepted':'passed on'}: ${r.title}`, msg);
  done(kind==='approve'?'approved':kind==='accept'?'accepted':'delegated', { taskId:t.id, ...(kind==='delegate'?{ delegatedTo:owner }:{}) });
}
function checkTask(id, ok){
  const t = db.tasks.find(x=>x.id===id); if (!t || t.assignedBy!==ui.user || t.check) return;
  if (!confirm(ok ? `Mark “${t.title}” as done?` : `Mark “${t.title}” as NOT done? The General Manager will be told.`)) return;

}
function handleNotDone(form){

/* ===== Projects ===== */
const isMgmt = id => DASH_ROLES.includes(getUser(id).role);
const projById = id => db.projects.find(p=>p.id===id);
const canSeeProject = (p, id) => !!p && p.status!=='deleted' && (p.owner===id || (p.members||[]).includes(id) || isMgmt(id));
const canManageProject = (p, id) => !!p && (p.owner===id || isMgmt(id));

const projPeople = p => [p.owner].concat((p.members||[]).filter(x=>x!==p.owner));
const projTasks = p => db.tasks.filter(t=>t.projectId===p.id);
const taskProg = (t, d) => t.completedOn ? 100 : progOn(t, d);
let DRIVE = null, UPL = {}, AIBUSY = {};
function projProgress(p, d){
  const ms = p.milestones||[];
  if (ms.length) return Math.round(ms.reduce((s,m)=>s+(m.progress||0),0)/ms.length);
  const ts = projTasks(p); return ts.length ? Math.round(ts.reduce((s,t)=>s+taskProg(t,d),0)/ts.length) : 0;
}
function projHealth(p, d){
  if (p.status==='completed') return pill('open','Completed');
  if (p.status==='on hold') return pill('soon','On hold');
  const late = (p.milestones||[]).filter(m=>m.due && m.due<d && (m.progress||0)<100).length;
  if (late) return pill('miss', `${late} milestone${late>1?'s':''} late`);
  if (p.end && p.end<d && projProgress(p,d)<100) return pill('miss','Past end date');
  return pill('open','On track');
}
function gantt(p, today){
  const ms = (p.milestones||[]).filter(m=>m.start||m.due); if (!ms.length) return '';
  const ds = [p.start, p.end, ...ms.flatMap(m=>[m.start, m.due])].filter(Boolean).sort();

async function suggestSchedule(p, btn){
  const ppl = projPeople(p).map(id=>getUser(id));
  btn.disabled = true; btn.textContent = 'Thinking…';
  try{
    const txt = await aiAsk(`Plan a practical project schedule for a UAE manufacturing/trading company.\nProject: ${p.name}\nDescription: ${p.description||'-'}\nStart: ${p.start||now().date}\nTarget end: ${p.end||'(not set)'}\nTeam: ${ppl.map(u=>`${u.name} (${u.title})`).join('; ')}\n\nReply with JSON only, an array of 4 to 10 milestones in order: [{"title":"...","start":"YYYY-MM-DD","due":"YYYY-MM-DD","owner":"exact team member name or empty"}]. Keep all dates within the project dates.`);
    const m = txt.match(/\[[\s\S]*\]/); const arr = m ? JSON.parse(m[0]) : [];
    const byName = s => { const k = String(s||'').toLowerCase().trim(); const u = ppl.find(x=>x.name.toLowerCase()===k) || ppl.find(x=>k && x.name.toLowerCase().includes(k)); return u ? u.id : ''; };
    const ok = d => /^\d{4}-\d{2}-\d{2}$/.test(d||'') ? d : '';
    const list = arr.filter(x=>x && x.title).slice(0,12).map(x=>({ title:String(x.title).slice(0,120), start:ok(x.start), due:ok(x.due), owner:byName(x.owner) }));
    if (!list.length) throw new Error('The AI did not return a schedule. Try again, or add a longer description.');
    (ui.msSug = ui.msSug||{})[p.id] = list; render();

async function driveFetch(body){
  const { data:{ session } } = await sb.auth.getSession(); const cfg = window.PORTAL_CONFIG || {};
  const form = body instanceof FormData;
  return fetch(String(cfg.SUPABASE_URL).replace(/\/$/,'') + '/functions/v1/drive', { method:'POST',
    headers: Object.assign({ Authorization:'Bearer '+(session && session.access_token), apikey:cfg.SUPABASE_ANON_KEY }, form ? {} : { 'Content-Type':'application/json' }),
    body: form ? body : JSON.stringify(body) });
}
async function uploadFiles(pid, files){
  const list = [...files];
  for (let i=0; i<list.length; i++){
    const f = list[i];
    if (f.size > 25*1024*1024){ tip('File too large', `${f.name} is larger than 25 MB.`); continue; }
    UPL[pid] = `Uploading ${f.name}${list.length>1?` (${i+1} of ${list.length})`:''}… AI is reading it, naming it and choosing a folder.`;
    const el = document.getElementById('upl'); if (el){ el.hidden = false; el.textContent = UPL[pid]; }
    const fd = new FormData(); fd.append('action','upload'); fd.append('project', pid); fd.append('file', f, f.name);
    try{
      const r = await driveFetch(fd), d = await r.json().catch(()=>({}));
      if (!r.ok || d.error || !d.file) throw new Error(d.error || `Upload failed (${r.status}).`);
      applyRemote('pfiles', d.file.id, d.file);
      db.pchat.push({ id:uid(), projectId:pid, by:ui.user, sys:true, text:`uploaded “${d.file.name}” to ${d.file.folder}`, at:new Date().toISOString() }); save();
    }catch(e){ tip('Upload failed', `${f.name}: ${e.message}`); }
  }
  delete UPL[pid]; render();
}
async function downloadFile(id, btn){
  const f = db.pfiles.find(x=>x.id===id); if (!f) return;
  const old = btn.innerHTML; btn.disabled = true; btn.textContent = 'Downloading…';
  try{
    const r = await driveFetch({ action:'download', file:id });
    if (!r.ok){ const d = await r.json().catch(()=>({})); throw new Error(d.error || `Download failed (${r.status}).`); }
    const url = URL.createObjectURL(await r.blob()), a = document.createElement('a');
    a.href = url; a.download = f.name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url), 60000);
  }catch(e){ tip('Could not download', e.message); }
  finally{ btn.disabled = false; btn.innerHTML = old; }
}

function undoCheck(it){
  if (it.kind==='task'){ const t = db.tasks.find(x=>x.id===it.id); if (!t) return 'That task no longer exists.';
    if (Object.keys(t.log||{}).length) return `${userName(t.owner)} has already reported on that task, so I can't remove or change it. Speak to them or their manager.`; return ''; }
  if (it.kind==='request'){ const r = db.requests.find(x=>x.id===it.id); if (!r) return 'That request no longer exists.';
    if (r.status==='rejected') return 'The GM already declined that request.';
    if (r.taskId){ const t = db.tasks.find(x=>x.id===r.taskId); if (t && Object.keys(t.log||{}).length) return 'That work was approved and has already been reported on, so it cannot be removed.'; }
    return ''; }
  if (it.kind==='project'){ const p = projById(it.id); if (!p || p.status==='deleted') return 'That project no longer exists.'; return ''; }

function aiDo(a){

    if (needsGm(me, a.assignee_id)){ sendRequest(me, a.assignee_id, f); const r = db.requests[db.requests.length-1]; log('request', r.id, `request to ${isGm(a.assignee_id)?'send':'assign'} “${a.title}” to ${userName(a.assignee_id)}`);
      return isGm(a.assignee_id) ? `Sent to ${userName(a.assignee_id)}.` : `Sent to the General Manager for approval.`; }
    const t = makeTask(a.assignee_id, me, f, assignMode(n.mins)); log('task', t.id, `assigned “${a.title}” to ${userName(a.assignee_id)}`); return `Assigned to ${userName(a.assignee_id)}.`;

    const t = { id:uid(), owner:me, assignedBy:null, category:ph==='plan'?'planned':'extra', priority:a.priority, title:a.title, details:a.details, days:a.days,
      startDate:n.date, dueDate:addDays(n.date, a.days-1), projectId:a.project_id||'', ...(a.parts?{ parts:a.parts.map(x=>({ id:uid(), title:x.title, days:x.days })) }:{}), log:{}, completedOn:null, createdAt:new Date().toISOString() };

    const t = db.tasks.find(x=>x.id===a._t.id); if (!t || !canMarkPart(t)) return 'That task can no longer be updated today.';
    const p = (t.parts||[]).find(x=>x.id===a._p.id); if (!p || p.done) return 'That part is already done.';

  }

    else if (it.kind==='request'){ const r = db.requests.find(x=>x.id===it.id);
      if (r.taskId){ const t = db.tasks.find(x=>x.id===r.taskId); if (t){ db.tasks = db.tasks.filter(x=>x.id!==t.id); notify(t.owner, `${userName(me)} withdrew the task “${t.title}”.`, nowAbs(), null); } }

  }
  if (a.type==='edit'){
    const it = a._it, why = undoCheck(it); if (why) return why; const t = it.kind==='task' ? db.tasks.find(x=>x.id===it.id) : db.requests.find(x=>x.id===it.id);

}
const NAV_TYPES = ['navigate','open_project','add_photo','finish_day'];
async function aiSend(text){
  text = (text||'').trim(); if (!text || AST.busy) return;
  const last = AST.msgs[AST.msgs.length-1];
  if (last && last.status==='pending'){
    if (YES.test(text) && !NO.test(text)){ AST.msgs.push({ role:'user', text }); return aiDecide(AST.msgs.length-2, true); }
    if (/^\s*(no|nope|cancel|stop|nahi|mat)\b[\s.!]*$/i.test(text)){ AST.msgs.push({ role:'user', text }); return aiDecide(AST.msgs.length-2, false); }
    last.status = 'cancelled';     // anything else: treat as a new instruction (e.g. a correction)
  }
  AST.msgs.push({ role:'user', text }); AST.busy = true; paintAI();
  let j;
  try { j = parseJSONLoose(await aiAsk(aiPrompt(text), true)); }
  catch(e){ AST.busy = false; AST.msgs.push({ role:'ai', text: /free daily limit|today's limit|free limit/.test(e.message) ? e.message : 'Sorry, something went wrong: '+e.message+' Please try again.' }); paintAI(); return; }
  AST.busy = false;
  let reply = String(j.reply||'').trim();
  const raw = Array.isArray(j.actions) ? j.actions : (j.action ? [j.action] : []);
  const acts = [], errs = [];
  raw.slice(0,5).forEach(x=>{ const a = aiNormalize(x); if (!a) return; if (a.error) errs.push(a.error); else acts.push(a); });
  if (errs.length){ AST.msgs.push({ role:'ai', text:(reply && !acts.length ? reply+'\n\n' : '') + errs.join('\n') }); paintAI(); if (AST.voice){ await speak(errs.join('. ')); aiListen(); } return; }
  const nav = acts.filter(a=>NAV_TYPES.includes(a.type)), work = acts.filter(a=>!NAV_TYPES.includes(a.type));
  if (work.length){
    const m = { role:'ai', text: reply || 'Please check and confirm:', actions:work, then:nav, status:'pending' }; AST.msgs.push(m); paintAI();
    if (AST.voice){ await speak(`${reply ? reply.replace(/[:.]\s*$/,'')+'. ' : ''}${work.map(a=>actSummary(a).filter(Boolean).slice(0,2).join(', ')).join('. ').replace(/ · /g,', ')}. Say yes to confirm, or no to cancel.`); if (m.status==='pending') aiListen(); }
    return;
  }
  AST.msgs.push({ role:'ai', text: reply || (nav.length ? 'Done.' : 'Sorry, I did not understand. Could you say it another way?') });
  if (nav.length) aiGo(nav[nav.length-1]); else paintAI();
  if (AST.voice){ await speak(reply || 'Done.'); if (AST.open && !nav.length) aiListen(); }
}
async function aiDecide(i, yes){
  const m = AST.msgs[i]; if (!m || m.status!=='pending') return;
  if (!yes){ m.status = 'cancelled'; AST.msgs.push({ role:'ai', text:'Okay, cancelled. Tell me what you would like instead.' }); paintAI(); if (AST.voice){ await speak('Cancelled. What would you like instead?'); aiListen(); } return; }
  const outs = m.actions.map(a=>aiDo(a)).filter(Boolean); m.status = 'done'; save(); render();
  AST.msgs.push({ role:'ai', text: outs.join('\n') + '\nIf anything is wrong, just tell me and I can undo or correct it.' });
  if (m.then && m.then.length) aiGo(m.then[m.then.length-1]); else paintAI();
  if (AST.voice) speak(outs.join(' '));
}

async function aiScoreClosure(k){

  if (!items.length){ c.ai = { status:'done', summary:'No tasks were reported.', overall:null, at:new Date().toISOString() }; save(); return true; }
  SCORE_BUSY[k] = true; c.ai = Object.assign({}, c.ai, { tryAt:new Date().toISOString() }); save();
  try{
    const j = parseJSONLoose(await aiAsk(scorePrompt(owner, d, items)));
    // Re-read: live updates may have replaced these objects while the AI was working.
    const c = db.closures[k]; if (!c) return false;
    items.forEach(x=>{ x.t = db.tasks.find(t=>t.id===x.t.id) || x.t; });
    const res = Object.fromEntries((Array.isArray(j.tasks)?j.tasks:[]).map(x=>[x.id, x]));
    if (!items.every(({t})=>res[t.id] && isFinite(+res[t.id].pct))) throw new Error('The AI did not rate every task.');
    let sum = 0;
    items.forEach(({t,work})=>{

      t.log[d] = { progress:pct, justification:work||'', aiNote:String(res[t.id].note||'').slice(0,400), ...((t.files||[]).length?{ filesSeen:(t.files||[]).filter(f=>f.briefState==='done').length }:{}) };

    save();

      `${c.edits?'Updated closure':'Closure'} report from ${userName(owner)} — ${fmtDate(d)} (AI rating ${overall}%)`,
      `${c.ai.summary}\n\n` + items.map(({t})=>`• ${t.title}: ${t.log[d].progress}% — ${t.log[d].aiNote}`).join('\n') + '\n\nManagers: please review it in the portal (Team reports).', true);
    if (owner===ui.user && was!=='done') tip('AI rating ready', `Your work today was rated ${overall}% overall. See the details in your closure report.`);
    return true;

const PERIODS = [['day','Today'],['week','Week'],['month','Month'],['quarter','Quarter'],['year','Year']];
const PRI_W = { Emergency:3, Important:2 };
const dUTC = s => new Date(s+'T00:00:00Z'), iso = dt => dt.toISOString().slice(0,10);
function periodRange(kind, anchor){
  const t = dUTC(anchor), y = t.getUTCFullYear(), m = t.getUTCMonth();
  if (kind==='day') return [anchor, anchor];
  if (kind==='week'){ const dow = (t.getUTCDay()+6)%7, a = addDays(anchor, -dow); return [a, addDays(a,6)]; }
  if (kind==='month') return [iso(new Date(Date.UTC(y,m,1))), iso(new Date(Date.UTC(y,m+1,0)))];
  if (kind==='quarter'){ const q = Math.floor(m/3)*3; return [iso(new Date(Date.UTC(y,q,1))), iso(new Date(Date.UTC(y,q+3,0)))]; }
  return [`${y}-01-01`, `${y}-12-31`];
}
function shiftAnchor(kind, anchor, dir){
  const t = dUTC(anchor), y = t.getUTCFullYear(), m = t.getUTCMonth();
  if (kind==='day') return addDays(anchor, dir);
  if (kind==='week') return addDays(anchor, 7*dir);
  if (kind==='month') return iso(new Date(Date.UTC(y, m+dir, 1)));
  if (kind==='quarter') return iso(new Date(Date.UTC(y, m+3*dir, 1)));
  return iso(new Date(Date.UTC(y+dir, 0, 1)));
}
function periodLabel(kind, a, b){
  const f = (s,o) => dUTC(s).toLocaleDateString('en-GB', Object.assign({ timeZone:'UTC' }, o));
  if (kind==='day') return f(a,{ weekday:'long', day:'numeric', month:'long', year:'numeric' });
  if (kind==='week') return `${f(a,{ day:'numeric', month:'short' })} – ${f(b,{ day:'numeric', month:'short', year:'numeric' })}`;
  if (kind==='month') return f(a,{ month:'long', year:'numeric' });
  if (kind==='quarter') return `Q${Math.floor(dUTC(a).getUTCMonth()/3)+1} ${dUTC(a).getUTCFullYear()}`;
  return String(dUTC(a).getUTCFullYear());
}
function workStats(pid, a, b, n){
  const today = n.date, end = b < today ? b : today;
  if (a > today) return { future:true };
  const tasks = db.tasks.filter(t=>t.owner===pid && t.startDate<=end && (!t.completedOn || t.completedOn>=a));
  const fin = [], wrk = [], pen = []; let wsum = 0, wtot = 0;
  tasks.forEach(t=>{ const done = t.completedOn && t.completedOn<=end, p = done ? 100 : progOn(t, end), w = PRI_W[t.priority]||1;
    (done ? fin : p>0 ? wrk : pen).push({ t, p }); wsum += w*p; wtot += w; });
  const due = tasks.filter(t=>t.dueDate>=a && t.dueDate<=end && (t.dueDate<today || (t.completedOn && t.completedOn<=t.dueDate)));
  const onTime = due.filter(t=>t.completedOn && t.completedOn<=t.dueDate).length;
  let days = 0, closed = 0;
  for (let d = a; d <= end; d = addDays(d,1)){
    if (!activeTasks(pid, d).length) continue;
    const c = !!db.closures[pid+'|'+d];
    if (d===today && !c && phaseFor(n.mins, pid)!=='over') continue;
    days++; if (c) closed++;
  }
  const parts = [['Work done', wtot ? wsum/wtot : null, 0.6], ['Finished on time', due.length ? onTime/due.length*100 : null, 0.2], ['Closure reports submitted', days ? closed/days*100 : null, 0.2]];
  const used = parts.filter(p=>p[1]!==null), wt = used.reduce((s,p)=>s+p[2],0);
  const score = used.length ? Math.round(used.reduce((s,p)=>s+p[1]*p[2],0)/wt) : null;
  return { tasks, fin, wrk, pen, parts, score, due:due.length, onTime, days, closed };
}
const uaeHM = isoTs => new Date(isoTs).toLocaleTimeString('en-GB', { timeZone:'Asia/Dubai', hour:'2-digit', minute:'2-digit' });
const hmToMin = s => { const [h,m] = s.split(':').map(Number); return h*60+m; }, minToHM = x => `${String(Math.floor(x/60)).padStart(2,'0')}:${String(Math.round(x%60)).padStart(2,'0')}`;
function sessionDays(rows){
  const by = {};
  rows.forEach(r=>{ const d = uaeDay(r.created_at), x = by[d] = by[d] || { d, inn:null, out:null, n:0, dev:'', loc:null, locOut:null };

  return Object.values(by).sort((p,q)=>q.d.localeCompare(p.d));
}

function defaultSheetMonth(n){ const t = dUTC(n.date); return t.getUTCDate() <= 5 ? iso(new Date(Date.UTC(t.getUTCFullYear(), t.getUTCMonth()-1, 1))).slice(0,7) : n.date.slice(0,7); }

    const locTxt = r => r ? (r.lat!=null ? mapUrl(r) : (r.note||'No location')) : '';

        const dn = dUTC(d).toLocaleDateString('en-GB',{ weekday:'short', timeZone:'UTC' });

        if (inn && inn.lat!=null) links.push([daily.length-1, 5, mapUrl(inn)]); if (out && out.lat!=null) links.push([daily.length-1, 8, mapUrl(out)]);
      }

    });
    const events = [['Date','Time','Employee','Event','Latitude','Longitude','Accuracy (m)','Map','Note','Device']];
    rows.forEach(r=>events.push([uaeDay(r.created_at), uaeHM(r.created_at), userName(r.person), SESS_LABEL[r.kind]||r.kind, r.lat??'', r.lng??'', r.acc?Math.round(r.acc):'', r.lat!=null?mapUrl(r):'', r.note||'', r.device||'']));
    const wb = XLSX.utils.book_new();

/* ===== Task attachments (storage bucket "taskfiles") with an AI brief for the manager ===== */
const CLIP_IC = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m21 11-8.6 8.6a5 5 0 0 1-7-7L14 4a3.3 3.3 0 0 1 4.7 4.7l-8.6 8.6a1.7 1.7 0 0 1-2.4-2.4L15.4 7"/></svg>';
const TF_MAX = 20*1024*1024;
async function uploadTaskFiles(files){
  const out = [];
  for (const f of [...files]){
    if (f.size > TF_MAX) throw new Error(`${f.name} is larger than 20 MB.`);
    const id = uid(), safe = f.name.replace(/[^\w.\- ]+/g,'_').slice(-80), path = `${now().date}/${id}-${safe}`;
    const r = await sb.storage.from('taskfiles').upload(path, f, { contentType:f.type || 'application/octet-stream', upsert:false });
    if (r.error) throw new Error(`${f.name}: ${r.error.message}`);
    out.push({ rec:{ id, name:f.name, path, mime:f.type||'', size:f.size, by:ui.user, at:new Date().toISOString(), brief:'', briefState:'pending' }, file:f });
  }
  return out;
}
function loadScript(src, globalName){
  if (window[globalName]) return Promise.resolve(window[globalName]);
  return new Promise((ok, bad)=>{ const s = document.createElement('script'); s.src = src; s.onload = ()=>ok(window[globalName]); s.onerror = ()=>bad(new Error('Could not load a helper. Check the internet connection.')); document.head.appendChild(s); });
}
const b64 = f => new Promise((ok, bad)=>{ const r = new FileReader(); r.onload = ()=>ok(String(r.result).split(',')[1]); r.onerror = bad; r.readAsDataURL(f); });
async function fileText(f){
  const n = f.name.toLowerCase();
  if (/^text\//.test(f.type) || /\.(txt|csv|md|json)$/.test(n)) return (await f.text()).slice(0, 15000);
  if (/\.(xlsx|xls|ods)$/.test(n)){ const X = await loadXLSX(), wb = X.read(await f.arrayBuffer(), { type:'array' });
    return wb.SheetNames.slice(0,3).map(s=>`Sheet ${s}:\n`+X.utils.sheet_to_csv(wb.Sheets[s])).join('\n\n').slice(0, 15000); }
  if (/\.(docx|pptx)$/.test(n)){ const JZ = await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js', 'JSZip'), z = await JZ.loadAsync(await f.arrayBuffer());
    const parts = Object.keys(z.files).filter(k=>/^word\/document\.xml$|^ppt\/slides\/slide\d+\.xml$/.test(k)).sort((a,b)=>a.localeCompare(b, undefined, { numeric:true }));
    let t = ''; for (const k of parts){ t += (await z.file(k).async('string')).replace(/<\/w:p>|<\/a:p>/g,'\n').replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>') + '\n'; }
    return t.replace(/\n{3,}/g,'\n\n').slice(0, 15000); }
  return null;
}
async function briefFor(f, task){
  const ask = `A staff member attached this file to the task “${task.title}”${task.details?' ('+task.details+')':''}. Write a brief for their manager in 2 to 4 short sentences: what the file is, the key facts or numbers in it, and how it relates to the task. Use only what is in the file; if it is unreadable, say so.`;
  if (/^image\/(png|jpeg|webp|gif)$/.test(f.type) || f.type==='application/pdf' || /\.pdf$/i.test(f.name)){
    if (f.size > 7*1024*1024) return 'Too large for the AI to read (over 7 MB).';
    const { data, error } = await sb.functions.invoke('ai', { body:{ prompt:ask, files:[{ mime: f.type || 'application/pdf', data: await b64(f) }] } });
    if (error || !data || !data.text) throw new Error((data && data.error) || 'AI not reachable');
    return data.text.trim().slice(0, 800);
  }
  const t = await fileText(f); if (t===null) return 'The AI cannot read this type of file.';
  if (!t.trim()) return 'The file appears to be empty.';
  return (await aiAsk(`${ask}\n\nFile name: ${f.name}\nFile content:\n"""${t}"""`)).trim().slice(0, 800);
}
/* Attach uploaded file records to tasks (and requests), then write the AI briefs in the background. */
function attachFiles(ups, taskIds, reqIds){
  const recs = ups.map(u=>u.rec);
  taskIds.forEach(id=>{ const t = db.tasks.find(x=>x.id===id); if (t) t.files = (t.files||[]).concat(recs.map(r=>({ ...r }))); });
  (reqIds||[]).forEach(id=>{ const r = db.requests.find(x=>x.id===id); if (r) r.files = (r.files||[]).concat(recs.map(x=>({ ...x }))); });
  save();
  const task = db.tasks.find(x=>x.id===taskIds[0]) || db.requests.find(x=>x.id===(reqIds||[])[0]) || { title:'' };
  return Promise.all(ups.map(async u=>{
    let brief = '', st = 'done';
    try{ brief = await briefFor(u.file, task); }catch(e){ brief = ''; st = 'failed'; }
    const set = list => list.forEach(x=>(x.files||[]).forEach(f=>{ if (f.id===u.rec.id){ f.brief = brief; f.briefState = st; } }));
    set(db.tasks); set(db.requests); save(); safeRender();
  }));
}
function filesHtml(t, compact){
  const fs = t.files || []; if (!fs.length) return '';
  return `<div class="tfiles">${fs.map(f=>`<div class="tfile"><button type="button" class="linkbtn" data-act="tf-get" data-path="${esc(f.path)}" data-name="${esc(f.name)}">${CLIP_IC}${esc(f.name)}</button>${(f.by===ui.user || isMgmt(ui.user))?` <button type="button" class="linkbtn tf-del" data-act="tf-del" data-id="${esc(f.id)}" data-path="${esc(f.path)}" data-name="${esc(f.name)}" title="Remove this file">Remove</button>`:''}
    ${f.briefState==='pending'?'<span class="hint" style="margin:0"> · AI is reading it…</span>':f.briefState==='failed'?'<span class="hint" style="margin:0"> · AI brief will be retried automatically</span>':f.brief?`<div class="tbrief"><b>AI brief:</b> ${esc(f.brief)}</div>`:''}</div>`).join('')}</div>`;
}
async function getTaskFile(path, name, btn){
  btn.disabled = true;
  try{ const { data, error } = await sb.storage.from('taskfiles').createSignedUrl(path, 300); if (error) throw error;
    const r = await fetch(data.signedUrl), url = URL.createObjectURL(await r.blob()), a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url), 60000); }
  catch(e){ tip('Could not open the file', e.message || 'Check the internet connection.'); }

/* The person who attached a file (or the CEO/GM) can remove it: from storage and from every task/request that carries it. */
async function removeTaskFile(fid, path, name, btn){
  const holders = db.tasks.concat(db.requests).filter(x=>(x.files||[]).some(f=>f.id===fid));
  const f = holders.length ? holders[0].files.find(x=>x.id===fid) : null;
  if (!f || !(f.by===ui.user || isMgmt(ui.user))) return;
  const n = db.tasks.filter(x=>(x.files||[]).some(y=>y.id===fid)).length;
  if (!confirm(`Remove “${name}”?${n>1?` It is attached to ${n} people's copies of this task and will be removed from all of them.`:''} This cannot be undone.`)) return;
  btn.disabled = true;
  const r = await sb.storage.from('taskfiles').remove([path]);
  if (r.error){ btn.disabled = false; tip('Could not remove', r.error.message); return; }
  db.tasks.concat(db.requests).forEach(x=>{ if ((x.files||[]).some(y=>y.id===fid)) x.files = x.files.filter(y=>y.id!==fid); });
  save(); render(); tip('Removed', `“${name}” was removed.`);
}
/* Briefs that failed (e.g. the AI was busy) are retried by the uploader's open portal, at most every 10 minutes per file. */
const BRIEF_TRY = {}; let BRIEF_BUSY = false;
async function retryFailedBriefs(){
  if (BRIEF_BUSY || !sb || !ui.authed) return;
  const seen = new Set(), todo = [];
  db.tasks.concat(db.requests).forEach(x=>(x.files||[]).forEach(f=>{ if (f.briefState==='failed' && f.by===ui.user && !seen.has(f.id) && Date.now() - (BRIEF_TRY[f.id]||0) > 600000){ seen.add(f.id); todo.push({ f, task:x }); } }));
  if (!todo.length) return; BRIEF_BUSY = true;
  for (const { f, task } of todo.slice(0,3)){
    BRIEF_TRY[f.id] = Date.now();
    try{
      const { data, error } = await sb.storage.from('taskfiles').createSignedUrl(f.path, 300); if (error) throw error;
      const file = new File([await (await fetch(data.signedUrl)).blob()], f.name, { type:f.mime || '' });
      const brief = await briefFor(file, task);
      db.tasks.concat(db.requests).forEach(x=>(x.files||[]).forEach(y=>{ if (y.id===f.id){ y.brief = brief; y.briefState = 'done'; } }));
      save(); safeRender();
      const ck = Object.keys(db.closures).find(k=>{ const c = db.closures[k]; return k.startsWith(ui.user+'|') && (c.tasks||[]).includes(task.id) && !c.review && closureEditable(ui.user, k.split('|')[1]); });
      if (ck) aiScoreClosure(ck).then(()=>safeRender());
    }catch(_){ /* try again later */ }
  }
  BRIEF_BUSY = false;
}
async function addFilesToTask(id, files){
  const t = db.tasks.find(x=>x.id===id); if (!t || !files.length) return;
  tip('Uploading', `${files.length} file${files.length===1?'':'s'}…`);

  catch(e){ tip('Upload failed', e.message); }
}

/* ===== Feasibility: the person says whether assigned work fits the time; the assigner can change the duration ===== */

    <div class="row" style="margin-top:6px"><button class="btn sm" data-act="feas-change" data-id="${t.id}">Change to ${f.need} days</button><button class="btn sm ghost" data-act="feas-keep" data-id="${t.id}">Keep ${t.days} day${t.days===1?'':'s'}</button></div></div>`;

function feasClick(act, a){

  if ((act==='feas-change' || act==='feas-keep') && t.assignedBy===me && t.feas && t.feas.state==='not'){

    else t.feas.state = 'kept';
    t.feas.decidedAt = new Date().toISOString();
    const msg = act==='feas-change' ? `${userName(me)} changed “${t.title}” to ${t.days} days (due ${fmtShort(t.dueDate)}).` : `${userName(me)} kept “${t.title}” at ${t.days} day(s). Please plan accordingly or speak to them.`;
    notify(t.owner, msg, at, null); emailPeople([t.owner], `Duration ${act==='feas-change'?'changed':'kept'}: ${t.title}`, msg); save(); render(); return true; }
  return false;
}
function feasSubmit(form){

/* OpenStreetMap place search (Photon), called straight from the browser: much faster than going through our server. */
async function photonSearch(q, signal){
  const r = await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(q)}&limit=8&lang=en&lat=25.2&lon=55.3&location_bias_scale=0.3`, { signal });
  if (!r.ok) throw new Error('map search '+r.status);
  const d = await r.json(), seen = new Set();
  const gulf = f => /United Arab Emirates|Saudi Arabia|Oman|Qatar|Bahrain|Kuwait/.test((f.properties||{}).country||'') ? 0 : 1;
  return (d.features||[]).sort((a,b)=>gulf(a)-gulf(b)).map(f=>{ const p = f.properties||{}, c = (f.geometry||{}).coordinates||[];
    const label = p.name || [p.street, p.housenumber].filter(Boolean).join(' ') || p.city || '';
    const sub = [p.district||p.locality, p.city!==label?p.city:'', p.state!==p.city?p.state:'', p.country].filter(Boolean).join(', ');
    return { label, sub, lat:c[1], lng:c[0] }; }).filter(x=>x.label && isFinite(x.lat) && !seen.has(x.label+x.sub) && seen.add(x.label+x.sub)).slice(0,6);
}
function paintPlaces(inp, local, remote, state){

  const items = top.slice(0,2).concat(remote, top.slice(2), rest).slice(0,8);

async function placeSuggest(inp){
  const q = inp.value.trim(), seq = ++plcSeq, list = inp.closest('.plc').querySelector('.plc-list');
  const online = inp.id==='mPlace' && (document.querySelector('input[name=mMode]:checked')||{}).value==='online';
  if (plcCtl){ try{ plcCtl.abort(); }catch(_){} plcCtl = null; }
  if (online || q.length < 2 || /^https?:|teams|zoom|meet\.google/i.test(q)){ list.hidden = true; return; }
  const local = localPlaces(q), key = q.toLowerCase();
  if (PLC_CACHE.has(key)){ paintPlaces(inp, local, PLC_CACHE.get(key), 'done'); return; }
  paintPlaces(inp, local, [], 'loading');
  const ctl = plcCtl = new AbortController(), tm = setTimeout(()=>ctl.abort(), 5000);
  let remote = [];
  try{ remote = await photonSearch(q, ctl.signal); }
  catch(e){
    if (seq!==plcSeq) return;
    try{ const { data } = await sb.functions.invoke('maps', { body:{ action:'suggest', q } }); remote = (data && data.items) || []; }catch(_){ remote = []; }
  } finally { clearTimeout(tm); }
  if (seq!==plcSeq) return;
  if (remote.length) PLC_CACHE.set(key, remote);
  paintPlaces(inp, local, remote, 'done');
}

/* ===== Close a single task as soon as its work is finished (beside "Attach files" on the task card) =====
   The person writes what they did (and can attach files); the AI reads the files and rates the task.
   100% = the task is complete; less = it stays open and carries forward. The text is reused in the day's closure report. */
function canCloseTask(t){
  const n = now(), d = n.date;
  if (t.owner!==ui.user || !hasOwnReport(ui.user) || closedToday(ui.user, d) || t.startDate > d) return false;
  if (!['plan','extra'].includes(phaseFor(n.mins, ui.user))) return false;
  return !(t.completedOn && t.completedOn < d) && !(t.completedOn===d);
}
function taskCloseState(t, d){
  const l = (t.log||{})[d]; if (!l || !l.closedEarly) return '';
  if (l.pending) return `<div class="tc-st pend"><b>Closed today</b> · AI rating pending. It will be rated with your closure report if the AI is busy.</div>`;
  return `<div class="tc-st ${l.progress>=100?'ok':''}"><b>${l.progress>=100?'Task closed':'Closed for today'}</b> · AI rated ${l.progress}%${l.aiNote?' — '+esc(l.aiNote):''}${l.progress<100?' It stays open and carries forward.':''}</div>`;
}

async function closeTaskNow(btn){
  const id = btn.dataset.id, f = btn.closest('form'), err = f.querySelector('.err'), n = now(), d = n.date, me = ui.user;
  const fail = m => { err.hidden = false; err.textContent = m; };
  const t0 = db.tasks.find(x=>x.id===id); if (!t0 || !canCloseTask(t0)){ ui.tc = null; render(); return; }
  const txt = f.querySelector('.tc-txt').value.trim(), w = words(txt);
  if (w < MIN_WORK_WORDS) return fail(`Write what you did (at least ${MIN_WORK_WORDS} words). Currently ${w}.`);
  const k = 'tc-'+id, files = [...(CL_FILES[k]||[])], old = btn.textContent;
  btn.disabled = true;
  let waits = Promise.resolve();
  if (files.length){
    btn.textContent = `Uploading ${files.length} file${files.length===1?'':'s'}…`;
    try{ const ups = await uploadTaskFiles(files); waits = attachFiles(ups, [id]); delete CL_FILES[k]; }
    catch(e){ btn.disabled = false; btn.textContent = old; return fail('Upload failed: '+e.message); }
  }
  let t = db.tasks.find(x=>x.id===id); if (!t) return;
  t.log = t.log || {};
  t.log[d] = Object.assign({}, t.log[d]||{ progress:prevProgress(t,d) }, { justification:txt.slice(0,2000), pending:true, closedEarly:true, closedAt:new Date().toISOString() });
  ui.tc = null; save(); render();
  tip('Task closed', files.length ? 'The AI is reading your files and rating the task…' : 'The AI is rating the task…');
  await Promise.race([waits, new Promise(r=>setTimeout(r, 90000))]);
  try{
    t = db.tasks.find(x=>x.id===id); if (!t) return;
    const j = parseJSONLoose(await aiAsk(scorePrompt(me, d, [{ t, work:txt }])));
    const r = (Array.isArray(j.tasks)?j.tasks:[]).find(x=>x.id===id) || (Array.isArray(j.tasks)?j.tasks[0]:null);
    if (!r || !isFinite(+r.pct)) throw new Error('no rating');
    t = db.tasks.find(x=>x.id===id); if (!t) return;   // re-read after await
    const pct = Math.max(0, Math.min(100, Math.round((+r.pct)/5)*5));
    t.log[d] = { progress:pct, justification:txt.slice(0,2000), aiNote:String(r.note||'').slice(0,400), closedEarly:true, closedAt:t.log[d].closedAt };
    if (pct>=100) t.completedOn = d; else if (t.completedOn===d) t.completedOn = null;
    save(); safeRender();
    const who = [t.assignedBy].filter(x=>x && x!==me);
    who.forEach(x=>notify(x, `${userName(me)} closed “${t.title}” — AI rated ${pct}%.`, nowAbs(), null));
    if (pct>=100){ const fl = (t.files||[]).map(x=>x.name).join(', ');
      emailPeople([me, ...mgrIdsOf(me), ...(t.assignedBy?[t.assignedBy]:[])], `Task completed: “${t.title}” — ${userName(me)}`,
        `${userName(me)} completed the task “${t.title}” on ${fmtDate(d)}.\n\nWhat was done: ${txt}\n\nAI rating: ${pct}%${r.note?' — '+r.note:''}${fl?'\nFiles: '+fl:''}`, true); }
    tip(pct>=100?'Task complete':'Task rated', pct>=100 ? `“${t.title}” is closed at 100%.` : `AI rated it ${pct}%. It stays open and carries forward.`);
  }catch(_){ tip('Saved', 'The AI could not rate it just now. It will be rated with your closure report.'); }
}

/* ===== Work in parts: a task can be split into stages that follow each other (e.g. Drawing 3 days, then Simulation 5 days).
   Each part has its own planned dates; the person marks a part done with a short note, and the next part becomes current. ===== */
function partsPlan(t){
  let s = t.startDate;
  return (t.parts||[]).map((p,i)=>{ const st = s, en = addDays(s, Math.max(1, p.days)-1); s = addDays(en, 1); return { ...p, i, start:st, end:en }; });
}
function currentPart(t){ return partsPlan(t).find(p=>!p.done) || null; }
function partsSummary(t, d){
  const pl = partsPlan(t); if (!pl.length) return '';
  return pl.map(p=>`${p.i+1}. ${p.title} (${p.days} day${p.days===1?'':'s'}, planned ${p.start} to ${p.end}): ${p.done?`done on ${p.doneOn}${p.note?' — '+p.note:''}`:(d>p.end?'NOT done, past its planned end':(d>=p.start?'in progress':'not started'))}`).join('; ');
}
function partsHtml(t, d, opts){
  const pl = partsPlan(t); if (!pl.length) return '';
  const cur = pl.find(p=>!p.done), me = ui.user, own = t.owner===me && !(opts && opts.readOnly);
  const doneN = pl.filter(p=>p.done).length;
  return `<div class="parts"><div class="parts-h"><b>Parts</b> <span class="hint" style="margin:0">${doneN} of ${pl.length} done</span></div>
    ${pl.map(p=>{ const late = !p.done && d > p.end, now = cur && cur.i===p.i;
      const cls = p.done ? 'done' : late ? 'late' : now ? 'cur' : '';
      return `<div class="part ${cls}"><span class="pn">${p.done?'✓':p.i+1}</span><div class="pb"><b>${esc(p.title)}</b> <small>${p.days} day${p.days===1?'':'s'} · ${fmtShort(p.start)}–${fmtShort(p.end)}</small>
        ${p.done?`<div class="hint" style="margin:0">Done ${fmtShort(p.doneOn)}${p.note?' — '+esc(p.note):''}</div>`:late?`<div class="hint" style="margin:0;color:var(--emg)">Behind plan: should have finished ${fmtShort(p.end)}</div>`:now?`<div class="hint" style="margin:0">Current part${d>=p.start?` · day ${diffDays(p.start,d)+1} of ${p.days}`:''}</div>`:''}
        ${own && now && ui.pd===t.id+':'+p.id ? `<form class="pd-form" data-id="${t.id}" data-p="${p.id}" novalidate><textarea class="pd-note" rows="2" placeholder="What was finished in this part? (optional)"></textarea><button type="submit" class="btn sm">Mark done</button><button type="button" class="btn sm ghost" data-act="pd-x">Cancel</button><div class="err" hidden></div></form>`
          : own && now && canMarkPart(t) ? `<button type="button" class="linkbtn tc-btn" data-act="pd-open" data-id="${t.id}" data-p="${p.id}">✓ Mark this part done</button>` : ''}</div></div>`; }).join('')}</div>`;
}
const canMarkPart = t => t.owner===ui.user && !closedToday(ui.user, now().date) && ['plan','extra'].includes(phaseFor(now().mins, ui.user)) && !(t.completedOn && t.completedOn < now().date);
function doPartDone(t, p, note){
  const d = now().date; p.done = true; p.doneOn = d; p.note = String(note||'').trim();
  const next = partsPlan(t).find(x=>!x.done), na = nowAbs();
  const msg = `${userName(t.owner)} finished part “${p.title}” of “${t.title}”${next?` — next: ${next.title}`:' — all parts done'}.`;
  [...new Set([t.assignedBy, ...mgrIdsOf(t.owner)])].filter(x=>x && x!==ui.user).forEach(x=>notify(x, msg, na, null));
  save(); return next || null;
}
function markPartDone(f){
  const t = db.tasks.find(x=>x.id===f.dataset.id), err = f.querySelector('.err'), note = f.querySelector('.pd-note').value.trim();
  if (!t || !canMarkPart(t)) { ui.pd = null; render(); return; }
  const p = (t.parts||[]).find(x=>x.id===f.dataset.p); if (!p || p.done) return;
  const next = doPartDone(t, p, note);
  ui.pd = null; save(); render();
  if (!next){ ui.tc = t.id; render(); tip('All parts done', 'Close the task now: write what was done and the AI will rate it.'); }
  else tip('Part done', `Next part: ${next.title}.`);
}

function readParts(form, old){

/* ===== Cancel a meeting (before it starts): reason required; follow-up reminder now and again after 7 days if not rebooked ===== */

/* ===== Meeting chart: owner, their manager(s), GM and CEO. Short AI brief here; the full register is an Excel file built on the server. ===== */
const canSeeMeeting = (m, me) => m.owner===me || isMgmt(me) || (getUser(m.owner).managers||[]).includes(me) || reviewersOf(m.owner).some(r=>r.id===me);
const chartTabFor = id => hasOwnReport(id) || isMgmt(id) || USERS.some(u=>u.id!==id && (u.managers||[]).includes(id));
const momText = m => m.outcome==='postponed' ? (m.postponeReason||'') : (m.notes||'');
const momSig = m => String(momText(m).length) + ':' + momText(m).slice(-40);
const MOM_BUSY = new Set();
async function ensureMomBrief(id){
  const m0 = db.meetings.find(x=>x.id===id); if (!m0 || !momText(m0) || MOM_BUSY.has(id)) return;
  if (m0.momBrief && m0.momBriefFor===momSig(m0)) return;
  if (m0.momBriefTry && Date.now() - m0.momBriefTry < 30*60000) return;
  MOM_BUSY.add(id);
  try{
    const t = await aiAsk(`Summarise these minutes of a business meeting in 2 or 3 short lines of plain text (no bullet symbols, no Markdown). Cover the main outcome, any agreed numbers or dates, and the next step with who does it. Use only what is written.
Meeting with: ${m0.withWhom}. Purpose: ${m0.purpose}. ${m0.outcome==='postponed'?'The meeting was postponed. Reason given:':'Minutes:'}
---
${momText(m0).slice(0,6000)}
---`);
    const m = db.meetings.find(x=>x.id===id); if (!m) return;   // re-read after await (realtime may have replaced it)
    m.momBrief = String(t||'').replace(/[*#_`]/g,'').trim().slice(0,500); m.momBriefFor = momSig(m); delete m.momBriefTry; save(); scheduleRender();
  }catch(_){ const m = db.meetings.find(x=>x.id===id); if (m){ m.momBriefTry = Date.now(); save(); } }
  finally{ MOM_BUSY.delete(id); }
}
const chartStatus = (m, na) => m.status==='cancelled' ? 'Cancelled' : m.status==='approved' ? (m.outcome==='postponed'?'Postponed · approved':'Held · approved') : m.status==='review' ? (m.outcome==='postponed'?'Postponed · awaiting approval':'Held · awaiting approval') : m.status==='returned' ? 'Sent back' : mState(m,na)==='upcoming' ? 'Upcoming' : 'Notes needed';
function meetingChartView(){
  const me = ui.user, na = nowAbs(), n = now(), st = ui.mch = ui.mch || { month:n.date.slice(0,7), who:'' };
  const all = (db.meetings||[]).filter(m=>canSeeMeeting(m, me));
  const people = [...new Set(all.map(m=>m.owner))].map(getUser).sort((a,b)=>a.name.localeCompare(b.name));
  const months = [...new Set(all.map(m=>m.date.slice(0,7)).concat([n.date.slice(0,7)]))].sort().reverse();
  const rows = all.filter(m=>(st.month==='all' || m.date.slice(0,7)===st.month) && (!st.who || m.owner===st.who)).sort((a,b)=>mStart(b)-mStart(a));
  rows.filter(m=>momText(m) && (!m.momBrief || m.momBriefFor!==momSig(m))).slice(0,3).forEach(m=>ensureMomBrief(m.id));
  const mlabel = mo => new Date(mo+'-01T12:00:00Z').toLocaleDateString('en-GB',{month:'long',year:'numeric',timeZone:'UTC'});

/* Returns null when the plan is fine, or { msg, suggest } with a suggested start (abs minutes). */
async function checkMeetingPlan(c){

  if (c.mode==='person' && c.place){
    const ip = same.filter(m=>(m.mode||'person')==='person' && m.place);
    const prev = ip.filter(m=>mEnd(m) <= s + 1).sort((a,b)=>mEnd(b)-mEnd(a))[0], next = ip.filter(m=>mStart(m) >= s).sort((a,b)=>mStart(a)-mStart(b))[0];
    if (prev){ links.push({ label:`Route from ${prev.withWhom}`, url:gmapsRoute(prev, c) }); try{ const t = await travelMinutes(prev, c, mEnd(prev)), need = mEnd(prev) + t.min + 15;
        if (s < need){ suggest = round15(need); lines.push(`Your meeting with ${prev.withWhom} in ${prev.place} ends at ${hhmm(mEnd(prev))}. Driving to ${c.place} takes about ${t.min} minutes at that time. ${t.note} With 15 minutes to spare, the earliest realistic start is ${hhmm(suggest)}.`); }
      }catch(_){ if (s - mEnd(prev) < 60) lines.push(`Your meeting with ${prev.withWhom} in ${prev.place} ends at ${hhmm(mEnd(prev))}, and the travel time to ${c.place} could not be estimated. Leave enough time to get there.`); } }
    if (next){ links.push({ label:`Route to ${next.withWhom}`, url:gmapsRoute(c, next) }); const st = suggest || s; try{ const t = await travelMinutes(c, next, st + mDur(c));

}

/* ===== "Hey Densons" wake word (opt-in per device). Listens while the portal is open and visible. ===== */
const WAKE_RE = /\b(hey|hi|ho|hello|ok|okay|oye)[\s,.!]+(d[ae]n+[sz]on'?s?|then\s?sons?|dan\s?sons?|den\s?sons?|danson|dawson|jensen|denzel)\b/i;
const WAKE = { on:false, rec:null, paused:0, starting:false };
try{ WAKE.on = localStorage.getItem('dwp-wake')==='1'; }catch(_){}
function wakeAllowed(){ return WAKE.on && SR && ui.authed && !WAKE.paused && document.visibilityState==='visible'; }
function wakeStart(){
  if (!wakeAllowed() || WAKE.rec || WAKE.starting) return;
  const r = new SR(); r.lang = STT_LANG; r.continuous = true; r.interimResults = true; WAKE.starting = true;
  r.onresult = e=>{
    let txt = ''; for (let i=e.resultIndex; i<e.results.length; i++) txt += e.results[i][0].transcript + ' ';
    const m = txt.match(WAKE_RE); if (!m) return;
    const last = e.results[e.results.length-1]; if (!last.isFinal && txt.slice(m.index + m[0].length).trim().split(/\s+/).filter(Boolean).length < 4) return;   // wait for the end of the sentence
    const cmd = txt.slice(m.index + m[0].length).replace(/^[\s,.!?]+/, '').trim();
    wakeStop(); wakeHeard(cmd);
  };
  r.onerror = e=>{ if (e.error==='not-allowed' || e.error==='service-not-allowed'){ WAKE.on = false; try{ localStorage.setItem('dwp-wake','0'); }catch(_){} tip('Hey Densons', 'Microphone permission was refused, so "Hey Densons" was turned off.'); paintAI(); } };
  r.onend = ()=>{ if (WAKE.rec===r) WAKE.rec = null; setTimeout(wakeStart, 400); };
  r.onstart = ()=>{ WAKE.starting = false; paintWakeDot(); };
  try{ r.start(); WAKE.rec = r; }catch(_){ WAKE.starting = false; WAKE.rec = null; }
  setTimeout(()=>{ WAKE.starting = false; }, 3000);
}
function wakeStop(){ const r = WAKE.rec; WAKE.rec = null; if (r){ r.onend = null; try{ r.abort(); }catch(_){} } paintWakeDot(); }
function wakePause(){ WAKE.paused++; wakeStop(); }
function wakeResume(){ WAKE.paused = Math.max(0, WAKE.paused-1); setTimeout(wakeStart, 600); }
async function wakeHeard(cmd){
  AST.open = true; if (CHAT.open){ CHAT.open = false; paintChat(); } paintAI();
  WAKE.paused++;
  try{
    if (cmd && cmd.split(/\s+/).length >= 2){ await aiSend(cmd); }
    else { await speak('Yes? How can I help?'); await aiListen(); }
  } finally { WAKE.paused = Math.max(0, WAKE.paused-1); setTimeout(()=>{ if (!AST.listening && !AST.busy) wakeStart(); }, 1500); }
}
function setWake(on){
  if (on && !SR){ tip('Hey Densons', 'This browser cannot listen for "Hey Densons". Please use Chrome or Edge.'); return; }
  WAKE.on = on; try{ localStorage.setItem('dwp-wake', on?'1':'0'); }catch(_){}
  if (on){ WAKE.paused = 0; wakeStart(); tip('Hey Densons is on', 'Say "Hey Densons" followed by what you need, while the portal is open on this device.'); } else wakeStop();
  paintAI();
}

let ONLINE = new Map(), PRES = null;

function startPresence(){
  try{
    if (PRES) sb.removeChannel(PRES);
    const ch = PRES = sb.channel('online-now', { config:{ presence:{ key:ui.user } } });
    ch.on('presence', { event:'sync' }, ()=>{
      if (PRES!==ch) return;
      const st = ch.presenceState(), m = new Map();
      Object.keys(st).forEach(k=>{ const metas = st[k]||[]; m.set(k, metas.map(x=>x.since).filter(Boolean).sort()[0] || ''); });
      const changed = m.size!==ONLINE.size || [...m.keys()].some(k=>!ONLINE.has(k)); ONLINE = m;
      if (changed && isAdminUser(ui.user) && ['activity','dash','logins'].includes(ui.view)) scheduleRender();
    }).subscribe(async status=>{ if (status==='SUBSCRIBED' && PRES===ch) await ch.track({ since:new Date().toISOString(), device:deviceName() }); });
  }catch(_){ }
}
function stopPresence(){ try{ if (PRES){ PRES.untrack(); sb.removeChannel(PRES); } }catch(_){ } PRES = null; ONLINE = new Map(); }
function subscribe(){
  startPresence();
  sb.channel('records-live').on('postgres_changes', { event:'*', schema:'public', table:'records' }, p=>{
    const r = (p.new && p.new.collection) ? p.new : p.old; if (!r || !COLS.includes(r.collection)) return;

    applyRemote(r.collection, r.id, p.eventType==='DELETE' ? null : p.new.data); scheduleRender();

  const f = { title, details, priority, days, projectId, ...(pr.parts?{ parts:pr.parts }:{}) }, taskIds = [], reqIds = [];
  if (kind==='assign'){

  if (e.target.id==='loginForm') return doLogin();
  if (e.target.id==='newPwForm' || e.target.id==='chPwForm') return setNewPassword();
  if (e.target.id==='meetForm') return scheduleMeeting(false);
  if (e.target.id==='chatForm') return chatSend();
  if (e.target.classList.contains('feasf')) return feasSubmit(e.target);
  if (e.target.id==='aiForm'){ const i = e.target.querySelector('#aiIn'), t = i.value; i.value = ''; return aiSend(t); }
  if (e.target.id==='camForm') return camSave(e.target);
  if (e.target.classList.contains('projf')) return createProject(e.target);
  if (e.target.classList.contains('projedit')) return saveProjectEdit(e.target);
  if (e.target.classList.contains('msf')) return addMilestone(e.target);
  if (e.target.classList.contains('pchatf')) return sendChat(e.target, false);
  if (e.target.classList.contains('mout')) return submitOutcome(e.target);
  if (e.target.classList.contains('chatf')) return addDiary(e.target);
  const f = e.target.closest('.tform'); if (f) addOrSaveTask(f);
});

document.addEventListener('click', e=>{
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act;
  if (act==='view'){ ui.view = a.dataset.v; ui.editing=null; }
  else if (act==='portal'){ if (!isAdminUser(ui.user)) return; ui.portal = a.dataset.p; ui.view = tabsFor(ui.user)[0][0]; ui.editing = null; ui.proj = null; save(); render(); window.scrollTo(0,0); return; }
  else if (act==='edit'){ ui.editing = a.dataset.id; render(); document.querySelector('.tform input[name=title]')?.focus(); return; }
  else if (act==='cancel-edit'){ ui.editing = null; }
  else if (act==='del'){
    const t = db.tasks.find(x=>x.id===a.dataset.id);
    if (!t || !canEdit(t, ui.user, now())){ render(); return; }
    if (!confirm('Delete this task?')) return;
    db.tasks = db.tasks.filter(x=>x.id!==t.id); ui.editing=null;
  }
  else if (act==='submit-closure'){ submitClosure(); return; }
  else if (act==='close-edit'){ ui.editClosure = true; render(); setTimeout(()=>document.getElementById('closureCard')?.scrollIntoView({behavior:'smooth'}), 50); return; }
  else if (act==='close-edit-cancel'){ ui.editClosure = false; }
  else if (act.startsWith('feas-') && feasClick(act, a)) return;
  else if (act==='tf-get'){ getTaskFile(a.dataset.path, a.dataset.name, a); return; }
  else if (act==='arc-day'){ ui.arcDate = a.dataset.d; render(); return; }
  else if (act==='arc-zip'){ zipDay(a.dataset.d, a); return; }
  else if (act==='tf-del'){ removeTaskFile(a.dataset.id, a.dataset.path, a.dataset.name, a); return; }
  else if (act==='tg-del'){ ui.tgt = (ui.tgt||[]).filter(x=>x!==a.dataset.id); paintTargets(a.closest('.tform')); return; }
  else if (act==='trial-reset'){ resetModal(); return; }
  else if (act==='plc-pick'){ placePick(a); return; }
  else if (act==='tt-day'){ const st = ui.tt = ui.tt || { by:'person' }, t = now().date, cur = st.date && st.date<=t ? st.date : t, k = +a.dataset.d;
    st.date = k===0 ? '' : (()=>{ const x = addDays(cur, k); return x > t ? '' : x; })(); render(); return; }
  else if (act==='tt-hist'){ const st = ui.tt = ui.tt || {}; st.who = a.dataset.id; st.by = 'hist'; render(); window.scrollTo(0,0); return; }
  else if (act==='pd-open'){ ui.pd = a.dataset.id+':'+a.dataset.p; render(); setTimeout(()=>document.querySelector('.pd-form .pd-note')?.focus(), 50); return; }
  else if (act==='pd-x'){ ui.pd = null; render(); return; }
  else if (act==='pt-add'){ const f = a.closest('form'), rows = f.querySelector('.pt-rows'); rows.insertAdjacentHTML('beforeend', `<div class="pt-row"><input class="pt-name" placeholder="Part, e.g. Simulation"><input class="pt-days" type="number" min="1" max="60" value="1" aria-label="Days"><span class="hint" style="margin:0">days</span><button type="button" class="linkbtn tf-del" data-act="pt-del">Remove</button></div>`); syncPartsDays(f); rows.lastElementChild.querySelector('.pt-name').focus(); return; }
  else if (act==='pt-del'){ const f = a.closest('form'), r = a.closest('.pt-row'); if (f.querySelectorAll('.pt-row').length > 1) r.remove(); else r.querySelector('.pt-name').value = ''; syncPartsDays(f); return; }
  else if (act==='tc-open'){ ui.tc = a.dataset.id; render(); setTimeout(()=>{ const x = document.querySelector('.tcform .tc-txt'); if (x) x.focus(); }, 50); return; }
  else if (act==='tc-cancel'){ ui.tc = null; render(); return; }
  else if (act==='tc-save'){ closeTaskNow(a); return; }
  else if (act==='clf-del'){ const l = CL_FILES[a.dataset.id]||[]; l.splice(+a.dataset.i, 1); clfPaint(a.dataset.id); return; }
  else if (act==='rs-open'){ ui.rs = { id:a.dataset.id }; ui.cx = null; render(); return; }
  else if (act==='rs-cancel'){ ui.rs = null; render(); return; }
  else if (act==='rs-save'){ rescheduleMeeting(a); return; }
  else if (act==='cx-open'){ ui.cx = a.dataset.id; ui.rs = null; render(); return; }
  else if (act==='cx-close'){ ui.cx = null; render(); return; }
  else if (act==='cx-save'){ cancelMeeting(a); return; }
  else if (act==='cx-rebook'){ ui.rebook = a.dataset.id; ui.view = 'meet'; render(); window.scrollTo({ top:0, behavior:'smooth' }); return; }
  else if (act==='cx-rebook-x'){ ui.rebook = null; render(); return; }
  else if (act==='mreg-dl'){ downloadRegister(a); return; }
  else if (act==='trial-reset-x'){ document.getElementById('resetModal')?.remove(); return; }
  else if (act==='trial-reset-go'){ runReset(a); return; }
  else if (planClick(act)) return;
  else if (chatClick(act, a)) return;
  else if (mydClick(act, a)) return;
  else if (act==='sheet-dl'){ downloadMonthSheet(a); return; }
  else if (aiClick(act, a)) return;
  else if (camClick(act, a)) return;
  else if (projClick(act, a)) return;
  else if (act && act.startsWith('rq-')){ decideRequest(act.slice(3), a.closest('.rq')); return; }
  else if (act==='chk-done' || act==='chk-not'){ checkTask(a.dataset.id, act==='chk-done'); return; }
  else if (act==='nd-handled'){ handleNotDone(a.closest('.rq')); return; }
  else if (act==='ceo-ok' || act==='ceo-comment'){
    const k = a.dataset.k, ta = document.querySelector(`.ceotxt[data-k="${k}"]`), txt = ta ? ta.value.trim() : '';
    const err = ta ? ta.closest('label').parentElement.querySelector('.err') : null;
    if (act==='ceo-comment' && !txt){ if (err){ err.hidden=false; err.textContent='Write your comment first, or press "Okay".'; } return; }
    if (!db.closures[k] || !isCeo(ui.user)) return;
    db.closures[k].ceoReview = { by:ui.user, ok: act==='ceo-ok', text:txt, at:new Date().toISOString() };
    const owner = k.split('|')[0], gm = USERS.filter(u=>u.role==='General Manager').map(u=>u.id);
    const msg = act==='ceo-ok' && !txt ? 'Okay.' : txt;
    emailPeople([owner].concat(gm), `CEO review of ${userName(owner)}'s closure report (${fmtShort(k.split('|')[1])})`, `${userName(ui.user)}: ${msg}`);
    notify(owner, `CEO review of your closure report (${fmtShort(k.split('|')[1])}): ${msg}`, nowAbs(), null);
  }
  else if (act==='save-review'){
    const k = a.dataset.k, ta = document.querySelector(`.revtxt[data-k="${k}"]`), txt = ta.value.trim();
    const err = ta.closest('label').parentElement.querySelector('.err');
    if (!txt){ err.hidden=false; err.textContent='Please write a review before submitting.'; return; }
    db.closures[k].review = { by:ui.user, text:txt, at:new Date().toISOString() };
    emailPeople([k.split('|')[0]], `Your closure report was reviewed by ${userName(ui.user)}`, txt);
  }
  else if (act==='checkin'){ doCheckin(a,'visit'); return; }
  else if (act==='daylogin'){ doCheckin(a,'login'); return; }
  else if (act==='meet-now'){ scheduleMeeting(true); return; }
  else if (act==='stt'){ toggleDictation(a); return; }
  else if (act==='pick-tg'){ const pk = a.closest('.pick'), ul = pk.querySelector('.pick-list'); if (ul.hidden){ closePicks(pk); openPick(pk,''); pk.querySelector('.pick-in').focus(); } else closePicks(); return; }
  else if (act==='pick-opt'){ choosePick(a.closest('.pick'), a.dataset.id); return; }
  else if (act==='dperson-clear'){ if (ui.dash) ui.dash.person = null; }
  else if (act==='mom-draft'){ const m = db.meetings.find(x=>x.id===a.dataset.id), f = a.closest('form'), ta = f.querySelector('textarea[name=txt]');
    if (ta.value.trim() && /^MINUTES OF MEETING/.test(ta.value) && !confirm('Replace the current draft?')) return;
    ta.value = draftMoM(m, f); ta.dispatchEvent(new Event('input',{bubbles:true})); ta.focus(); tip('MoM draft ready','Check each section and fill in the next steps before sending.'); return; }
  else if (act==='mom-ai'){ const m = db.meetings.find(x=>x.id===a.dataset.id), f = a.closest('form'), ta = f.querySelector('textarea[name=txt]');
    if (!momNotes(m, f).length){ tip('Nothing to work from', 'Write a few points in the diary or the MoM box first.'); return; }
    a.disabled = true; a.textContent = 'Writing…';
    aiAsk(aiPromptMoM(m, f) + '\n\nReply with only the minutes as plain text. Do not use Markdown symbols such as ** or #.')
      .then(t=>{ ta.value = t; ta.dispatchEvent(new Event('input',{bubbles:true})); tip('AI draft ready', 'Check it carefully and correct anything before sending.'); })
      .catch(e=>tip('AI could not answer', e.message)).finally(()=>{ a.disabled = false; a.textContent = 'Write MoM with AI'; }); return; }
  else if (act==='prep-ai'){ const m = db.meetings.find(x=>x.id===a.dataset.id), out = a.parentElement.querySelector('.ai-out');
    a.disabled = true; a.textContent = 'Preparing…';
    aiAsk(aiPromptPrep(m) + '\n\nUse short plain-text lists. Do not use Markdown symbols such as ** or #.')
      .then(t=>{ out.textContent = t; out.hidden = false; }).catch(e=>tip('AI could not answer', e.message)).finally(()=>{ a.disabled = false; a.textContent = 'Prepare with AI'; }); return; }
  else if (act==='ai-summary'){ const out = document.getElementById('aiSum'); a.disabled = true; a.textContent = 'Summarising…';
    aiAsk(summaryPrompt()).then(t=>{ out.textContent = t; out.hidden = false; }).catch(e=>tip('AI could not answer', e.message)).finally(()=>{ a.disabled = false; a.textContent = 'Summarise with AI'; }); return; }
  else if (act==='forgot'){ forgotPassword(); return; }
  else if (act==='close-start'){ if (now().mins < toMins(CONFIG.closureOpen) && !confirm(`It's before ${CONFIG.closureOpen}. Are you finishing your work for today?`)) return; ui.closing = true; render(); setTimeout(()=>document.getElementById('closureCard')?.scrollIntoView({behavior:'smooth'}), 50); return; }
  else if (act==='close-cancel'){ ui.closing = false; }
  else if (act==='va-start'){ voiceAssign(); return; }
  else if (act==='va-stop'){ try{ speechSynthesis.cancel(); }catch(_){} return; }
  else if (act==='va-ok'){ confirmVoiceTask(); return; }
  else if (act==='va-cancel'){ setVA(null); try{ speechSynthesis.cancel(); }catch(_){} return; }
  else if (act==='mk-all'){ const ids = USERS.filter(u=>u.id!==ui.user && LOGINS && LOGINS[u.id] && LOGINS[u.id].emailOk && !LOGINS[u.id].hasLogin).map(u=>u.id); loginAction('create', ids, a); return; }
  else if (act==='mk-login'){ loginAction('create', [a.dataset.id], a); return; }
  else if (act==='reset-fresh'){ const ids = USERS.filter(u=>u.id!==ui.user && LOGINS && LOGINS[u.id] && LOGINS[u.id].hasLogin && !LOGINS[u.id].signedIn && u.phone).map(u=>u.id);
    if (!ids.length || !confirm(`Reset the first password of ${ids.length} people who have never logged in? Each becomes their mobile number (digits only).`)) return; loginAction('reset-bulk', ids, a); return; }
  else if (act==='reset-login'){ loginAction('reset', [a.dataset.id], a); return; }
  else if (act==='copy-logins'){ const t = document.getElementById('loginText').value; copyText(t).then(ok=>tip(ok?'Copied':'Copy failed', ok?'Paste it somewhere safe, then send each person their own password.':'Select the passwords and copy them by hand.')); return; }
  else if (act==='clear-logins'){ LOGIN_RESULTS = []; }
  else if (act==='account'){ ui.view = 'account'; }
  else if (act==='dclk'){ const el = a.closest('.clk'), d = +a.dataset.d, h = +el.dataset.h, m = +el.dataset.m;
    if (a.dataset.f==='h') clkSet(el, (h + d + 24) % 24, m); else { let nm = Math.round(m/CLK_STEP)*CLK_STEP + d*CLK_STEP; clkSet(el, h + Math.floor(nm/60), ((nm%60)+60)%60); } return; }
  else if (act==='clk-ap'){ const el = a.closest('.clk'), h = +el.dataset.h; clkSet(el, a.dataset.ap==='pm' ? (h%12)+12 : h%12, +el.dataset.m); return; }
  else if (act==='mgeo'){ captureMeetingGeo(a.dataset.id, false, a); return; }
  else if (act==='mapprove'){ decideMeeting(a.dataset.id,'approved'); return; }
  else if (act==='msendback'){ decideMeeting(a.dataset.id,'returned'); return; }
  else if (act==='perm'){ try{ Notification.requestPermission().then(()=>render()); }catch(_){ } return; }
  else if (act==='logout'){ doLogout(a); return; }
  else if (act==='loc-x'){ closeLocModal(); return; }
  else if (act==='loc-retry'){ a.disabled = true; a.textContent = 'Getting location…'; if (LOCCTX==='in') doLogin(); else doLogout(document.querySelector('#whoBox [data-act=logout]')); return; }
  save(); render();
});

document.addEventListener('input', e=>{
  const row = e.target.closest('.crow'); if (!row || !row.querySelector('.pn')) return;
  const r = row.querySelector('.pr'), num = row.querySelector('.pn');
  if (e.target===r) num.value = r.value;
  if (e.target===num) r.value = Math.max(0, Math.min(100, +num.value||0));
  row.querySelector('.just').hidden = (+num.value) >= 100;
  const w = words(row.querySelector('.jt').value), wc = row.querySelector('.wc');
  wc.querySelector('.wcn').textContent = w; wc.classList.toggle('ok', w>=CONFIG.minWords);
});

document.addEventListener('input', e=>{
  if (e.target.id!=='dSearch') return;
  const q = e.target.value.trim().toLowerCase();
  document.querySelectorAll('.prow').forEach(r=>{ r.hidden = q && !r.dataset.hay.includes(q); });
  document.querySelectorAll('.team-h').forEach(hd=>{ let el=hd.nextElementSibling, any=false; while(el && el.classList.contains('prow')){ if(!el.hidden) any=true; el=el.nextElementSibling; } hd.hidden=!any; });
});

document.addEventListener('change', e=>{ if (e.target.classList && e.target.classList.contains('tf-more')){ addFilesToTask(e.target.dataset.id, [...e.target.files]); e.target.value=''; return; } if (e.target.id==='camShoot' || e.target.id==='camPick'){ camFile(e.target.files[0]); return; } if (e.target.classList && e.target.classList.contains('pf-in')){ if (e.target.files.length) uploadFiles(e.target.dataset.id, e.target.files); e.target.value=''; return; } });
document.addEventListener('change', e=>{
  if (e.target.name==='oc'){ const pp = e.target.closest('form').querySelector('.pp'); if (pp) pp.hidden = e.target.value!=='postponed'; return; }
  const id = e.target.id;
  if (id==='userSel'){ ui.user = e.target.value; ui.authed = true; ui.view = tabsFor(ui.user)[0][0]; }
  else if (id==='revDate' && e.target.value){ ui.reviewDate = e.target.value; }
  else if (id==='dDate' && e.target.value){ (ui.dash||(ui.dash={team:'all',status:'all'})).date = e.target.value; }
  else if (id==='dTeam'){ ui.dash.team = e.target.value; }
  else if (id==='dStatus'){ ui.dash.status = e.target.value; }
  else return;
  ui.editing = null; save(); render();
});

/* System clock: windows open/lock on their own. Re-render only when a window changes so typing isn't lost. */
setInterval(()=>{
  const changed = runReminders();
  if (changed) save();
  if (ui.authed){ autoMeetingGeo(); retryPendingScores(); retryFailedBriefs(); }
  if (sigNow() !== lastSig || changed || pendingRender) safeRender();
  else updateClock();
  flushFresh();
}, 15000);

async function boot(){
  const cfg = window.PORTAL_CONFIG || {};
  if (!window.supabase || !cfg.SUPABASE_URL || /YOUR-/.test(cfg.SUPABASE_URL)){ render(); return; }
  sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
  sb.auth.onAuthStateChange((ev)=>{ if (ev==='PASSWORD_RECOVERY'){ ui.recovery = true; ui.authed = false; render(); } if (ev==='SIGNED_OUT'){ ui.authed = false; render(); } });
  const { data } = await sb.auth.getSession();
  if (data && data.session && !/type=recovery/.test(location.hash)) await afterLogin(); else render();
}
boot();
</script>
