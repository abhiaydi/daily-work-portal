<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Work Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky steel app bar (brand, user, tabs) over a single column of cards, max 1000px.
   Steel blue drives actions; copper marks the brand and the current position in the day. */
:root{
  --bg:#ffffff; --card:#f6f6f6; --soft:#ffffff; --ink:#1d1d1d; --muted:#686868; --line:#e1e1e1;
  --bar:#0d2a63; --bar-2:rgba(255,255,255,.12); --bar-ink:#ffffff; --bar-muted:rgba(255,255,255,.74);
  --accent:#1a5ed4; --accent-hover:#154db0; --accent-ink:#ffffff; --accent-soft:#e7effc;
  --brand:#f15928; --brand-soft:#fdebe3;
  --imp:#b4400a; --imp-bg:#fff0e6; --mod:#855700; --mod-bg:#fcf2d6; --daily:#0d6b64; --daily-bg:#e0f3f0;
  --emg:#c42b1c; --emg-bg:#fde8e6; --ok:#17733c; --ok-bg:#e3f3e9; --lock:#4b4b4b; --lock-bg:#ececec;
  --asg:#1a5ed4; --asg-bg:#e7effc;
  --demo-bg:#fff9e8; --demo-line:#e3cb80;
  --f-display:"Uncut Sans","Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Uncut Sans","Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"Uncut Sans","Hanken Grotesk",system-ui,sans-serif;
  --r:22px; --r-s:14px;
  --shadow:none;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b0d10; --card:#15181d; --soft:#0f1216; --ink:#f2f2f2; --muted:#a3a7ae; --line:#2a2f37;
    --bar:#0a1a3d; --bar-2:rgba(255,255,255,.1); --bar-ink:#ffffff; --bar-muted:rgba(255,255,255,.7);
    --accent:#6d9cf5; --accent-hover:#8db2f7; --accent-ink:#0b0d10; --accent-soft:#16233b;
    --brand:#ff7a4d; --brand-soft:#3a2117;
    --imp:#ff9d62; --imp-bg:#3a2216; --mod:#efc35c; --mod-bg:#342a12; --daily:#56d2c2; --daily-bg:#12322f;
    --emg:#ff8a80; --emg-bg:#3b1816; --ok:#62d493; --ok-bg:#15301f; --lock:#b8bcc3; --lock-bg:#23272e;
    --asg:#8db2f7; --asg-bg:#16233b;
    --demo-bg:#2a2614; --demo-line:#5c5124;
    --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --bg:#0b0d10; --card:#15181d; --soft:#0f1216; --ink:#f2f2f2; --muted:#a3a7ae; --line:#2a2f37;
    --bar:#0a1a3d; --bar-2:rgba(255,255,255,.1); --bar-ink:#ffffff; --bar-muted:rgba(255,255,255,.7);
    --accent:#6d9cf5; --accent-hover:#8db2f7; --accent-ink:#0b0d10; --accent-soft:#16233b;
    --brand:#ff7a4d; --brand-soft:#3a2117;
    --imp:#ff9d62; --imp-bg:#3a2216; --mod:#efc35c; --mod-bg:#342a12; --daily:#56d2c2; --daily-bg:#12322f;
    --emg:#ff8a80; --emg-bg:#3b1816; --ok:#62d493; --ok-bg:#15301f; --lock:#b8bcc3; --lock-bg:#23272e;
    --asg:#8db2f7; --asg-bg:#16233b;
    --demo-bg:#2a2614; --demo-line:#5c5124;
    --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body)}
.wrap{max-width:1000px;margin:0 auto;padding-block:16px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
h1,h2{font-family:var(--f-display);letter-spacing:.01em;text-wrap:balance}
h1{font-size:22px;font-weight:700;margin:0;line-height:1.1}
h2{font-size:20px;font-weight:600;margin:0;line-height:1.2}
h3.sub{font:600 12px var(--f-body);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:20px 0 8px}
a{color:var(--accent)}

/* prototype bars */
.demo,.trial{border-radius:var(--r-s);padding:10px 12px;margin-bottom:12px;font-size:13px}
.demo{background:var(--demo-bg);border:1px dashed var(--demo-line)}
.trial{background:var(--emg-bg);border:1.5px solid var(--emg)}
.demo .row,.trial .row{gap:8px;align-items:center}
.demo b,.trial b.t{font-size:11px;text-transform:uppercase;letter-spacing:.07em}
.trial b.t{color:var(--emg)}
.demo input,.demo select,.trial input,.trial select{padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);max-width:100%}
.trial label{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap;max-width:100%}
.trial details{margin-top:8px}.trial summary{cursor:pointer;font-weight:600;color:var(--ink)}
.trial ol{margin:6px 0 0;padding-left:20px;color:var(--ink)}
.trial li{margin:3px 0}
.demo .hint{margin-top:6px}
.demo .btn.sm,.trial .btn.sm{min-height:32px}

/* app bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;align-items:center;
  background:var(--bar);color:var(--bar-ink);border-radius:var(--r);padding:12px 14px 10px;margin-bottom:16px;box-shadow:0 6px 20px rgba(10,15,20,.18)}
.top>.row{display:contents}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{flex:none;width:38px;height:38px;border-radius:10px;background:var(--brand);color:#fff;display:grid;place-items:center;font:700 16px var(--f-display);letter-spacing:.04em}
.clock{color:var(--bar-muted);font:500 12.5px var(--f-mono);font-variant-numeric:tabular-nums;margin-top:2px}
.top .who{grid-column:2;grid-row:1;justify-self:end}
.top .tabs{grid-column:1/-1}
.who{display:flex;align-items:center;gap:8px;font-size:14px;min-width:0;max-width:100%}
.who select{max-width:100%;min-width:0}
.whoname{font-size:14px;line-height:1.2;text-align:right}.whoname small{color:var(--bar-muted)}
.top .btn.ghost{background:transparent;color:var(--bar-ink);border-color:rgba(255,255,255,.22)}
.top .btn.ghost:hover{background:rgba(255,255,255,.08)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;background:var(--bar-2);border-radius:var(--r-s);padding:4px;max-width:100%}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:0;background:none;padding:8px 14px;border-radius:8px;cursor:pointer;color:var(--bar-muted);font-weight:500;white-space:nowrap}
.tabs button:hover{color:var(--bar-ink)}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:inset 0 -2px 0 var(--brand)}
.bell{display:inline-flex;align-items:center;gap:6px;position:relative}
.bell .cnt{background:var(--emg);color:#fff;border-radius:99px;font-size:11px;font-weight:700;padding:0 6px;line-height:18px}
.sel{padding:8px 10px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--card)}

/* day timeline */
.tl{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-bottom:16px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.st{padding:12px 14px;display:flex;flex-direction:column;position:relative;border-right:1px solid var(--line)}
.st:last-child{border-right:0}
.st b{font:600 16px var(--f-display)}.st span{font:500 12px var(--f-mono);color:var(--muted)}
.st.on{background:var(--brand-soft)}
.st.on::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:var(--brand)}
.st.on b::after{content:" · now";color:var(--brand);font-weight:600}
.st.done{opacity:.55}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px;box-shadow:var(--shadow);min-width:0}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:8px 12px;margin-bottom:12px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 10px;border-radius:99px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.open{background:var(--ok-bg);color:var(--ok)}
.pill.locked{background:var(--lock-bg);color:var(--lock)}
.pill.soon{background:var(--mod-bg);color:var(--mod)}
.pill.miss{background:var(--emg-bg);color:var(--emg)}
.note{background:var(--soft);border:1px solid var(--line);border-radius:var(--r-s);padding:11px 13px;color:var(--muted);font-size:14px;display:flex;gap:8px;align-items:center}
.note svg{flex:none}
.note.bad{background:var(--emg-bg);color:var(--emg);border-color:transparent}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.gantt{margin:8px 0 12px;font-size:12px}
.g-row{display:grid;grid-template-columns:minmax(90px,30%) 1fr;gap:8px;align-items:center;padding:4px 0;border-bottom:1px dashed var(--line)}
.g-lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g-trk{position:relative;height:18px;background:var(--lock-bg);border-radius:6px}
.g-bar{position:absolute;top:0;bottom:0;border-radius:6px;background:var(--accent-soft);border:1px solid var(--accent);overflow:hidden;box-sizing:border-box}
.g-bar i{display:block;height:100%;background:var(--accent)}
.g-bar.late{border-color:var(--emg)}.g-bar.late i{background:var(--emg)}.g-bar.done{border-color:var(--ok)}.g-bar.done i{background:var(--ok)}
.g-today{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--brand)}
.g-axis{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin:4px 0 0 calc(30% + 8px)}.g-tl{color:var(--brand)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:99px;background:var(--accent-soft);color:var(--ink);font-size:13px}
.chip button{border:0;background:none;cursor:pointer;color:var(--muted);font-size:16px;line-height:1;padding:0 0 0 4px}
.chip small{color:var(--muted)}
.pchat{max-height:440px;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:6px 2px;margin-bottom:10px}
.msg{max-width:85%;padding:8px 12px;border-radius:12px;background:var(--soft);border:1px solid var(--line);font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--accent-soft);border-color:transparent}
.msg.ai{border-color:var(--accent);border-left-width:3px}
.msg small{display:block;color:var(--muted);font-size:11px;margin-bottom:2px;white-space:normal}
.msg.sys{align-self:center;background:none;border:0;color:var(--muted);font-size:12px;padding:2px}
.fchip{margin:6px 6px 0 0;display:inline-flex;gap:4px;align-items:center;white-space:normal;text-align:left}
.ffold{margin:14px 0 4px;font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.frow{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:8px 0 8px 24px;border-top:1px solid var(--line);flex-wrap:wrap}
.frow .fn{min-width:0;flex:1 1 220px;overflow-wrap:anywhere}
.upl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px;cursor:pointer}
.upl input{position:absolute;width:1px;height:1px;opacity:0}
.upl input:focus-visible + .btn{outline:2px solid var(--brand);outline-offset:2px}
.tblwrap{overflow-x:auto;max-width:100%}
table.mst{width:100%;border-collapse:collapse;font-size:13px}
table.mst th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;padding:6px 8px;border-bottom:1px solid var(--line)}
table.mst td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
table.mst tr.late td:first-child{color:var(--emg)}
table.mst .pn{width:64px}
.sum-h{cursor:pointer;list-style:revert}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.b.proj{background:var(--accent-soft);color:var(--accent)}
.ai-sum{border:1px solid var(--accent);border-left-width:4px;border-radius:10px;padding:10px 12px;margin:0 0 12px;background:var(--accent-soft)}
.ai-sum p{margin:4px 0 6px;white-space:pre-wrap}
.ai-sum.sm{margin:0 0 10px;padding:8px 10px}.ai-sum.sm p{margin:2px 0 0;font-size:14px}
.ai-sum.pend{border-color:var(--line);background:var(--card);display:flex;flex-direction:column;gap:2px}.ai-sum.pend span{color:var(--muted);font-size:13px}
.ai-sum-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.ai-pct{font-weight:700;color:var(--accent);font-size:15px}
.psel{display:inline-flex;gap:2px;padding:3px;border-radius:999px;background:var(--card);border:1px solid var(--line)}
.psel button{border:0;background:none;padding:6px 12px;border-radius:999px;cursor:pointer;font:500 14px var(--f-body);color:var(--muted)}
.psel button.on{background:var(--accent);color:var(--accent-ink)}
.dash-score{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.ring{--v:0;width:120px;height:120px;border-radius:50%;flex:none;display:grid;place-content:center;text-align:center;
  background:radial-gradient(closest-side,var(--bg) 78%,transparent 79%),conic-gradient(var(--accent) calc(var(--v)*1%),var(--lock-bg) 0)}
.ring b{font:700 34px var(--f-display);line-height:1}.ring span{font-size:12px;color:var(--muted)}
.dash-parts{flex:1 1 260px;min-width:0}
.dgrp{border-top:1px solid var(--line);padding:8px 0}
.tfiles{margin:6px 0}.tfile{margin:4px 0;font-size:13px}
.linkbtn{border:0;background:none;color:var(--accent);cursor:pointer;padding:0;font:inherit;display:inline-flex;align-items:center;gap:4px;text-align:left}
.linkbtn:hover{text-decoration:underline}
.daychip{cursor:pointer;border:1px solid var(--line)}.daychip.on{background:var(--accent);color:var(--accent-ink)}
.linkbtn.tf-del{color:var(--emg);font-size:12px;margin-left:8px}.tf-add{font-size:13px;margin-top:6px}
.tbrief{margin:3px 0 0 18px;padding:6px 9px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 8px 8px 0;color:var(--ink)}
.feas{margin-top:8px;padding:9px 11px;border:1px solid var(--accent);border-radius:10px;background:var(--accent-soft);font-size:14px}
.feas.bad{border-color:var(--emg);background:var(--emg-bg)}
.b.ok-b{background:#dcfce7;color:#166534}
.bad-card{border:1px solid var(--emg)}
.ondot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#16a34a;box-shadow:0 0 0 3px rgba(22,163,74,.22);margin-right:7px;vertical-align:middle;animation:onp 2s infinite}
@keyframes onp{0%,100%{box-shadow:0 0 0 3px rgba(22,163,74,.22)}50%{box-shadow:0 0 0 6px rgba(22,163,74,.08)}}
.pill.online{background:#dcfce7;color:#166534;font-weight:600}.pill.online::before{background:#16a34a}
.sum .on b{color:#16a34a}
tr.row-on td{background:rgba(22,163,74,.06)}.dgrp summary{cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:1000;padding:16px}
.modal-box{background:var(--bg);color:var(--ink);border-radius:16px;padding:20px;width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;box-sizing:border-box}
.modal-box h2{margin-top:0}
.cam-ch{display:grid;gap:10px;margin:14px 0}
.cam-big{justify-content:center;padding:16px;font-size:16px;gap:10px;display:flex;align-items:center}
#camVid,.cam-prev,.lb img{width:100%;max-height:55vh;object-fit:contain;border-radius:10px;background:#000;display:block;margin:8px 0}
.lb img{min-height:120px}
.btn.sm.cam{background:var(--brand);color:#fff;border-color:var(--brand);display:inline-flex;align-items:center;justify-content:center}
.btn.sm.cam:hover{filter:brightness(1.08)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
.ph{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card);min-width:0}
.ph[hidden]{display:none}
.ph img{width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--lock-bg);display:block}
.ph-n{padding:6px 8px 0;font-weight:600;font-size:13px;overflow-wrap:anywhere}
.ph-m{padding:0 8px 8px;font-size:11px;color:var(--muted)}
.ph:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
#aiFab{position:fixed;right:18px;bottom:18px;z-index:900;display:inline-flex;align-items:center;gap:8px;padding:12px 18px 12px 14px;border:0;border-radius:99px;
  background:linear-gradient(135deg,var(--accent),#6b3fd4);color:#fff;font:600 15px var(--f-body);cursor:pointer;box-shadow:0 8px 24px rgba(26,94,212,.35)}
#aiFab[hidden]{display:none}
.mch-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px}.mch{width:100%;border-collapse:collapse;font-size:14px;min-width:720px}
.mch th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}.mch td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.mch td small{color:var(--muted)}.mch .nw{white-space:nowrap}
.parts{margin:8px 0;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg)}.parts-h{display:flex;gap:8px;align-items:baseline;margin-bottom:4px;font-size:13px}
.part{display:flex;gap:10px;align-items:flex-start;padding:6px 0;border-top:1px dashed var(--line);font-size:13px}.part:first-of-type{border-top:0}
.part .pn{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--soft,#f3f4f6);color:var(--muted)}
.part.cur .pn{background:#1a5ed4;color:#fff}.part.done .pn{background:#0f7a3d;color:#fff}.part.late .pn{background:#b42318;color:#fff}.part .pb{flex:1;min-width:0}.part small{color:var(--muted)}
.pd-form{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;align-items:center}.pd-form .pd-note{flex:1 1 100%;min-width:180px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:7px 10px;font:inherit}.pd-form .stt{flex:1;min-width:180px}.pd-form .err{flex-basis:100%}
.parts-ed .pt-tog{display:flex!important;flex-direction:row!important;justify-content:flex-start!important;gap:8px;align-items:center;font-weight:500;cursor:pointer;margin:0}.parts-ed .pt-tog input{width:18px!important;height:18px!important;min-height:0!important;flex:none;margin:0;padding:0;accent-color:#1a5ed4}.pt-box{margin-top:6px}.pt-row{display:flex;gap:8px;align-items:center;margin-bottom:6px}.pt-row .pt-name,.pt-row .stt{flex:1;min-width:0}.pt-row .pt-days{width:70px}
.tt-task{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;background:var(--bg)}.tt-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.tt-p{font-weight:700;font-size:13px;padding:2px 8px;border-radius:99px;background:var(--soft,#f3f4f6)}.tt-p.ok{background:#e9f7ee;color:#0f7a3d}
.tt-note{font-size:13px;margin-top:6px;padding:6px 10px;border-radius:8px;background:var(--soft,#f3f4f6)}
.tcm{margin-top:8px;border-top:1px dashed var(--line);padding-top:6px}.tcm-i{font-size:13px;margin:4px 0;padding:6px 10px;border-radius:10px;background:#eef4ff;max-width:92%}.tcm-i.me{background:#f1f5f0;margin-left:auto}
.tcm-i small{color:var(--muted)}.tcm-form{display:flex;gap:6px;margin-top:6px;align-items:center}.tcm-form .stt{flex:1;min-width:0}.tcm-form .tcm-in{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;background:var(--bg)}
.tc-row{display:flex;flex-wrap:wrap;gap:4px 18px;align-items:center}.tc-btn{color:#0f7a3d;font-weight:600}
.tc-st{margin-top:6px;font-size:13px;padding:6px 10px;border-radius:8px;background:#fff7e6;border:1px solid #f3d9a4}.tc-st.ok{background:#e9f7ee;border-color:#b7e2c6}.tc-st.pend{background:var(--soft,#f3f4f6);border-color:var(--line)}
.clf-list{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 6px}.clf-chip{display:inline-flex;align-items:center;gap:6px;background:var(--soft,#f3f4f6);border:1px solid var(--line);border-radius:99px;padding:4px 6px 4px 10px;font-size:13px;max-width:100%}
.clf-chip small{color:var(--muted)}.clf-chip .linkbtn{font-size:16px;line-height:1;padding:0 4px}.clf-add{align-self:flex-start;cursor:pointer}
.plc{position:relative;display:block}.plc-list{position:absolute;left:0;right:0;top:100%;z-index:60;background:var(--bg);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.14);margin-top:4px;max-height:280px;overflow:auto}
.plc-i{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 12px;cursor:pointer;font:inherit;color:inherit}.plc-i:hover,.plc-i:focus{background:var(--soft,#f3f4f6);outline:none}.plc-i small{display:block;color:var(--muted);font-size:12px}
.plc-st{display:block;padding:6px 12px;font-size:11px;color:var(--muted)}
.bot-av{width:40px;height:40px;image-rendering:auto;background:#fff;border-radius:50%;object-fit:cover;flex:none;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.25);vertical-align:middle}
.ai-h .bot-av{width:44px;height:44px}.ai-h b{display:inline-flex;align-items:center;gap:8px;font-size:17px}.bot-av.sm{width:22px;height:22px;border-width:1px;margin-right:5px;vertical-align:-6px}
#aiFab{padding:6px 18px 6px 6px}
#aiFab.wake::after{content:'';position:absolute;top:4px;right:6px;width:9px;height:9px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 2px #fff}
#aiFab{position:fixed}
.ai-h{flex-wrap:wrap}
.ai-h .bot-ic{font-size:18px}.bot-sub{font-weight:500;color:var(--muted);font-size:12px;margin-left:4px}
#chatFab{position:fixed;right:18px;bottom:76px;z-index:900;display:inline-flex;align-items:center;gap:8px;padding:11px 16px 11px 13px;border:1px solid var(--line);border-radius:99px;
  background:var(--bg);color:var(--ink);font:600 15px var(--f-body);cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.14)}
#chatFab svg{color:var(--accent)}#chatFab[hidden]{display:none}
#chatFab .cnt,.ch-rooms .cnt{background:var(--emg);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px;line-height:16px}
#chatPanel{position:fixed;right:18px;bottom:18px;z-index:950;width:min(420px,calc(100vw - 36px));height:min(640px,calc(100vh - 36px));display:flex;flex-direction:column;
  background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:18px;box-shadow:0 16px 48px rgba(0,0,0,.25);overflow:hidden}
.ch-rooms{display:flex;gap:6px;overflow-x:auto;padding:8px 10px;border-bottom:1px solid var(--line);scrollbar-width:thin}
.ch-rooms button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:5px 12px;font:500 13px var(--f-body);cursor:pointer;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch-rooms button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ch-f{flex-wrap:wrap}.ch-f textarea{flex:1;min-width:0;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;resize:none;max-height:120px}
.ch-quick{flex-basis:100%;justify-content:center}
.msg.tagme{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
b.mtn{color:var(--accent)}b.mtn.me{background:var(--brand-soft);color:var(--brand);border-radius:4px;padding:0 3px}
.mt-list{border-top:1px solid var(--line);max-height:220px;overflow:auto;background:var(--card)}
.mt-list button{display:flex;flex-direction:column;align-items:flex-start;width:100%;border:0;background:none;padding:7px 12px;cursor:pointer;color:var(--ink);text-align:left}
.mt-list button small{color:var(--muted)}.mt-list button.on,.mt-list button:hover{background:var(--accent-soft)}
#aiFab:hover{filter:brightness(1.07)}
#aiPanel{position:fixed;right:18px;bottom:18px;z-index:950;width:min(420px,calc(100vw - 36px));height:min(620px,calc(100vh - 36px));display:flex;flex-direction:column;
  background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:18px;box-shadow:0 16px 48px rgba(0,0,0,.25);overflow:hidden}
.ai-h{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--card)}
.ai-h b{flex:1;display:flex;align-items:center;gap:6px;font-size:15px}.ai-h b svg{color:var(--accent);width:18px;height:18px}
.ai-v{display:inline-flex;align-items:center;gap:5px}
.ai-msgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:12px}
.ai-hello{color:var(--muted);font-size:14px}.ai-hello b{color:var(--ink)}.ai-hello ul{margin:6px 0;padding-left:18px}
.ai-act{margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:13px;white-space:normal}
.ai-act .t{font-weight:600;font-size:14px}
.ai-a1+.ai-a1{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.ai-st{margin-top:6px;font-size:12px;color:var(--muted)}.ai-st.ok{color:var(--ok);font-weight:600}
.ai-f{display:flex;gap:6px;align-items:center;padding:10px;border-top:1px solid var(--line)}
.ai-f input{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
.ai-f .ai-mic{position:static;flex:none}
@media (max-width:560px){ #chatPanel{right:0;left:0;bottom:0;width:100%;height:85vh;border-radius:18px 18px 0 0} #chatFab{right:12px;bottom:68px} #aiPanel{right:0;left:0;bottom:0;width:100%;height:85vh;border-radius:18px 18px 0 0} #aiFab{right:12px;bottom:12px} }
.ok-msg{background:var(--ok-bg);color:var(--ok);border-radius:var(--r-s);padding:10px 12px;font-size:14px;margin-bottom:12px;font-weight:600}
.hint{font-size:12.5px;color:var(--muted);margin:6px 0 0}

/* forms */
.tform{border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--soft);margin-bottom:8px}
.row{display:flex;flex-wrap:wrap;gap:12px}
.row.end{justify-content:flex-end;margin-top:10px}
.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:500;color:var(--muted);margin:0 0 12px;border:0;padding:0;min-width:0}
.f.grow{flex:1;min-width:200px}
.f input,.f textarea,.f select{padding:10px 12px;min-height:44px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--card);color:var(--ink);width:100%;font-weight:400}
.f input:focus,.f textarea:focus,.f select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.f textarea{resize:vertical;min-height:72px}
.f.days{width:150px}
legend{padding:0;margin-bottom:5px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg label{cursor:pointer;position:relative}
.seg input,.f .seg input{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px;min-height:0;padding:0;border:0}
.seg span{display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--card);color:var(--ink);font-size:14px;font-weight:500}
.seg input:checked+span{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.seg input:focus-visible+span{outline:2px solid var(--brand);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:0 18px;border-radius:var(--r-s);cursor:pointer;font-weight:600;transition:background .15s}
.btn:hover{background:var(--accent-hover)}
.btn.ghost{background:var(--card);color:var(--ink);border-color:var(--line);font-weight:500}
.btn.ghost:hover{background:var(--soft)}
.btn.sm{min-height:34px;padding:0 12px;font-size:13px}
.btn.danger{color:var(--emg)}
.btn[disabled]{opacity:.6;cursor:wait}
.err{color:var(--emg);font-size:13px;margin-top:4px}
.req{color:var(--emg);font-weight:400}

/* tasks */
.task{border:1px solid var(--line);border-radius:var(--r-s);padding:12px 14px;margin-bottom:8px;background:var(--card)}
.task-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.task-title{font-weight:600}
.task-det{color:var(--muted);font-size:14px;margin-top:2px;white-space:pre-wrap}
.acts{display:flex;gap:6px;flex-shrink:0}
.lockic{color:var(--lock);flex-shrink:0;display:inline-flex}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.b{font-size:12px;padding:2px 8px;border-radius:6px;background:var(--lock-bg);color:var(--lock);white-space:nowrap}
.b.p-Important{background:var(--imp-bg);color:var(--imp);font-weight:600}
.b.p-Moderate{background:var(--mod-bg);color:var(--mod);font-weight:600}
.b.p-Daily{background:var(--daily-bg);color:var(--daily);font-weight:600}
.b.p-Emergency,.b.emg{background:var(--emg-bg);color:var(--emg);font-weight:600}
.b.asg{background:var(--asg-bg);color:var(--asg);font-weight:600}
.bar{margin-top:8px;font-size:12px;color:var(--muted)}
.bar .trk{height:6px;background:var(--lock-bg);border-radius:99px;overflow:hidden;margin-top:4px}
.bar .fil{height:100%;background:var(--accent)}
.bar .fil.full{background:var(--ok)}

/* closure rows */
.crow{border:1px solid var(--line);border-radius:var(--r-s);padding:14px;margin-bottom:10px;background:var(--card);min-width:0}
.crow.bad{border-color:var(--emg);box-shadow:0 0 0 3px var(--emg-bg)}
.ctitle{font-weight:600;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.prog{display:flex;align-items:center;gap:10px;margin:12px 0 4px}
.prog input[type=range]{flex:1;accent-color:var(--accent);min-width:0}
.prog input[type=number]{width:76px;min-height:40px;padding:6px 8px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--card)}
.just{margin-top:8px}
.wc{font-size:12px;color:var(--emg);text-align:right;margin-top:-8px}
.wc.ok{color:var(--ok)}

/* reports */
.rep{width:100%;border-collapse:collapse;font-size:14px}
.rep th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line);padding:8px}
.rep td{border-bottom:1px solid var(--line);padding:10px 8px;vertical-align:top}
.rep .pct,.pct{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.pct.full{color:var(--ok)}.pct.part{color:var(--imp)}
.sum{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 14px}
.sum div{background:var(--soft);border:1px solid var(--line);border-radius:var(--r-s);padding:7px 12px;font-size:13px;color:var(--muted)}
.sum b{color:var(--ink);font:700 18px var(--f-display);margin-right:4px}
.review{margin-top:12px;border-left:3px solid var(--brand);background:var(--soft);padding:10px 12px;border-radius:0 var(--r-s) var(--r-s) 0}
.review .meta{font-size:12px;color:var(--muted)}
.review p{margin:4px 0 0;white-space:pre-wrap}
.tscroll{overflow-x:auto}

/* dashboard */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.tile{background:var(--soft);border:1px solid var(--line);border-radius:var(--r-s);padding:12px 14px;min-width:0}
.tile .v{font:700 28px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.tile .l{font-size:12px;color:var(--muted)}
.tile.warn{background:var(--emg-bg);border-color:transparent}
.tile.warn .v{color:var(--emg)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.filters input,.filters select{min-height:40px;padding:6px 10px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--card)}
.filters input[type=search]{flex:1;min-width:160px}
.filters select,.filters label{max-width:100%;min-width:0}
.att{list-style:none;margin:0;padding:0}
.att li{display:block;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.att li:last-child{border-bottom:0}
.team-h{font:600 12px var(--f-body);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:18px 0 8px}
.prow{border:1px solid var(--line);border-radius:var(--r-s);margin-bottom:6px;background:var(--card);overflow:hidden;max-width:100%}
.prow>summary,.phead{display:grid;grid-template-columns:minmax(180px,2fr) 170px repeat(4,minmax(60px,1fr)) 24px;gap:8px;align-items:center}
.prow>summary{list-style:none;cursor:pointer;padding:10px 14px}
.prow>summary:hover{background:var(--soft)}
.prow>summary::-webkit-details-marker{display:none}
.prow>summary .chev{transition:transform .15s;color:var(--muted)}
.prow[open]>summary .chev{transform:rotate(90deg)}
.prow .nm b{display:block}.prow .nm span{font-size:12px;color:var(--muted)}
.prow .num{font-size:14px;text-align:center;font-variant-numeric:tabular-nums}.prow .num small{display:block;font-size:11px;color:var(--muted)}
.prow .body{padding:0 14px 12px;border-top:1px solid var(--line)}
.phead{padding:0 14px 6px;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.phead span:not(:first-child){text-align:center}
.mini{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
.mini td,.mini th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.mini th{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}

/* field + meetings */
.geo{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft),var(--shadow)}
.geo-btn{min-height:52px;font-size:16px;padding:0 22px;border-radius:12px}
.ci{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.ci:last-child{border-bottom:0}
.ci .tm{font:600 14px var(--f-mono);min-width:52px;font-variant-numeric:tabular-nums}
.mtg .review{margin-top:8px}
.login{max-width:460px;margin:28px auto}
.login .mark{width:48px;height:48px;font-size:20px;margin-bottom:12px}
.mark{font-size:11px!important;letter-spacing:.02em}.login .mark{width:56px!important;height:56px!important;font-size:14px!important}
.login-gate{text-align:center}
.login-gate .geo-btn{width:100%;min-height:60px;font-size:17px}
#toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:calc(16px + env(safe-area-inset-top,0px));max-width:360px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:var(--r-s);padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.2);display:flex;flex-direction:column;gap:2px;z-index:50;font-size:14px;cursor:pointer}
#toast b{color:var(--brand)} #toast small{color:var(--muted)}
#toast .x{align-self:flex-end;font-size:12px;color:var(--muted);text-decoration:underline}

/* clock-face time picker */
.clk{display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;width:100%;max-width:300px}
.clk-top{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%}
.clk-read{font:600 26px var(--f-mono);font-variant-numeric:tabular-nums;color:var(--ink)}
.clk-ap{display:flex;gap:4px}
.clk-ap button{min-height:34px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);cursor:pointer;font-weight:600;font-size:13px}
.clk-ap button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.clk-face{width:100%;max-width:240px;aspect-ratio:1;touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer}
.clk-bg{fill:var(--soft);stroke:var(--line);stroke-width:2}
.clk-tk{stroke:var(--muted);stroke-width:1;opacity:.5}
.clk-tk.big{stroke-width:2.5;opacity:.9}
.clk-n{fill:var(--ink);font:600 15px var(--f-body);text-anchor:middle;dominant-baseline:central}
.clk-hl{stroke:var(--ink);stroke-width:7;stroke-linecap:round}
.clk-ml{stroke:var(--accent);stroke-width:4;stroke-linecap:round}
.clk-hk{fill:var(--ink)} .clk-mk{fill:var(--accent)}
.hand{cursor:grab;outline:none}
.hand:focus-visible .clk-hk,.hand:focus-visible .clk-mk{stroke:var(--brand);stroke-width:4}
.clk-c{fill:var(--brand)}
.dclk{border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--card)}
.dclk-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dclk-col{display:flex;flex-direction:column;align-items:center;gap:2px}
.dclk-b{border:1px solid var(--line);background:var(--bg);color:var(--accent);border-radius:8px;width:56px;height:30px;cursor:pointer;font-size:13px}
.dclk-b:hover{background:var(--accent-soft)}
.dclk-in{width:56px;text-align:center;font:700 30px/1.1 var(--f-display);font-variant-numeric:tabular-nums;border:1px solid var(--line);border-radius:10px;padding:6px 0;background:var(--bg);color:var(--ink)}
.dclk-sep{font:700 30px var(--f-display);margin:0 -2px}
.f .dclk .dclk-in,.dclk input.dclk-in{width:64px;min-width:64px;max-width:64px;flex:none;padding:6px 0;margin:0}
.dclk-col{flex:none}.dclk-row{flex-wrap:nowrap}
.dclk-ap{display:flex;flex-direction:column;gap:4px;margin-left:6px}
.clk-row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}


/* meeting diary + login chip */
.chat{display:flex;flex-direction:column;gap:6px;max-height:280px;overflow-y:auto;padding:10px;background:var(--soft);border:1px solid var(--line);border-radius:var(--r-s);margin-bottom:8px}
.bub{align-self:flex-end;max-width:85%;background:var(--accent-soft);border:1px solid var(--line);border-radius:12px 12px 4px 12px;padding:7px 10px}
.bub p{margin:0;white-space:pre-wrap;font-size:14px}
.bub span{display:block;text-align:right;font:500 11px var(--f-mono);color:var(--muted);margin-top:2px}
.chatf{display:flex;gap:8px;align-items:flex-end}
.chatf textarea{flex:1;min-width:0;min-height:44px;max-height:140px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--card);resize:vertical}
.chatf textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.lgchip{font:600 12.5px var(--f-mono);font-variant-numeric:tabular-nums;background:rgba(255,255,255,.1);color:var(--bar-ink);border:1px solid rgba(255,255,255,.18);border-radius:99px;padding:5px 11px;white-space:nowrap}
.lgchip.late{color:#ffb4a8;border-color:rgba(255,140,120,.5)}

/* ===== Corporate style layer: white page, grey rounded panels, blue pill buttons with arrow, orange rule ===== */
body{letter-spacing:-.005em}
h1,h2{font-weight:500;letter-spacing:-.025em}
h2{font-size:25px;line-height:1.1}
h1{font-size:23px}
h3.sub,.team-h{font:500 14px var(--f-body);text-transform:none;letter-spacing:0;color:var(--ink);display:flex;align-items:center;gap:8px}
h3.sub::before,.team-h::before{content:"";flex:none;width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.card{background:var(--card);border:0;border-radius:var(--r);box-shadow:none;padding:24px}
.sec-h{padding-bottom:14px;border-bottom:1px solid var(--brand);margin-bottom:18px}
.crow,.task,.prow,.clk,.tform,.chat{background:var(--bg);border-color:var(--line)}
.crow,.task,.prow{border-radius:var(--r-s)}
.tform{border:0;border-radius:18px}
.f input,.f textarea,.f select,.chatf textarea,.filters input,.filters select,.sel,.prog input[type=number],.demo input,.demo select,.trial input,.trial select{background:var(--card);border-color:transparent;border-radius:12px}
.card .f input,.card .f textarea,.card .f select,.card .filters input,.card .filters select,.card .sel{background:var(--bg);border-color:var(--line)}
.card .crow .f input,.card .crow .f textarea,.card .crow .f select,.tform .f input,.tform .f textarea,.tform .f select,.chatf textarea{background:var(--card);border-color:transparent}

<body>
<div class="wrap">


  <div class="top">
    <div class="brand"><span class="mark" aria-hidden="true">AYDI</span>
      <div><h1 id="appTitle">Daily Work Portal</h1><div class="clock" id="clock"></div></div>
    </div>
    <div class="row" style="align-items:center">
      <div class="who" id="whoBox"></div>
      <div class="tabs" id="tabs" role="tablist"></div>
    </div>
  </div>

  <main id="main"></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>document.write('<script src="config.js?v=' + Date.now() + '"><\/script>');</script>
<script>
/* =====================================================================
   CONFIGURATION — edit here
   ===================================================================== */
const CONFIG = {
  planOpen:    '00:01',   // morning plan opens (just after midnight, so plans can be made early)
  workStart:   '09:00',   // start of the working day: late logins, whole-day meetings
  planClose:   '10:15',   // morning plan locks; additional work starts
  closureOpen: '18:00',   // normal end of the working day (closure is by button, not forced)
  minWords:    12,
  timeZone:    'Asia/Dubai'   // all windows run on UAE time, whatever the device's time zone
};

/* Closure report deadline by role (same day). */
const CLOSURE_DEADLINE = {
  'Staff':           '22:00',   // ASSUMPTION — not yet confirmed
  'Manager':         '22:00',
  'General Manager': '23:59'
};

/* STAFF LIST — loaded from the database after login (table "people"). No names are kept in this file. */
let USERS = [];
/* Roles that do not submit their own daily reports */
const NO_OWN_REPORT = ['CEO'];

const PLAN_PRI  = ['Important','Moderate','Daily Work'];
const EXTRA_PRI = ['Emergency','Important'];
const RANK = { 'Emergency':0, 'Important':1, 'Moderate':2, 'Daily Work':3 };
const DB_KEY = 'dwp_db_v3', UI_KEY = 'dwp_ui_v3';
const LOCK = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-label="Locked"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';

/* ===== Helpers ===== */
const pad = n => String(n).padStart(2,'0');
const dstr = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return dstr(d); };
const diffDays = (a,b) => Math.round((parse(b)-parse(a))/86400000);
const toMins = t => { const [h,m] = t.split(':').map(Number); return h*60+m; };
const fmtDate = s => parse(s).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short',year:'numeric'});
const fmtShort = s => parse(s).toLocaleDateString(undefined,{day:'numeric',month:'short'});
const fmtStamp = iso => new Date(iso).toLocaleString(undefined,{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit',timeZone:CONFIG.timeZone});
const esc = s => String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const words = s => (s||'').trim().split(/\s+/).filter(Boolean).length;
const uid = () => Math.random().toString(36).slice(2,10);
const getUser = id => USERS.find(u=>u.id===id) || { id, name:id, title:'', role:'', managers:[] };
const userName = id => getUser(id).name;
const reportsOf = id => USERS.filter(u=>u.managers.includes(id));
/* Indirect (dotted-line) reports: work for them, and work sent up to the GM, needs the GM's approval first */
const indirectOf = id => USERS.filter(u=>(u.dotted||[]).includes(id));
const gmIds = () => USERS.filter(u=>u.role==='General Manager').map(u=>u.id);
const isGm = id => getUser(id).role==='General Manager';
const needsGm = (me, owner) => !['CEO','General Manager'].includes(getUser(me).role) && (indirectOf(me).some(u=>u.id===owner) || isGm(owner));
const teamOf = id => { const seen = new Set(); return reportsOf(id).concat(indirectOf(id)).filter(u=>!seen.has(u.id) && seen.add(u.id)); };
const assignerChecks = (t) => t.viaGm && t.assignedBy && !isGm(t.owner) && !reportsOf(t.assignedBy).some(u=>u.id===t.owner);
const mgrNames = id => getUser(id).managers.map(userName).join(' & ') || '—';
const hasOwnReport = id => !NO_OWN_REPORT.includes(getUser(id).role);
const deadlineOf = id => CLOSURE_DEADLINE[getUser(id).role] || '22:00';

function load(key, fallback){ try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }catch(e){ return fallback; } }
function store(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }

/* ===== Shared data: Supabase database (table "records") ===== */
const COLS = ['tasks','closures','meetings','notifications','checkins','requests','projects','pchat','pfiles','photos','aisum','gchat','sys'];   // sys: server-only signals (e.g. data reset)
let db = { tasks:[], closures:{}, meetings:[], notifications:[], checkins:[], requests:[], projects:[], pchat:[], pfiles:[], photos:[], aisum:[], gchat:[], sys:[] };
let ui = load(UI_KEY, null) || { view:'staff', reviewDate:null };
ui.user = null; ui.authed = false; ui.editing = null;
let sb = null, LOCS = {}, booting = true, saveErrShown = false;
const shadow = {}; COLS.forEach(c=>{ shadow[c] = new Map(); });
const writeQ = new Map();
function itemsOf(c){ return c==='closures' ? Object.entries(db.closures) : db[c].map(x=>[x.id, x]); }
function queueWrite(key, fn){ const p = (writeQ.get(key)||Promise.resolve()).then(fn).catch(writeErr); writeQ.set(key, p); }
function writeErr(e){
  if (saveErrShown) return; saveErrShown = true; setTimeout(()=>{ saveErrShown = false; }, 15000);
  tip('Not saved', (e && e.message ? e.message+'. ' : '') + 'Check your internet connection. Your last change may not have reached the server.');
}
function syncAll(){
  if (!sb || !ui.authed) return;
  COLS.forEach(c=>{
    const seen = new Set();
    itemsOf(c).forEach(([id, val])=>{
      seen.add(id); const j = JSON.stringify(val);
      if (shadow[c].get(id) !== j){ shadow[c].set(id, j); const data = JSON.parse(j);
        queueWrite(c+'/'+id, ()=>sb.from('records').upsert({ collection:c, id, data }).then(r=>{ if (r.error) throw r.error; })); }
    });
    [...shadow[c].keys()].forEach(id=>{ if (!seen.has(id)){ shadow[c].delete(id);
      queueWrite(c+'/'+id, ()=>sb.from('records').delete().eq('collection', c).eq('id', id).then(r=>{ if (r.error) throw r.error; })); } });
  });
}
function applyRemote(c, id, data){
  if (!data){ shadow[c].delete(id); if (c==='closures') delete db.closures[id]; else db[c] = db[c].filter(x=>x.id!==id); return; }
  shadow[c].set(id, JSON.stringify(data));
  if (c==='closures') db.closures[id] = data;
  else { const i = db[c].findIndex(x=>x.id===id); if (i>=0) db[c][i] = data; else db[c].push(data); }
}
const save = () => { store(UI_KEY, { view:ui.view, reviewDate:ui.reviewDate, portal:ui.portal }); syncAll(); };

/* Current date/time from the system clock, read in UAE time. Not user-adjustable. */
const DTF = new Intl.DateTimeFormat('en-GB',{ timeZone:CONFIG.timeZone, year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', hourCycle:'h23' });
function now(){
  const p = Object.fromEntries(DTF.formatToParts(new Date()).map(x=>[x.type,x.value]));
  const h = +p.hour % 24, m = +p.minute;
  return { date:`${p.year}-${p.month}-${p.day}`, mins:h*60+m, label:pad(h)+':'+pad(m) };
}
/* Phase for a specific person (closure deadline depends on role) */
function phaseFor(m, userId){
  if (m <  toMins(CONFIG.planOpen))    return 'before';
  if (m <  toMins(CONFIG.planClose))   return 'plan';
  if (m <= toMins(deadlineOf(userId))) return 'extra';   // additional work open; the person closes their day with a button
  return 'over';
}
/* Assignment by a manager: before the plan locks (CONFIG.planClose) → their morning plan; after → additional work (until that person closes their day) */
function assignMode(m){
  if (m < toMins(CONFIG.planClose)) return 'plan';
  return 'extra';
}
const closedToday = (id, d) => !!db.closures[id+'|'+d];
/* Sales heads' closure reports also go to the CEO for a second review */
const ceoIds = () => USERS.filter(u=>u.role==='CEO').map(u=>u.id);
const needsCeoReview = id => isField(id) && !ceoIds().includes(id);
const isCeo = id => getUser(id).role==='CEO';
const ORDER = { before:0, plan:1, extra:2, closure:3, over:4 };

function activeTasks(owner, date){
  return db.tasks.filter(t => t.owner===owner && t.startDate<=date && (!t.completedOn || t.completedOn>=date))
                 .sort((a,b)=> RANK[a.priority]-RANK[b.priority] || a.startDate.localeCompare(b.startDate));
}
function prevProgress(t, date){
  const ks = Object.keys(t.log||{}).filter(k=>k<date).sort();
  return ks.length ? t.log[ks[ks.length-1]].progress : 0;
}
/* Who may edit/delete a task right now */
function canEdit(t, me, n){
  if (t.category!=='planned' || t.startDate!==n.date) return false;
  if (db.closures[t.owner+'|'+n.date]) return false;
  if (((t.log||{})[n.date]||{}).closedEarly) return false;   // closed with a note: no more edits
  if (t.viaGm) return false;
  if (t.assignedBy) return t.assignedBy===me && assignMode(n.mins)==='plan';
  return t.owner===me && phaseFor(n.mins, me)==='plan';
}

/* ===== UI pieces ===== */
const priBadge = p => `<span class="b p-${p.split(' ')[0]}">${esc(p)}</span>`;
const pill = (cls, txt) => `<span class="pill ${cls}">${txt}</span>`;
const note = (txt, lock, bad) => `<div class="note ${bad?'bad':''}">${lock?LOCK:''}<span>${txt}</span></div>`;
const bar = (v, label) => `<div class="bar">${label}: <b>${v}%</b><div class="trk"><div class="fil ${v>=100?'full':''}" style="width:${v}%"></div></div></div>`;

function timeline(ph, userId){
  const closing = ui.closing && ph==='extra';
  const steps = [
    ['plan','Morning plan',`${CONFIG.planOpen} – ${CONFIG.planClose}`, ph==='plan'],
    ['extra','Additional work',`from ${CONFIG.planClose}`, ph==='extra' && !closing],
    ['closure','Closure report',`when you finish · by ${deadlineOf(userId)}`, closing]
  ];
  const done = s => s[0]==='plan' ? ORDER[ph]>ORDER.plan : s[0]==='extra' ? (closing || ORDER[ph]>ORDER.extra) : ph==='over';
  return `<div class="tl">${steps.map(s=>`<div class="st ${s[3]?'on':''} ${!s[3]&&done(s)?'done':''}"><b>${s[1]}</b><span>${s[2]}</span></div>`).join('')}</div>`;
}

function taskCard(t, n, showOwner){
  const d = n.date, dayN = diffDays(t.startDate,d)+1, carried = t.startDate<d, overdue = d>t.dueDate;
  const editable = canEdit(t, ui.user, n);
  return `<div class="task">
    <div class="task-top">
      <div class="task-title">${showOwner?`<span class="b">${esc(userName(t.owner))}</span> `:''}${esc(t.title)}</div>
      ${editable
        ? `<div class="acts"><button class="btn sm ghost" data-act="edit" data-id="${t.id}">Edit</button><button class="btn sm ghost danger" data-act="del" data-id="${t.id}">Delete</button></div>`
        : `<span class="lockic" title="Locked">${LOCK}</span>`}
    </div>
    ${t.details?`<div class="task-det">${esc(t.details)}</div>`:''}
    ${partsHtml(t, d)}
    ${filesHtml(t)}
    <div class="badges">
      ${priBadge(t.priority)}
      <span class="b">${t.category==='extra'?'Additional work':'Planned'}</span>
      ${t.assignedBy?`<span class="b asg">Assigned by ${esc(userName(t.assignedBy))}</span>`:''}
      ${t.projectId && projById(t.projectId)?`<span class="b proj">Project: ${esc(projById(t.projectId).name)}</span>`:''}

    ${ui.tc===t.id && canCloseTask(t) ? taskCloseForm(t) : ''}

function projSelect(t){

  return `<label class="f">Project (optional)<select name="project" class="sel"><option value="">— not part of a project —</option>${ps.map(p=>`<option value="${p.id}" ${t&&t.projectId===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label>`;

/* kind: 'self' or 'assign'; mode: 'plan' or 'extra' */
function taskForm(kind, mode){
  const pri = mode==='plan' ? PLAN_PRI : EXTRA_PRI;
  let t = ui.editing ? db.tasks.find(x=>x.id===ui.editing) : null;
  if (t && (kind==='assign') !== !!t.assignedBy) t = null;
  const reps = assignableBy(ui.user);
  const label = t ? 'Save changes'
    : kind==='assign' ? (mode==='plan' ? 'Assign to their plan' : 'Assign as additional work')
    : (mode==='plan' ? 'Add to plan' : 'Add additional work');
  return `<form class="tform" data-kind="${kind}" data-mode="${mode}" novalidate>
    ${kind==='assign' ? (t ? `<div class="f">Assigned to<b style="color:var(--ink)">${esc(userName(t.owner))}</b><input type="hidden" name="target" value="${t.owner}"></div>`
      : `<div style="margin-bottom:12px">${picker('target', reps, '', 'Assign to (you can add several people)', 'Type a name or a letter, e.g. G')}<div class="chips tchips">${tgtChips()}</div><input type="hidden" name="targets" value="${(ui.tgt||[]).join(',')}"></div>`) : ''}
    <label class="f grow">Task<input name="title" value="${esc(t?.title)}" placeholder="${mode==='plan'?'What needs to be done today?':'What additional work came up?'}"></label>
    <label class="f">Details (optional)<textarea name="details" rows="2">${esc(t?.details)}</textarea></label>
    ${projSelect(t)}
    ${partsEditor(t)}
    ${t?'':`<div class="f"><span>Attachments (optional)</span>
      <div class="clf-list" data-id="tf-${kind}-${mode}">${clfChips('tf-'+kind+'-'+mode)}</div>
      <label class="btn sm ghost clf-add">${CLIP_IC} ${(CL_FILES['tf-'+kind+'-'+mode]||[]).length?'Add more files':'Add files'}<input type="file" multiple class="cl-files" data-id="tf-${kind}-${mode}" hidden></label>
      <span class="hint" style="margin:2px 0 0">Add as many files as you need, one at a time or many at once. PDF, Word, Excel, PowerPoint, photos — up to 20 MB each. The AI reads them and writes a short brief for the manager.</span></div>`}
    <div class="row">
      <fieldset class="f"><legend>Priority</legend><div class="seg">
        ${pri.map((p,i)=>`<label><input type="radio" name="priority" value="${p}" ${(t?t.priority===p:i===0)?'checked':''}><span>${p}</span></label>`).join('')}
      </div></fieldset>
      <label class="f days">Duration (days)<input type="number" name="days" min="1" max="60" value="${t?t.days:1}"></label>
    </div>

      ${t?'<button type="button" class="btn ghost" data-act="cancel-edit">Cancel</button>':''}

function reportBlock(owner, d, canReview){
  const k = owner+'|'+d, c = db.closures[k];
  const ts = (c.tasks||[]).map(id=>db.tasks.find(t=>t.id===id)).filter(Boolean);
  const done = ts.filter(t=>t.log[d]?.progress>=100).length;
  const avg = ts.length ? Math.round(ts.reduce((s,t)=>s+(t.log[d]?.progress||0),0)/ts.length) : 0;
  const emg = ts.filter(t=>t.priority==='Emergency').length;
  const extra = ts.filter(t=>t.category==='extra').length;
  const pend = !c.ai || c.ai.status!=='done';
  let h = aiResultBlock(owner, d) + `<div class="sum">
    <div><b>${ts.length}</b>tasks</div><div><b>${done}</b>completed</div>
    <div><b>${ts.length-done}</b>carried to next day</div><div><b>${pend?'…':avg+'%'}</b>AI progress</div>
    <div><b>${extra}</b>additional work</div>${emg?`<div><b>${emg}</b>emergency</div>`:''}
  </div>`;
  if (ts.length){
    h += `<div class="tscroll"><table class="rep"><thead><tr><th>Task</th><th>Type</th><th>AI rating</th><th>What the employee wrote</th><th>AI note</th></tr></thead><tbody>
    ${ts.map(t=>{ const l=t.log[d]||{progress:0}; return `<tr>
      <td><b>${esc(t.title)}</b><br><span class="b">Day ${diffDays(t.startDate,d)+1} of ${t.days}</span>${t.assignedBy?` <span class="b asg">by ${esc(userName(t.assignedBy))}</span>`:''}${filesHtml(t)}</td>
      <td>${priBadge(t.priority)} <span class="b">${t.category==='extra'?'Additional':'Planned'}</span></td>
      <td class="pct ${l.pending?'':l.progress>=100?'full':'part'}">${l.pending?'<span class="hint" style="margin:0">pending</span>':l.progress+'%'}</td>
      <td>${l.justification?esc(l.justification):'—'}</td><td>${l.aiNote?esc(l.aiNote):'—'}</td></tr>`; }).join('')}
    </tbody></table></div>`;
  }
  h += `<div class="hint">Submitted ${fmtStamp(c.submittedAt)}${c.editedAt?' · last edited '+fmtStamp(c.editedAt):''} · goes to ${esc(mgrNames(owner))}</div>`;
  if (c.review){
    h += `<div class="review"><div class="meta">Review by ${esc(userName(c.review.by))} · ${fmtStamp(c.review.at)}</div><p>${esc(c.review.text)}</p></div>`;
  } else if (canReview){
    h += `<div style="margin-top:12px"><label class="f">Your review<textarea rows="3" class="revtxt" data-k="${k}" placeholder="Analysis and feedback on this closure report"></textarea></label>
      <div class="err" hidden></div>
      <div class="row end"><button class="btn" data-act="save-review" data-k="${k}">Submit review</button></div></div>`;
  } else {
    h += `<div class="hint">Awaiting review by ${esc(mgrNames(owner))}.</div>`;
  }
  if (needsCeoReview(owner)){
    if (c.ceoReview){
      h += `<div class="review" style="border-left-color:var(--brand)"><div class="meta">CEO review by ${esc(userName(c.ceoReview.by))} · ${fmtStamp(c.ceoReview.at)}</div><p>${c.ceoReview.ok&&!c.ceoReview.text?'Okay ✓':esc(c.ceoReview.text)}${c.ceoReview.ok&&c.ceoReview.text?' <span class="b asg">Okay ✓</span>':''}</p></div>`;
    } else if (isCeo(ui.user)){
      h += `<div style="margin-top:12px"><label class="f">CEO comment (optional for "Okay")<textarea rows="2" class="ceotxt" data-k="${k}" placeholder="Add a comment for ${esc(userName(owner))}"></textarea></label>
        <div class="err" hidden></div>
        <div class="row end"><button class="btn ghost" data-act="ceo-comment" data-k="${k}">Add comment</button><button class="btn" data-act="ceo-ok" data-k="${k}">Okay</button></div></div>`;
    } else h += `<div class="hint">Also goes to the CEO for review.</div>`;
  }
  return h;
}

/* ===== Views ===== */
function staffView(n){
  const u = ui.user, d = n.date, ph = phaseFor(n.mins,u), ck = db.closures[u+'|'+d];
  const act = activeTasks(u,d);
  const carried = act.filter(t=>t.startDate<d);
  const planned = act.filter(t=>t.startDate===d && t.category==='planned');
  const extra   = act.filter(t=>t.startDate===d && t.category==='extra');
  const planOpen = ph==='plan' && !ck;
  let h = (isField(u) ? fieldCard(u,n) : '') + timeline(ph,u);

  h += `<section class="card"><div class="sec-h"><h2>1 · Morning plan</h2>${
    ph==='before'?pill('soon',`Opens ${CONFIG.planOpen}`):planOpen?pill('open',`Open until ${CONFIG.planClose}`):pill('locked','Locked')}</div>`;
  if (planOpen) h += taskForm('self','plan');
  else if (ph==='before') h += note(`The planning portal opens at ${CONFIG.planOpen}. Your manager can already assign work to you.`);
  else h += note(`Planning closed at ${CONFIG.planClose}. Planned work can no longer be added or changed.`, true);
  if (carried.length) h += `<h3 class="sub">Carried forward from previous days (locked)</h3>` + carried.map(t=>taskCard(t,n)).join('');
  h += `<h3 class="sub">Planned today</h3>` + (planned.length ? planned.map(t=>taskCard(t,n)).join('') : `<div class="empty">No planned tasks.</div>`);
  h += `</section>`;

  const extraOpen = ph==='extra' && !ck;
  h += `<section class="card"><div class="sec-h"><h2>2 · Additional work</h2>${
    extraOpen?pill('open','Open until you finish your day'):ORDER[ph]<ORDER.extra?pill('soon',`Opens ${CONFIG.planClose}`):pill('locked','Closed')}</div>`;
  if (extraOpen) h += taskForm('self','extra');
  else if (ORDER[ph]<ORDER.extra) h += note(`Additional work can be added after the morning plan closes at ${CONFIG.planClose}.`);
  else h += note(ck ? 'You have finished your day. Additional work is closed.' : `Additional work closed at ${deadlineOf(u)}.`, true);
  h += `<h3 class="sub">Additional work today</h3>` + (extra.length ? extra.map(t=>taskCard(t,n)).join('') : `<div class="empty">No additional work.</div>`);
  h += `</section>`;

  const dl = deadlineOf(u);
  h += `<section class="card" id="closureCard"><div class="sec-h"><h2>3 · Closure report</h2>${
    ck?pill('locked','Submitted'):ph==='over'?pill('miss','Deadline missed'):ui.closing&&ph==='extra'?pill('open',`Submit by ${dl}`):ph==='extra'?pill('soon','When you finish'):pill('soon',`From ${CONFIG.planClose}`)}</div>`;
  if (ck && ui.editClosure && closureEditable(u,d)) h += `<p class="hint" style="margin-top:0">Change what you wrote, then save. The AI will rate your work again. You can edit until your manager reviews the report.</p>` + closureForm((ck.tasks||[]).map(id=>db.tasks.find(t=>t.id===id)).filter(Boolean), d, ck);
  else if (ck) h += `<div class="ok-msg">Closure report submitted to ${esc(mgrNames(u))}. Incomplete tasks will appear automatically tomorrow morning.</div>` + reportBlock(u,d,false)
      + (closureEditable(u,d) ? `<div class="row" style="margin-top:8px"><button class="btn sm ghost" data-act="close-edit">Edit my report</button><span class="hint" style="margin:0">Possible until ${esc(mgrNames(u))} reviews it.</span></div>` : '');
  else if (ph==='extra' && ui.closing) h += meetingBlock(u) + `<p class="hint" style="margin-top:0">For every task, including additional work, write what you did — and if it isn't finished, what is left and why. The AI then rates how much of each task is complete against its objective; you don't enter percentages. Deadline: ${dl}.</p>` + closureForm(act,d)
      + `<div class="row" style="margin-top:6px"><button class="btn sm ghost" data-act="close-cancel">Not yet, keep working</button></div>`;
  else if (ph==='extra') h += `<div class="va-row"><button class="btn" data-act="close-start">Finish my day</button>
      <p class="hint" style="margin:0">When your work is done, press this to write your closure report. Until then, you and your manager can keep adding additional work. Deadline: ${dl}.</p></div>`;
  else if (ph==='over') h += note(`The closure deadline (${dl}) has passed and no report was submitted. This will show as missed to ${esc(mgrNames(u))}. Open tasks will still carry forward.`, true, true);
  else h += note(`You can write your closure report after ${CONFIG.planClose}, whenever you finish your day. Deadline: ${dl}.`);
  h += `</section>`;
  return h;
}

function reviewView(n){

  const pending = Object.keys(db.closures).map(k=>{ const [owner,date] = k.split('|'); return { k, owner, date, c:db.closures[k] }; })

      .filter(x=>needsCeoReview(x.owner) && !x.c.ceoReview).sort((a,b)=>a.date.localeCompare(b.date));
    h += `<section class="card"><div class="sec-h"><h2>Sales heads — your review</h2>${sp.length?pill('locked',`${sp.length} report${sp.length===1?'':'s'}`):pill('open','All reviewed')}</div>
      <p class="hint" style="margin-top:0">Closure reports from the regional sales heads, with the General Manager's review. Say "Okay" or add your comment; they will see it on their report.</p>`;
    if (!sp.length) h += note('No sales reports waiting for you.');
    sp.forEach(x=>{ const u = getUser(x.owner);
      h += `<div class="crow"><div class="ctitle" style="margin-bottom:8px">${esc(u.name)} <span class="b">${esc(u.title)}</span> <span class="b">${fmtDate(x.date)}</span>${x.c.review?pill('open','GM reviewed'):pill('soon','GM review pending')}</div>${reportBlock(x.owner,x.date,false)}</div>`; });
    h += `</section>`;
  }

  /* 1c. AI summaries of each person's day */
  SUM_REQ = { ids:reps.map(r=>r.id), d };
  h += `<section class="card"><div class="sec-h"><h2>Team work — AI summary</h2><span class="hint" style="margin:0">${fmtDate(d)}</span></div>
    ${reps.filter(r=>hasOwnReport(r.id)).map(r=>{ const x = daySumHtml(r.id, d); return `<div class="crow"><div class="ctitle" style="margin-bottom:4px">${esc(r.name)} <span class="b">${esc(r.title)}</span></div>${x || '<div class="hint" style="margin:0">No work entered for this date.</div>'}</div>`; }).join('') || note('No team members.')}</section>`;

  /* 2. History by date */
  h += `<section class="card"><div class="sec-h"><h2>Team reports by date</h2>
    <label class="who">Date <input type="date" id="revDate" value="${d}" class="sel"></label></div>
    <div class="hint" style="margin-top:0">${fmtDate(d)} · ${reps.length} direct report${reps.length===1?'':'s'}</div>`;
  reps.forEach(u=>{
    const c = db.closures[u.id+'|'+d];
    const missed = !c && (d<n.date || (d===n.date && phaseFor(n.mins,u.id)==='over'));
    h += `<div class="crow"><div class="sec-h"><div class="ctitle">${esc(u.name)} <span class="b">${esc(u.title)}</span></div>${
      c ? (c.review?pill('open','Reviewed'):pill('locked','Awaiting your review'))
        : missed ? pill('miss','Missed deadline') : pill('soon','Not submitted yet')}</div>`;
    if (c && c.review) h += reportBlock(u.id,d,false);
    else if (c) h += `<div class="hint" style="margin-top:0">Write your review in "Waiting for your review" at the top.</div>`;
    else if (missed) h += note(`No closure report was submitted by the ${deadlineOf(u.id)} deadline.`, false, true);
    else h += note(`Not finished yet (deadline ${deadlineOf(u.id)}). The review box appears once ${esc(u.name)} presses Finish my day and submits.`);
    h += `</div>`;
  });
  h += `</section>`;
  return h;
}

const checkinsOf = (id, d) => (db.checkins||[]).filter(c=>c.owner===id && c.date===d).sort((a,b)=>a.time.localeCompare(b.time));
const PIN = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>';
/* ===== Clock-face time picker (drag the hands) ===== */
const CLK_STEP = 5;   // minute hand moves in 5-minute steps
function clkHands(h,m){ return { ha:((h%12)+m/60)*30, ma:m*6 }; }
/* Digital time picker: hours and minutes with up/down buttons (or type), plus AM/PM. Value "HH:MM" (24 h) in a hidden input. */
function clockPicker(name, value){
  let [h,m] = (value||'10:00').split(':').map(Number);
  const inputAttr = name==='mTime' ? 'id="mTime" name="mTime"' : `name="${name}"`;
  const col = (f, v, lbl) => `<div class="dclk-col"><button type="button" class="dclk-b" data-act="dclk" data-f="${f}" data-d="1" aria-label="${lbl} up">▲</button>
      <input class="dclk-in" data-f="${f}" inputmode="numeric" maxlength="2" value="${pad(v)}" aria-label="${lbl}"><button type="button" class="dclk-b" data-act="dclk" data-f="${f}" data-d="-1" aria-label="${lbl} down">▼</button></div>`;
  return `<div class="clk dclk" data-h="${h}" data-m="${m}">
    <div class="dclk-row">${col('h', h%12||12, 'Hour')}<span class="dclk-sep">:</span>${col('m', m, 'Minutes')}
      <div class="clk-ap dclk-ap"><button type="button" data-act="clk-ap" data-ap="am" class="${h<12?'on':''}">AM</button><button type="button" data-act="clk-ap" data-ap="pm" class="${h>=12?'on':''}">PM</button></div></div>
    <div class="hint" style="margin:4px 0 0">Use ▲ ▼ or type the hour and minutes. Minutes move in steps of ${CLK_STEP}.</div>
    <input type="hidden" ${inputAttr} value="${pad(h)}:${pad(m)}"></div>`;
}
function clkSet(el, h, m){
  h = ((h%24)+24)%24; m = ((m%60)+60)%60;
  el.dataset.h = h; el.dataset.m = m;
  const hi = el.querySelector('.dclk-in[data-f=h]'), mi = el.querySelector('.dclk-in[data-f=m]');
  if (hi && document.activeElement!==hi) hi.value = pad(h%12||12);
  if (mi && document.activeElement!==mi) mi.value = pad(m);
  el.querySelectorAll('[data-ap]').forEach(b=>b.classList.toggle('on', (b.dataset.ap==='pm') === (h>=12)));
  el.querySelector('input[type=hidden]').value = `${pad(h)}:${pad(m)}`;
}
document.addEventListener('input', e=>{
  if (!e.target.classList || !e.target.classList.contains('dclk-in')) return;
  const el = e.target.closest('.clk'), v = parseInt(e.target.value.replace(/\D/g,''),10); if (isNaN(v)) return;
  const h = +el.dataset.h, pm = h>=12;
  if (e.target.dataset.f==='h'){ if (v>=1 && v<=12) clkSet(el, (v%12) + (pm?12:0), +el.dataset.m); }
  else if (v>=0 && v<=59) clkSet(el, h, v);
});
document.addEventListener('focusout', e=>{ if (e.target.classList && e.target.classList.contains('dclk-in')){ const el = e.target.closest('.clk'); e.target.value = e.target.dataset.f==='h' ? pad((+el.dataset.h)%12||12) : pad(+el.dataset.m); } });
let clkDrag = null;
function clkPoint(svg, e){ const r = svg.getBoundingClientRect(); return { x:(e.clientX-r.left)/r.width*240-120, y:(e.clientY-r.top)/r.height*240-120 }; }
function clkMove(e){
  const { el, svg, hand } = clkDrag, p = clkPoint(svg, e);
  let ang = Math.atan2(p.x, -p.y)*180/Math.PI; if (ang < 0) ang += 360;
  let h = +el.dataset.h, m = +el.dataset.m;
  if (hand==='h') h = (Math.round(ang/30)%12) + (h>=12?12:0);
  else m = (Math.round(ang/(6*CLK_STEP))*CLK_STEP)%60;
  clkSet(el, h, m);
}
document.addEventListener('pointerdown', e=>{
  const svg = e.target.closest('.clk-face'); if (!svg) return;
  const el = svg.closest('.clk'), p = clkPoint(svg, e), g = e.target.closest('.hand');
  clkDrag = { el, svg, hand: g ? g.dataset.hand : (Math.hypot(p.x,p.y) < 62 ? 'h' : 'm') };
  try{ svg.setPointerCapture(e.pointerId); }catch(_){}
  e.preventDefault(); clkMove(e);
});
document.addEventListener('pointermove', e=>{ if (clkDrag) clkMove(e); });
document.addEventListener('pointerup', ()=>{ clkDrag = null; });
document.addEventListener('pointercancel', ()=>{ clkDrag = null; });
document.addEventListener('keydown', e=>{
  if (e.key==='Enter' && !e.shiftKey && e.target.closest && e.target.closest('.chatf')){ e.preventDefault(); addDiary(e.target.closest('.chatf')); return; }
  const g = e.target.closest && e.target.closest('.hand'); if (!g) return;
  const d = { ArrowUp:1, ArrowRight:1, ArrowDown:-1, ArrowLeft:-1 }[e.key]; if (!d) return;
  e.preventDefault(); const el = g.closest('.clk');
  if (g.dataset.hand==='h') clkSet(el, +el.dataset.h + d, +el.dataset.m); else clkSet(el, +el.dataset.h, +el.dataset.m + d*CLK_STEP);
});

/* ===== Who can assign work to whom ===== */
function assignableBy(id){
  const r = getUser(id).role;
  if (r==='CEO') return USERS.filter(u=>u.id!==id);                                  // CEO: everyone
  if (r==='General Manager') return USERS.filter(u=>u.id!==id && u.role!=='CEO');   // GM: everyone except the CEO
  const ind = indirectOf(id);                                                          // others: direct team,
  return teamOf(id).concat(ind.length ? USERS.filter(u=>u.role==='General Manager' && getUser(id).managers.includes(u.id)) : []); // + indirect team and their GM
}

const sortName = u => u.name.replace(/^(dr|mr|mrs|ms)\.?\s+/i,'');
function rankPeople(list, q){
  q = (q||'').trim().toLowerCase();
  const by = (a,b) => sortName(a).localeCompare(sortName(b));
  if (!q) return { starts:[], rest:[...list].sort(by), q };
  const starts = [], rest = [];
  list.forEach(u=>{ const n = u.name.toLowerCase();
    if (sortName(u).toLowerCase().startsWith(q) || n.startsWith(q)) starts.push(u); else if (n.includes(q)) rest.push(u); });
  return { starts:starts.sort(by), rest:rest.sort(by), q };
}

const STT_LANG = 'en-IN';   // change to 'en-US', 'hi-IN' (Hindi) or 'ar-AE' (Arabic) if needed
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const MIC = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>';
let recog = null, recogEl = null;
function decorateSTT(){
  document.querySelectorAll('#main textarea, #main input[type=text], #main input:not([type]), #main input[type=search], #camModal textarea, #camModal input[name=name]').forEach(el=>{
    if (el.dataset.stt || el.classList.contains('pick-in') || el.classList.contains('dclk-in') || el.closest('.stt')) return;
    el.dataset.stt = '1';
    const w = document.createElement('span'); w.className = 'stt';
    el.parentNode.insertBefore(w, el); w.appendChild(el);
    w.insertAdjacentHTML('beforeend', `<button type="button" class="stt-btn" data-act="stt" aria-label="Voice typing" title="Voice typing">${MIC}</button>`);
  });
}
function tip(title, text){
  let t = document.getElementById('toast');
  if (!t){ t = document.createElement('div'); t.id='toast'; t.setAttribute('role','status'); t.title='Tap to close'; t.addEventListener('click',()=>{ t.hidden = true; }); document.body.appendChild(t); }
  t.innerHTML = `<b>${esc(title)}</b><span>${esc(text)}</span><span class="x">Tap to close</span>`; t.hidden = false;
  clearTimeout(tip.h); tip.h = setTimeout(()=>{ t.hidden = true; }, 7000);
}
function toggleDictation(btn){
  const el = btn.parentElement.querySelector('input,textarea');
  if (!SR) return tip('Voice typing', 'Voice typing is not available in this browser. Please use Chrome, Edge or Safari.');
  if (recog){ const same = recogEl===el; recog.stop(); if (same) return; }
  wakePause();
  const r = new SR(); r.lang = STT_LANG; r.interimResults = true; r.continuous = true;
  const base = el.value ? el.value.replace(/\s*$/, ' ') : ''; let fin = '';
  r.onresult = e=>{ let interim = ''; for (let i=e.resultIndex; i<e.results.length; i++){ const x = e.results[i]; if (x.isFinal) fin += x[0].transcript + ' '; else interim += x[0].transcript; }
    el.value = (base + fin + interim).replace(/\s+$/, ' '); el.dispatchEvent(new Event('input', { bubbles:true })); };
  r.onerror = e=>{ if (e.error==='not-allowed' || e.error==='service-not-allowed') tip('Voice typing','Microphone permission was refused. Allow the microphone for this page in the browser settings, then tap the mic again.');
    else if (e.error==='network') tip('Voice typing','Voice typing needs an internet connection.');
    else if (e.error==='no-speech') tip('Voice typing','No speech was heard. Tap the mic and speak again.'); };
  r.onend = ()=>{ wakeResume(); btn.classList.remove('rec'); if (recog===r){ recog = null; recogEl = null; } el.value = el.value.replace(/\s+$/, ''); el.dispatchEvent(new Event('input', { bubbles:true })); };
  try { r.start(); } catch(err){ return tip('Voice typing','Voice typing could not start. Try again.'); }
  recog = r; recogEl = el; btn.classList.add('rec'); el.focus();
}

/* ===== Assign by voice (AI works out who / what / priority / days) ===== */
let VA = null;   // { stage: listening|thinking|confirm|done|error, said, task, msg }
function listenOnce(){
  return new Promise((resolve, reject)=>{
    if (!SR) return reject(new Error('Voice is not available in this browser. Please use Chrome, Edge or Safari.'));
    const r = new SR(); r.lang = STT_LANG; r.interimResults = false; r.continuous = false; let got = '';
    if (typeof wakePause==='function') wakePause();
    r.onresult = e=>{ got = Array.from(e.results).map(x=>x[0].transcript).join(' '); };
    r.onerror = e=>reject(new Error(e.error==='not-allowed' || e.error==='service-not-allowed' ? 'Microphone permission was refused. Allow the microphone for this page and try again.'
      : e.error==='no-speech' ? 'No speech was heard.' : e.error==='network' ? 'Voice needs an internet connection.' : 'Voice could not start ('+e.error+').'));
    r.onend = ()=>{ if (typeof wakeResume==='function') wakeResume(); resolve(got.trim()); };
    setTimeout(()=>{ try { r.start(); } catch(err){ if (typeof wakeResume==='function') wakeResume(); reject(new Error('Voice could not start. Try again.')); } }, WAKE && WAKE.on ? 250 : 0);
  });
}
/* Densons' voice: a male Indian-English voice when the device has one, else the most suitable male voice; deeper pitch for a bold sound.
   Which voices exist depends on the browser/device (e.g. Edge offers "Microsoft Prabhat … English (India)", Windows "Microsoft Ravi"). */
const MALE_IN = /prabhat|ravi|madhur|hemant|kunal|aarav|arjun|rishi|rehaan|rahul|male/i;
const MALE_ANY = /\bmale\b|prabhat|ravi|madhur|hemant|david|mark|guy|ryan|george|daniel|james|thomas|christopher|eric|brian|andrew|fred|alex\b|aaron|arthur|oliver/i;
const FEMALE = /female|heera|neerja|kalpana|swara|veena|lekha|aditi|raveena|zira|hazel|susan|samantha|karen|moira|tessa|fiona|victoria|aria|jenny|libby|sonia|emma|ava|allison|google (uk english female|us english)|हिन्दी/i;
let DVOICE = null;
function pickVoice(){
  try{
    const vs = speechSynthesis.getVoices(); if (!vs.length) return null;
    const lang = v => (v.lang||'').toLowerCase().replace('_','-');
    const enIN = vs.filter(v => lang(v)==='en-in'), hiIN = vs.filter(v => lang(v)==='hi-in');
    const male = (list, re) => list.filter(v => re.test(v.name) && !FEMALE.test(v.name.replace(/\bmale\b/i,'')));
    const nat = l => l.sort((a,b)=> (/natural|online|neural/i.test(b.name)?1:0) - (/natural|online|neural/i.test(a.name)?1:0));
    DVOICE = nat(male(enIN, MALE_IN))[0] || nat(male(hiIN, MALE_IN))[0]
          || nat(male(vs.filter(v=>/^en-(gb|in|au)/.test(lang(v))), MALE_ANY))[0]
          || nat(male(vs.filter(v=>/^en/.test(lang(v))), MALE_ANY))[0]
          || enIN.filter(v=>!FEMALE.test(v.name))[0] || null;
  }catch(_){ DVOICE = null; }
  return DVOICE;
}
try{ if ('speechSynthesis' in window){ pickVoice(); speechSynthesis.addEventListener('voiceschanged', pickVoice); } }catch(_){}
function speak(text){
  return new Promise(res=>{ try{ if (!('speechSynthesis' in window)) return res(); const u = new SpeechSynthesisUtterance(text);
    const v = DVOICE || pickVoice(); if (v){ u.voice = v; u.lang = v.lang; } else u.lang = STT_LANG;
    u.pitch = 0.78; u.rate = 0.93; u.volume = 1;
    u.onend = res; u.onerror = res; speechSynthesis.cancel(); speechSynthesis.speak(u); setTimeout(res, 20000); }catch(e){ res(); } });
}

function parseJSONLoose(t){ const a = t.indexOf('{'), b = t.lastIndexOf('}'); if (a<0 || b<a) throw new Error('The AI reply could not be read.'); return JSON.parse(t.slice(a, b+1)); }
async function voiceAssign(){
  const n = now(), mode = assignMode(n.mins);
  setVA({ stage:'listening' });
  let said;
  try { said = await listenOnce(); } catch(e){ setVA({ stage:'error', msg:e.message }); speak(e.message); return; }
  if (!said){ setVA({ stage:'error', msg:'No speech was heard. Tap the mic and try again.' }); return; }
  setVA({ stage:'thinking', said });
  const people = assignableBy(ui.user).filter(u=>!closedToday(u.id, n.date)), pri = mode==='plan' ? PLAN_PRI : EXTRA_PRI;
  const prompt = `You turn a manager's spoken instruction into one work task. Reply with ONLY a JSON object, no other text, like:
{"assignee_id":"","title":"","details":"","priority":"","days":1,"question":""}
Rules:
- assignee_id: exactly one id from the list below. Match first names, surnames or nicknames. If the name could fit more than one person, or no one fits, leave it empty and write a short question.

- details: anything else useful (deadline, quantities, place), or empty.
- priority: one of ${pri.map(p=>'"'+p+'"').join(', ')}. ${mode==='extra'?'Use "Emergency" only if they say urgent, emergency or immediately.':'Use "Important" if they say important or urgent, "Daily Work" for routine daily jobs, otherwise "Moderate".'}
- days: how many days the task takes. If they give a deadline (e.g. "by Thursday"), count days from today up to and including that day. Default 1.

People (id: name, job title):
${people.map(u=>`${u.id}: ${u.name}, ${u.title}`).join('\n')}
Spoken instruction: "${said.replace(/"/g,"'")}"`;
  let j;

  const owner = people.some(u=>u.id===j.assignee_id) ? j.assignee_id : '';
