name: Deploy server functions
# Optional: the functions are currently deployed directly to Supabase.
# Run this by hand (Actions tab) only after adding the two secrets below.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Check secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then
            echo "Add SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF in Settings > Secrets and variables > Actions"; exit 1; fi
      - run: supabase functions deploy ai --project-ref "$PROJECT_REF"
      - run: supabase functions deploy notify --project-ref "$PROJECT_REF"
      - run: supabase functions deploy reminders --project-ref "$PROJECT_REF" --no-verify-jwt
